<title>CLF Coaching — Coach Dashboard</title>
<meta name="description" content="CLF Protocol Coach Dashboard powered by Supabase: client roster, program builder, coach notes, strength trajectory, measurements, and Apple Health sync.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050707;color-scheme:dark}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.coach{
  --bg:#050707; --side:#080B0B; --surface:#0C1011; --surface-2:#111617; --sunken:#171E1F;
  --line:rgba(255,255,255,.07); --line-soft:rgba(255,255,255,.045); --line-2:rgba(255,255,255,.11);
  --text:#ECF3F2; --text-2:#9AA7A6; --text-3:#5F6B6B;
  --accent:#2DD4BF; --accent-text:#5EEAD4; --accent-tint:rgba(45,212,191,.10); --accent-line:rgba(45,212,191,.32); --on-accent:#022320;
  --ok:#4ADE80; --ok-tint:rgba(74,222,128,.10); --warn:#F2B84B; --warn-tint:rgba(242,184,75,.10); --bad:#F2706A; --bad-tint:rgba(242,112,106,.10);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:inset 0 1px 0 rgba(255,255,255,.03),0 1px 2px rgba(0,0,0,.45);
  --ease:cubic-bezier(.2,.7,.2,1);
  font-family:var(--font);font-size:14px;line-height:1.45;color:var(--text);
  background:radial-gradient(1100px 460px at 30% -220px,rgba(45,212,191,.06),transparent 70%) no-repeat,var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;
}
.mono,.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* Auth */
.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:28px 24px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.auth-card h1{font-size:22px;margin:0}
.auth-card p{color:var(--text-2);font-size:13.5px;margin:8px 0 20px}
.auth-msg{margin-top:12px;font-size:13px;min-height:18px;color:var(--text-2)}
.auth-msg.bad{color:var(--bad)} .auth-msg.ok{color:var(--ok)}

.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(160deg,#5EEAD4,#14B8A6);color:var(--on-accent);display:grid;place-items:center;font:700 10px/1 var(--mono);letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.2)}
.brand-title{font-weight:600;font-size:14px;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--text-3)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--text-2);font-size:13.5px;font-weight:500;text-align:left}
.nav-btn:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-btn[aria-current=true]{background:var(--surface-2);color:var(--text);box-shadow:var(--shadow)}
.nav-btn[aria-current=true] svg.i{stroke:var(--accent)}

async function sendCoachAutomation(payload, fallbackHref) {
  if (S.mode === 'demo') {
    S.autoLogs.unshift({
      id: 'dl-' + Date.now(),
      event_type: payload.template || payload.action || 'email',
      recipient_email: payload.to || 'kyle@clashlabfitness.com',
      subject: payload.label || payload.template || payload.action,
      status: 'sent_demo',
      created_at: new Date().toISOString(),
    });
    toast(`Sent ${payload.label || 'branded CLF email'} (demo)`);
    render();
    return true;
  }
  try {
    S.autoBusy = true;
    const { data: { session } } = await sb.auth.getSession();
    const token = session?.access_token || SUPABASE_KEY;
    const res = await fetch(`${SUPABASE_URL}/functions/v1/clf-automations`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${token}`,
      },
      body: JSON.stringify(payload),
    });
    S.autoBusy = false;
    if (res.ok) {
      const out = await res.json().catch(() => ({}));
      toast(out.message || `Sent ${payload.label || 'CLF email'} via Resend`);
      await fetchAll();
      return true;
    }
    if (fallbackHref) {
      toast('Edge Function not active yet; opening mail app fallback');
      location.href = fallbackHref;
      return false;
    }
    const errBody = await res.text().catch(() => '');
    toast('Automation error: ' + (errBody.slice(0, 80) || res.status));
    return false;
  } catch (err) {
    S.autoBusy = false;
    if (fallbackHref) {
      toast('Opening mail app fallback');
      location.href = fallbackHref;
      return false;
    }
    toast('Network error triggering automation');
    return false;
  }
}

function parseIntakeSupps(inRow) {
  const fromArr = Array.isArray(inRow?.supplements) ? inRow.supplements.filter(Boolean) : [];
  if (fromArr.length) return fromArr;
  const m = String(inRow?.typical_eating || '').match(/\[Supplements:\s*([^\]]+)\]/i);
  if (!m) return [];
  return m[1].split(',').map(s => s.trim()).filter(s => s && s.toLowerCase() !== 'none currently');
}

function cleanIntakeEating(inRow) {
  return String(inRow?.typical_eating || '').replace(/\s*\[Supplements:[^\]]*\]\s*/ig, '').trim();
}

function coachSuppStartWk(c, supp) {
  if (!supp?.started_at || !c?.start_date) return 1;
  const diff = Math.floor((parseYmd(supp.started_at) - parseYmd(c.start_date)) / DAY_MS);
  return Math.max(1, Math.min(c.weeks || 8, Math.floor(diff / 7) + 1));
}

function coachSuppWkAdh(c, supp, suppLogs, wk) {
  if (!c?.start_date) return null;
  const wkStart = parseYmd(c.start_date).getTime() + (wk - 1) * 7 * DAY_MS;
  const todayMs = parseYmd(ymd(new Date())).getTime();
  const sStartMs = supp.started_at ? parseYmd(supp.started_at).getTime() : wkStart;
  let elig = 0, taken = 0;
  for (let i = 0; i < 7; i++) {
    const ms = wkStart + i * DAY_MS;
    if (ms > todayMs || ms < sStartMs) continue;
    elig++;
    if (suppLogs?.[`${supp.id}|${ymd(new Date(ms))}`]) taken++;
  }
  return elig ? Math.round((taken / elig) * 100) : null;
}

function coachSuppAdh(supp, suppLogs, maxDays = 28) {
  const todayMs = parseYmd(ymd(new Date())).getTime();
  const startMs = supp.started_at ? parseYmd(supp.started_at).getTime() : todayMs;
  const earliest = Math.max(startMs, todayMs - (maxDays - 1) * DAY_MS);
  let elig = 0, taken = 0;
  for (let ms = earliest; ms <= todayMs; ms += DAY_MS) {
    elig++;
    if (suppLogs?.[`${supp.id}|${ymd(new Date(ms))}`]) taken++;
  }
  return elig ? Math.round((taken / elig) * 100) : 100;
}

function coachSuppStreak(supp, suppLogs) {
  const base = parseYmd(ymd(new Date()));
  let count = 0;
  let offset = suppLogs?.[`${supp.id}|${ymd(base)}`] ? 0 : 1;
  for (let i = offset; i < 365; i++) {
    const dStr = ymd(new Date(base.getTime() - i * DAY_MS));
    if (suppLogs?.[`${supp.id}|${dStr}`]) count++;
    else break;
  }
  return count;
}

function currentWeek(c) {
  if (!c?.start_date) return 1;
  return Math.max(1, Math.min(c.weeks || 8, Math.floor((new Date() - parseYmd(c.start_date)) / DAY_MS / 7) + 1));
}

function daysRemaining(c) {
  if (!c?.start_date) return null;
  const end = parseYmd(c.start_date).getTime() + (c.weeks || 8) * 7 * DAY_MS;
  return Math.ceil((end - Date.now()) / DAY_MS);
}

  d.exercises.forEach(e => {

    if (!prescribedLowMap.has(low)) prescribedLowMap.set(low, e.name);
    prescribedDayLow.add(`${String(e.day_name || '').toLowerCase()}|${low}`);
  });
  const compSet = new Set(
    d.exercises
      .filter(e => !e.is_bodyweight && !/curl|tricep|calf|lateral|face pull|shrug|woodchop|plank|knee raise|abduction|adduction|kickback/i.test(e.name))
      .map(e => e.name.toLowerCase())
  );
  const allNameByLow = new Map();
  d.exercises.filter(e => !e.is_bodyweight).forEach(e => {
    const low = e.name.toLowerCase();
    if (!allNameByLow.has(low)) allNameByLow.set(low, e.name);
  });
  d.sets.forEach(s => {
    if (!s.done || !s.exercise_name || !Number(s.weight)) return;
    const low = s.exercise_name.toLowerCase();
    if (!allNameByLow.has(low)) allNameByLow.set(low, prescribedLowMap.get(low) || s.exercise_name);
  });
  const liftMap = {};
  const extraLiftSet = new Set();
  allNameByLow.forEach((canonName, low) => {
    const byWk = new Map();
    d.sets.filter(s => s.done && String(s.exercise_name || '').toLowerCase() === low && s.weight).forEach(s => {
      const val = e1rm(Number(s.weight), Number(s.reps || 0));
      if (val && (!byWk.has(s.week) || val > byWk.get(s.week))) byWk.set(s.week, val);
    });
    const pts = [...byWk.entries()].sort((a, b) => a[0] - b[0]).map(([w, v]) => ({ wk: w, v }));
    if (pts.length) {
      liftMap[canonName] = pts;
      if (!prescribedLowMap.has(low)) extraLiftSet.add(canonName);
    }
  });
  const extraMap = new Map();
  d.sets.forEach(s => {
    if (!s.done || !s.exercise_name || !s.day_name) return;
    const dKey = `${s.day_name.toLowerCase()}|${s.exercise_name.toLowerCase()}`;
    if (prescribedDayLow.has(dKey)) return;
    const cur = extraMap.get(dKey) || {
      day_name: s.day_name, name: s.exercise_name, sets: 0, reps: 12,
      is_bodyweight: true, bestE1: 0, bestSet: null, weeks: new Set(),
    };
    if (s.set_num > cur.sets) cur.sets = s.set_num;
    if (Number(s.weight) > 0) cur.is_bodyweight = false;
    cur.weeks.add(s.week);
    const est = Number(s.weight) > 0 ? e1rm(Number(s.weight), Number(s.reps || 0)) : null;
    if (est && est > cur.bestE1) { cur.bestE1 = est; cur.bestSet = s; cur.reps = Number(s.reps) || 12; }
    else if (!est && Number(s.reps) > (cur.bestSet?.reps || 0)) { cur.bestSet = s; cur.reps = Number(s.reps) || 12; }
    extraMap.set(dKey, cur);
  });
  const extraLogged = [...extraMap.values()].map(x => ({
    ...x,
    sets: Math.max(x.sets || 3, 1),
    bestText: x.bestSet ? (x.is_bodyweight ? `${x.bestSet.reps} reps (BW)` : `${x.bestSet.weight} lb × ${x.bestSet.reps}`) : '',
    weekCount: x.weeks.size,
  }));
  const compEntries = Object.entries(liftMap).filter(([n]) => compSet.has(n.toLowerCase()));
  const compSource = compEntries.length ? compEntries.map(([, p]) => p) : Object.values(liftMap);
  const byWkPct = new Map();
  compSource.forEach(pts => {
    const base = pts[0].v;
    pts.forEach(p => {
      if (!byWkPct.has(p.wk)) byWkPct.set(p.wk, []);
      byWkPct.get(p.wk).push(((p.v - base) / base) * 100);
    });
  });
  const comp = [...byWkPct.entries()].sort((a, b) => a[0] - b[0]).map(([w, arr]) => ({ wk: w, v: arr.reduce((a, b) => a + b, 0) / arr.length }));
  const strPct = comp.length ? comp[comp.length - 1].v : null;
  const daysSince = lastChk ? Math.round((new Date() - parseYmd(lastChk.date)) / DAY_MS) : null;
  const flags = [];
  if (daysSince == null || daysSince >= 3) flags.push({ bad: daysSince == null || daysSince >= 5, title: daysSince == null ? 'No check-ins logged yet' : `No check-in for ${daysSince} days`, body: lastChk ? `Last logged ${lastChk.date}` : 'Client has not submitted their first check-in.' });
  if (lastChk?.joint_comfort && lastChk.joint_comfort <= 5) flags.push({ bad: true, title: `Low ${c.joint_label || 'joint comfort'} (${lastChk.joint_comfort}/10)`, body: lastChk.notes || 'Check in before next session.' });
  return { d, wk, lastChk, latestWt, doneSetsWk, lifts: Object.keys(liftMap), liftMap, extraLiftSet, extraLogged, comp, strPct, flags, prescribedDayLow };
}

function linReg(pts) {
  if (pts.length < 2) return null;
  const n = pts.length, sx = pts.reduce((a, p) => a + p.wk, 0), sy = pts.reduce((a, p) => a + p.v, 0);
  const sxx = pts.reduce((a, p) => a + p.wk * p.wk, 0), sxy = pts.reduce((a, p) => a + p.wk * p.v, 0);
  const den = n * sxx - sx * sx;
  if (!den) return null;
  const m = (n * sxy - sx * sy) / den, b = (sy - m * sx) / n;
  return { m, b, at: x => m * x + b };
}

function svgTraj(pts, weeks, isAll, c, d) {
  if (!pts.length) return '<div style="padding:70px 20px;text-align:center;color:var(--text-3)">No completed sets logged yet.</div>';
  const W = 640, H = 220, P = { l: 44, r: 22, t: 20, b: 26 };
  const reg = linReg(pts), last = pts[pts.length - 1], proj = reg ? reg.at(weeks) : last.v;
  const vals = pts.map(p => p.v).concat(reg ? [proj] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 4) { lo -= 3; hi += 3; } else { const pad = (hi - lo) * 0.16; lo -= pad; hi += pad; }
  const x = w => P.l + ((w - 1) / Math.max(1, weeks - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const ticks = [lo, (lo + hi) / 2, hi].map(v => Math.round(v));
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.wk).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${line} L${x(last.wk).toFixed(1)},${H - P.b} L${x(pts[0].wk).toFixed(1)},${H - P.b} Z`;
  const actSupps = S.suppOverlay && c && d ? (d.supplements || []).filter(s => s.status === 'active') : [];
  let suppBands = '', suppPins = '';
  if (actSupps.length) {
    for (let w = 1; w <= weeks; w++) {
      const high = actSupps.some(s => { const p = coachSuppWkAdh(c, s, d.suppLogs, w); return p != null && p >= 85; });
      if (high) {
        const cx = x(w), bw = Math.min(44, (W - P.l - P.r) / Math.max(1, weeks));
        suppBands += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${P.t}" width="${bw.toFixed(1)}" height="${H - P.t - P.b}" rx="5" fill="rgba(251,191,36,.075)"/>`;
      }
    }
    const byWk = new Map();
    actSupps.forEach(s => {
      const sw = coachSuppStartWk(c, s);
      byWk.set(sw, (byWk.get(sw) || []).concat(s.name.split(/\s+/)[0]));
    });
    byWk.forEach((names, sw) => {
      const px = x(sw);
      const lbl = names.length > 1 ? `${names[0]} +${names.length - 1}` : `${names[0]} start`;
      const anchor = sw >= weeks - 1 ? 'end' : 'start';
      const tx = anchor === 'end' ? px - 5 : px + 5;
      suppPins += `<line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${P.t}" y2="${H - P.b}" stroke="#FBBF24" stroke-opacity=".78" stroke-width="1.4" stroke-dasharray="4 3"/>` +
        `<text x="${tx.toFixed(1)}" y="${P.t + 10}" text-anchor="${anchor}" font-size="10.5" fill="#FCD34D" font-family="Geist Mono,monospace">${esc(lbl)}</text>`;
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="clf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".16"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient></defs>
    ${suppBands}
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.06)"/><text x="${P.l - 10}" y="${y(t) + 3.5}" text-anchor="end" font-size="11" fill="#5F6B6B" font-family="Geist Mono,monospace">${isAll && t > 0 ? '+' + t + '%' : isAll ? t + '%' : t}</text>`).join('')}
    ${Array.from({ length: weeks }, (_, i) => `<text x="${x(i + 1)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#5F6B6B" font-family="Geist Mono,monospace">W${i + 1}</text>`).join('')}
    ${pts.length >= 2 ? `<path d="${area}" fill="url(#clf)"/>` : ''}
    ${suppPins}
    ${reg && last.wk < weeks ? `<line x1="${x(last.wk)}" y1="${y(last.v)}" x2="${x(weeks)}" y2="${y(proj)}" stroke="#2DD4BF" stroke-opacity=".8" stroke-width="1.8" stroke-dasharray="5 4"/>
      <circle cx="${x(weeks)}" cy="${y(proj)}" r="4.2" fill="#0C1011" stroke="#2DD4BF" stroke-width="2"/>
      <text x="${x(weeks) - 8}" y="${Math.max(14, y(proj) - 8)}" text-anchor="end" font-size="11" font-weight="600" fill="#5EEAD4" font-family="Geist Mono,monospace">W${weeks}: ${isAll ? (proj >= 0 ? '+' : '') + fmt(proj, 1) + '%' : fmt(proj, 0) + ' lb'}</text>` : ''}
    ${pts.length >= 2 ? `<path d="${line}" fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${pts.map((p, k) => `<circle cx="${x(p.wk)}" cy="${y(p.v)}" r="${k === pts.length - 1 ? 4.5 : 3}" fill="#2DD4BF" stroke="#0C1011" stroke-width="2"/>`).join('')}
    <text x="${x(last.wk) + 8}" y="${y(last.v) + 4}" font-size="11" font-weight="600" fill="#ECF3F2" font-family="Geist Mono,monospace">${isAll ? (last.v >= 0 ? '+' : '') + fmt(last.v, 1) + '%' : fmt(last.v, 0)}</text>
  </svg>`;
}

function svgWeight(c, chks, d) {
  const start = parseYmd(c.start_date), total = (c.weeks || 8) * 7;
  const pts = chks.filter(r => r.weight != null).map(r => ({ i: Math.round((parseYmd(r.date) - start) / DAY_MS), v: Number(r.weight) })).filter(p => p.i >= 0 && p.i <= total);
  if (!pts.length) return '<div style="padding:70px 20px;text-align:center;color:var(--text-3)">No weigh-ins logged yet.</div>';
  const W = 540, H = 220, P = { l: 42, r: 22, t: 20, b: 26 };
  const goal = c.targets?.weight;
  const vals = pts.map(p => p.v).concat(goal ? [goal] : []);
  const lo = Math.min(...vals) - 2, hi = Math.max(...vals) + 2;
  const x = i => P.l + (i / Math.max(1, total - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const ticks = [lo, (lo + hi) / 2, hi].map(v => Math.round(v));
  const path = pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const last = pts[pts.length - 1];
  const actSupps = S.suppOverlay && d ? (d.supplements || []).filter(s => s.status === 'active' && s.started_at) : [];
  let suppPins = '';
  if (actSupps.length) {
    const byDay = new Map();
    actSupps.forEach(s => {
      const di = Math.max(0, Math.min(total - 1, Math.round((parseYmd(s.started_at) - start) / DAY_MS)));
      byDay.set(di, (byDay.get(di) || []).concat(s.name.split(/\s+/)[0]));
    });
    byDay.forEach((names, di) => {
      const px = x(di);
      const lbl = names.length > 1 ? `${names[0]} +${names.length - 1}` : `${names[0]} start`;
      const anchor = di > total * 0.7 ? 'end' : 'start';
      const tx = anchor === 'end' ? px - 5 : px + 5;
      suppPins += `<line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${P.t}" y2="${H - P.b}" stroke="#FBBF24" stroke-opacity=".78" stroke-width="1.3" stroke-dasharray="4 3"/>` +
        `<text x="${tx.toFixed(1)}" y="${P.t + 10}" text-anchor="${anchor}" font-size="10.5" fill="#FCD34D" font-family="Geist Mono,monospace">${esc(lbl)}</text>`;
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.06)"/><text x="${P.l - 10}" y="${y(t) + 3.5}" text-anchor="end" font-size="11" fill="#5F6B6B" font-family="Geist Mono,monospace">${t}</text>`).join('')}
    ${goal ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(goal)}" y2="${y(goal)}" stroke="#7F8C8B" stroke-dasharray="3 4"/><text x="${W - P.r}" y="${y(goal) - 6}" text-anchor="end" font-size="11" fill="#7F8C8B">Goal ${goal} lb</text>` : ''}
    ${Array.from({ length: c.weeks || 8 }, (_, w) => `<text x="${x(w * 7 + 3)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#5F6B6B" font-family="Geist Mono,monospace">W${w + 1}</text>`).join('')}
    ${suppPins}
    <path d="${path}" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last.i)}" cy="${y(last.v)}" r="4.5" fill="#2DD4BF" stroke="#0C1011" stroke-width="2"/>
    <text x="${x(last.i) + 8}" y="${y(last.v) + 4}" font-size="11" font-weight="600" fill="#ECF3F2" font-family="Geist Mono,monospace">${fmt(last.v, 1)}</text>
  </svg>`;
}

function renderCoachSuppImpact(c, d, trajPts, isAll) {
  const act = (d.supplements || []).filter(s => s.status === 'active');
  if (!act.length) return '';
  const allWt = (d.checkins || []).filter(r => r.weight != null).sort((a, b) => a.date.localeCompare(b.date));
  const unitLbl = isAll ? '%' : ' lb';
  return `<div class="card card-pad" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div>
        <span class="card-title">Supplement Adherence vs. Trendlines</span>
        <span class="card-sub" style="margin-left:8px">Comparing pre-stack baseline against active adherence phases</span>
      </div>
      <button type="button" class="btn btn-sm" data-act="tab" data-v="supplements">Manage Stack →</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px">
      ${act.map(s => {
        const sw = coachSuppStartWk(c, s);
        const adh = coachSuppAdh(s, d.suppLogs, 28);
        const streak = coachSuppStreak(s, d.suppLogs);
        const onPts = (trajPts || []).filter(p => p.wk >= sw);
        let strTxt = `Started W${sw} · Logging active weeks`;
        if (onPts.length >= 2) {
          const g = +(onPts[onPts.length - 1].v - onPts[0].v).toFixed(1);
          const span = Math.max(1, onPts[onPts.length - 1].wk - onPts[0].wk);
          const rate = +(g / span).toFixed(1);
          strTxt = `${g >= 0 ? '+' : ''}${g}${unitLbl} since W${sw} (${rate >= 0 ? '+' : ''}${rate}${unitLbl}/wk)`;
        }
        let wtTxt = 'Awaiting weigh-ins';
        if (s.started_at && allWt.length >= 2) {
          const preW = allWt.filter(r => r.date < s.started_at);
          const onW = allWt.filter(r => r.date >= s.started_at);
          if (preW.length && onW.length) {
            const pAvg = preW.reduce((sum, r) => sum + Number(r.weight), 0) / preW.length;
            const latest = Number(onW[onW.length - 1].weight);
            const diff = +(latest - pAvg).toFixed(1);
            wtTxt = `Pre ${fmt(pAvg, 1)} lb -> Now ${fmt(latest, 1)} lb (${diff >= 0 ? '+' : ''}${diff} lb)`;
          } else if (onW.length >= 2) {
            const diff = +(Number(onW[onW.length - 1].weight) - Number(onW[0].weight)).toFixed(1);
            wtTxt = `${diff >= 0 ? '+' : ''}${diff} lb since ${s.started_at}`;
          }
        }
        return `<div style="padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <strong style="font-size:13.5px">${esc(s.name)}${s.dosage ? ` · <span style="color:var(--accent)">${esc(s.dosage)}</span>` : ''}</strong>
            <span class="tag ${adh >= 85 ? 'ok' : 'warn'}">${adh}% adherence${streak >= 2 ? ` · ${streak}d` : ''}</span>
          </div>
          <div style="margin-top:8px;font-size:12.5px;color:var(--text-2)"><b>Strength:</b> <span class="n">${esc(strTxt)}</span></div>
          <div style="margin-top:4px;font-size:12.5px;color:var(--text-2)"><b>Bodyweight:</b> <span class="n">${esc(wtTxt)}</span></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

    return `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  })() : '';

  const cycleBanner = dLeft != null && dLeft <= 14 ? `<div class="card card-pad" style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-color:${isMo ? 'var(--accent-line)' : dLeft <= 0 ? 'rgba(242,112,106,.4)' : 'rgba(242,184,75,.38)'}">

      <div style="font-size:12.5px;color:var(--text-2);margin-top:2px">

      </div>
    </div>
    <div class="actions">
      ${c.email ? `<button class="btn btn-sm" data-act="send-auto-email" data-tpl="phase_rollover" data-to="${esc(c.email)}" data-name="${esc(c.full_name)}" data-phase="${esc(c.phase)}" data-plan="${esc(c.plan_type || '8_week')}" data-fallback="${esc(renewMailto)}">${ic('mail')}${isMo ? 'Send Phase Gate Email' : 'Send Renewal Email (1-Click)'}</button>` : ''}

    </div>
  </div>` : '';

  const billTag = c.billing_status === 'past_due'
    ? '<span class="tag bad">Stripe Past Due</span>'
    : c.billing_status === 'canceled'
      ? '<span class="tag bad">Subscription Canceled</span>'
      : '';

  return `<div class="view">
    <div class="page-head">
      <div class="who">
        <span class="avatar lg" style="background:var(--accent-tint);color:var(--accent)">${initials(c.full_name)}</span>
        <div>
          <div class="crumb"><button data-act="overview">Clients</button> / ${esc(c.full_name)}</div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <h1>${esc(c.full_name)}</h1>
            <span class="tag ${isMo ? 'accent' : ''}">${isMo ? 'Monthly · $50/mo' : '8-Week · $100'}</span>
            ${billTag}
            ${dLeft != null ? `<span class="tag ${dLeft <= 0 ? 'bad' : dLeft <= 14 ? 'warn' : ''}">${dLeft <= 0 ? 'Cycle ended' : dLeft + 'd left'}</span>` : ''}
          </div>
          <div class="meta">${esc(c.phase)} · Week ${a.wk} of ${c.weeks} · ${esc(c.split)} ${c.email ? `· ${esc(c.email)}` : ''}</div>
        </div>
      </div>
      <div class="actions">
        ${c.email ? `<button class="btn" data-act="send-auto-email" data-tpl="app_invite" data-to="${esc(c.email)}" data-name="${esc(c.full_name)}" data-fallback="${esc(buildInviteMailto(c.full_name, c.email))}">${ic('mail')}Send App Invite</button>` : ''}
        <button class="btn" data-act="edit-client" data-id="${c.id}">${ic('edit')}Edit profile</button>
        <a class="btn btn-accent" href="client.html?client=${esc(c.slug)}">${ic('ext')}Open as client</a>
      </div>
    </div>
    ${cycleBanner}
    <div class="tabs">
      ${[['overview','Overview'],['program',`Program Builder${a.extraLogged.length ? ` (+${a.extraLogged.length} extra)` : ''}`],['training','Training Log'],['nutrition','Nutrition & Health'],['supplements',`Supplements${(d.supplements?.length || 0) ? ` (${d.supplements.length})` : ''}`],['measurements','Measurements & Photos'],['messages',`Messages${(d.messages?.length || 0) ? ` (${d.messages.length})` : ''}`]].map(([k, l]) =>
        `<button class="tab" data-act="tab" data-v="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('')}
    </div>
    ${body}
  </div>`;
}

function buildInviteMailto(name, email) {
  const first = String(name || 'there').split(/\s+/)[0];
  const appUrl = location.href.replace(/coach\.html.*$/i, 'client.html');
  const subj = 'Your CLF Protocol Training App is Live';
  const body = `Hey ${first},\n\nYour custom CLF Protocol app is ready with your full training split, coaching cues, form videos, daily check-ins, supplement stack, and strength trajectory tracker.\n\nHow to get in (30 seconds):\n1. Open this link on your phone: ${appUrl}\n2. Tap "Email Magic Link", enter this email (${email}), and tap the link in your inbox.\n3. Pin it to your Home Screen (iPhone Safari: Share -> Add to Home Screen).\n\nLet me know once you're logged in!\n\nCoach Kyle\nClash Lab Fitness LLC`;
  return `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
}

function buildIntakeMailto(row) {
  const first = row.first_name || row.last_name || 'there';
  if (row.status === 'approved') return { tpl: 'app_invite', label: 'Send App Invite', href: buildInviteMailto(`${row.first_name} ${row.last_name}`, row.email) };
  if (row.medical_clearance_required) {
    const subj = 'Clash Lab Fitness: Medical Clearance Next Steps';
    const body = `Hey ${first},\n\nThanks for submitting your Clash Lab Fitness onboarding packet! Because one or more answers on your PAR-Q+ health screening was marked "Yes", our protocol requires a brief medical clearance note from your physician before we issue your 8-week training split and nutrition targets.\n\nNext steps:\n1. Share your PAR-Q+ answers with your doctor.\n2. Ask for a brief note clearing you for "unsupervised, vigorous physical activity and resistance training."\n3. Reply to this email with a photo or PDF of the note.\n\nCoach Kyle\nClash Lab Fitness LLC`;
    return { tpl: 'clearance', label: 'Send Clearance Email', href: `mailto:${encodeURIComponent(row.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}` };
  }
  const subj = 'Clash Lab Fitness: Application Received + 3-Day Food Log';
  const body = `Hey ${first},\n\nGot your Clash Lab Fitness intake, PAR-Q+ screening, and signed waiver!\n\nBefore I build your custom 8-week training split and nutrition targets, please reply with your 3-Day Food Log (everything you eat and drink for 3 typical days, including rough portions and daily water intake).\n\nOnce I have your 3-day log, I will deliver your full CLF Protocol app access within 3 to 5 business days.\n\nCoach Kyle\nClash Lab Fitness LLC`;
  return { tpl: 'food_log', label: 'Send Food Log Email', href: `mailto:${encodeURIComponent(row.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}` };
}

        <button class="btn btn-sm" data-act="refresh">${ic('refresh')}Refresh</button>

      <div style="padding:0 16px 16px">
        ${!S.expoLeads.length ? `<div style="padding:22px 0;color:var(--text-3);font-size:13.5px">No QR calculator leads yet. Open <code>expo.html</code> or Booth Kiosk Mode at events to capture leads automatically.</div>` :
        S.expoLeads.map(l => {

          const fbMail = `mailto:${encodeURIComponent(l.email)}?subject=${encodeURIComponent('Ready to build your custom CLF 8-Week Split?')}&body=${encodeURIComponent(`Hey ${l.first_name || 'there'},\n\nSaw your CLF Macro & Split Audit (${l.calories} kcal, ${l.protein_g}g protein, ${l.recommended_split}). Whenever you are ready to have me build your exact gym program and set up your CLF Protocol app, you can apply right here:\n\nhttps://clashlabfitness.com/${prefill}\n\nCoach Kyle\nClash Lab Fitness`)}`;
          return `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line-soft)">
            <div>

                <span style="font-size:12.5px;color:var(--text-2)">${esc(l.email)}</span>
                ${dripTag}
                <span class="tag">${esc(l.source || 'expo_qr')}</span>
              </div>
              <div style="font-size:12.5px;color:var(--text-2);margin-top:3px">
                <b>${l.calories} kcal</b> (${l.protein_g}g P / ${l.carbs_g}g C / ${l.fats_g}g F) &middot; ${esc(l.recommended_split || '')} &middot; ${new Date(l.created_at).toLocaleDateString()}
              </div>
            </div>
            <div class="actions">
              <button class="btn btn-sm" data-act="send-auto-email" data-tpl="expo_followup" data-to="${esc(l.email)}" data-name="${esc(l.first_name || 'there')}" data-split="${esc(l.recommended_split || '')}" data-cal="${l.calories || ''}" data-prot="${l.protein_g || ''}" data-fallback="${esc(fbMail)}">${ic('mail')}Send Personal Invite</button>
              <a class="btn btn-accent btn-sm" href="${esc(prefill)}" target="_blank" rel="noopener">Open Pre-Filled Apply</a>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="grid g-1-1" style="margin-top:16px">
      <div class="card">
        <div class="card-head"><span class="card-title">Verified Client Wins</span><span class="card-sub">Submitted inside client.html</span></div>
        <div style="padding:0 16px 16px">
          ${!S.testimonials.length ? `<div style="padding:18px 0;color:var(--text-3);font-size:13px">Client wins submitted from the Progress tab appear here ready to copy as anonymous "Verified Client" website quotes.</div>` :
          S.testimonials.map(t => `<div style="padding:12px 0;border-bottom:1px solid var(--line-soft)">
            <div style="font-size:13.5px;color:var(--text);line-height:1.5">"${esc(t.quote)}"</div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
              <span style="font-size:12px;color:var(--text-3)">Verified Client${t.milestone ? ` &middot; ${esc(t.milestone)}` : ''} &middot; ${new Date(t.created_at).toLocaleDateString()}</span>
              <button class="btn btn-sm" data-act="copy-testimonial" data-quote="${esc(t.quote)}">${ic('copy')}Copy Website Quote</button>
            </div>
          </div>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title">Recent Automation Activity</span><span class="card-sub">Webhooks &amp; Resend log</span></div>
        <div style="padding:0 16px 16px">
          ${!S.autoLogs.length ? `<div style="padding:18px 0;color:var(--text-3);font-size:13px">Outbound emails, Stripe webhook updates, and scheduled digests will log here automatically.</div>` :
          S.autoLogs.slice(0, 10).map(lg => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px">
            <div style="min-width:0">
              <div style="font-weight:600;color:var(--text)">${esc(lg.subject || lg.event_type)}</div>
              <div style="color:var(--text-3)">${esc(lg.recipient_email || '')} &middot; ${new Date(lg.created_at).toLocaleString()}</div>
            </div>
            <span class="tag ok">${esc(lg.status || 'sent')}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById('root');
  if (S.mode === 'loading') { root.innerHTML = '<div class="auth-screen" style="color:var(--text-3)">Loading Coach Dashboard…</div>'; return; }
  if (S.mode === 'auth') {
    root.innerHTML = `<div class="auth-screen">
      <div class="auth-card">
        <div class="brand" style="padding:0 0 16px"><span class="mark">CLF</span><div><div class="brand-title">CLF Coaching OS</div><div class="brand-sub">Coach Dashboard</div></div></div>
        <h1>Coach sign in</h1>
        <p>Sign in with your Supabase coach account to manage clients, programs, coach notes, and live data.</p>
        <form id="auth-form">
          <label class="field"><span>Coach email</span><input name="email" type="email" required placeholder="kyle@example.com"></label>
          <label class="field"><span>Password</span><input name="password" type="password" required placeholder="••••••••"></label>
          <button type="submit" class="btn btn-accent" style="width:100%;height:42px;justify-content:center;margin-top:16px">Sign in</button>
        </form>
        <div class="auth-msg ${S.authTone}">${esc(S.authMsg)}</div>
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12.5px;color:var(--text-3)">Want to preview first?</span>
          <button type="button" class="btn btn-sm" data-act="demo">Preview Demo</button>
        </div>
      </div>
    </div>`;
    return;

  const sel = S.view === 'client' ? S.clients.find(c => c.id === S.selId) : null;
  const pendingCount = S.intakes.filter(x => x.status === 'pending' || x.status === 'needs_clearance').length;
  const openLeads = S.expoLeads.filter(x => !x.converted).length;
  root.innerHTML = `<div class="shell">
    <aside class="side">
      <div class="brand"><span class="mark">CLF</span><div><div class="brand-title">CLF Coaching</div><div class="brand-sub">Supabase OS</div></div></div>
      <button class="nav-btn" data-act="overview" aria-current="${S.view === 'overview'}">${ic('grid')}Overview</button>
      <button class="nav-btn" data-act="intake" aria-current="${S.view === 'intake'}">${ic('edit')}<span>Intake</span>${pendingCount ? `<span class="tag accent" style="margin-left:auto;height:20px">${pendingCount}</span>` : ''}</button>
      <button class="nav-btn" data-act="automations" aria-current="${S.view === 'automations'}">${ic('bolt')}<span>Automations</span>${openLeads ? `<span class="tag" style="margin-left:auto;height:20px">${openLeads}</span>` : ''}</button>
      <div class="side-label"><span>Clients</span><button class="mini-btn" data-act="add-client" title="Add client">${ic('plus')}</button></div>
      ${S.clients.map(c => `<button class="client-btn" data-act="select" data-id="${c.id}" aria-current="${S.view === 'client' && c.id === S.selId}">
        <span class="avatar">${initials(c.full_name)}</span>
        <div style="min-width:0"><div class="client-name">${esc(c.full_name)}</div><div class="client-sub">Wk ${currentWeek(c)} of ${c.weeks}</div></div>
      </button>`).join('')}
      <div class="side-foot">
        <span>${S.mode === 'demo' ? 'Demo mode' : esc(S.user?.email || '')}</span>
        <button class="btn btn-sm" data-act="signout">${S.mode === 'demo' ? 'Exit demo' : 'Sign out'}</button>
      </div>
    </aside>
    <main class="main">${S.view === 'intake' ? viewIntake() : S.view === 'automations' ? viewAutomations() : sel ? viewClient(sel) : viewOverview()}</main>
  </div>${renderClientModal()}`;
}

/* Events */
document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'demo') loadDemo();
  else if (act === 'overview') { S.view = 'overview'; S.selId = null; S.editVideoId = null; render(); }
  else if (act === 'intake') { S.view = 'intake'; S.selId = null; S.editVideoId = null; render(); }
  else if (act === 'automations') { S.view = 'automations'; S.selId = null; S.editVideoId = null; render(); }
  else if (act === 'send-auto-email') {
    await sendCoachAutomation({
      action: 'coach_send_email',
      template: btn.dataset.tpl,
      to: btn.dataset.to,
      name: btn.dataset.name || 'there',
      phase: btn.dataset.phase || '',
      plan_type: btn.dataset.plan || '',
      split: btn.dataset.split || '',
      calories: btn.dataset.cal || '',
      protein: btn.dataset.prot || '',
      label: btn.textContent.trim(),
    }, btn.dataset.fallback || '');
  }
  else if (act === 'run-auto-job') {
    await sendCoachAutomation({
      action: btn.dataset.job,
      label: btn.dataset.label || btn.dataset.job,
    }, '');
  }
  else if (act === 'copy-testimonial') {
    const formatted = `"${btn.dataset.quote}"\nVerified Client`;
    const ok = await copyTextWithFallback(formatted);
    toast(ok ? 'Copied Verified Client quote' : 'Copy failed');
  }
  else if (act === 'select') { S.view = 'client'; S.selId = btn.dataset.id; S.tab = 'overview'; S.liftSel = 'all'; S.editVideoId = null; render(); }
  else if (act === 'tab') { S.tab = btn.dataset.v; S.editVideoId = null; render(); }
  else if (act === 'lsel') { S.liftSel = btn.dataset.v; render(); }
  else if (act === 'coach-supp-overlay') { S.suppOverlay = !S.suppOverlay; render(); }
  else if (act === 'preset-csupp') {
    const p = COACH_SUPP_PRESETS[Number(btn.dataset.idx)];
    if (!p) return;
    const setV = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
    setV('cs-name', p.name);
    setV('cs-dose', p.dosage);
    setV('cs-timing', p.timing);
    setV('cs-rem', p.reminder_time);
    setV('cs-note', p.note);
  }
  else if (act === 'coach-act-supp') {
    const sid = String(btn.dataset.id);
    const todayStr = ymd(new Date());
    const row = S.data[S.selId]?.supplements?.find(x => String(x.id) === sid);
    if (!row) return;
    row.status = 'active';
    row.started_at = row.started_at || todayStr;
    if (S.mode !== 'demo' && S.suppTableReady) {
      await sb.from('client_supplements').update({ status: 'active', started_at: row.started_at }).eq('id', sid);
    }
    toast(`${row.name} activated`);
    render();
  }
  else if (act === 'coach-del-supp') {
    const sid = String(btn.dataset.id);
    const row = S.data[S.selId]?.supplements?.find(x => String(x.id) === sid);
    if (!row || !confirm(`Remove "${row.name}" from this client's supplement stack?`)) return;
    S.data[S.selId].supplements = (S.data[S.selId].supplements || []).filter(x => String(x.id) !== sid);
    if (S.mode !== 'demo' && S.suppTableReady) {
      await sb.from('client_supplements').delete().eq('id', sid);
    }
    toast(`Removed ${row.name}`);
    render();
  }
  else if (act === 'refresh') { await fetchAll(); toast('Refreshed from Supabase'); }
  else if (act === 'copy-apply') {
    const ok = await copyTextWithFallback(btn.dataset.url);
    toast(ok ? 'Application link copied' : 'Copy failed');
  }
  else if (act === 'approve-intake') {
    const row = S.intakes.find(x => x.id === btn.dataset.id);
    if (!row) return;
    const fullName = `${row.first_name || ''} ${row.last_name || ''}`.trim();
    const slug = fullName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Math.floor(Math.random() * 90 + 10);
    const splitGuess = row.days_per_week >= 5 ? 'Push / Pull / Legs / Upper / Lower' : row.days_per_week === 4 ? 'Upper / Lower (4-Day)' : 'Full Body A / B / C';
    const inSupps = parseIntakeSupps(row);
    const notes = `Equipment: ${(row.equipment || []).join(', ')}. Days/wk: ${row.days_per_week || '?'}. Injuries: ${row.injuries || 'None'}.${inSupps.length ? ' Supplements: ' + inSupps.join(', ') + '.' : ''} Baseline: ${row.age || '?'}yo, ${row.height || '?'}, ${row.current_weight || '?'} lb -> ${row.goal_weight || '?'} lb.`;
    const todayStr = ymd(new Date());
    const payload = {
      coach_id: S.user?.id, slug, full_name: fullName, email: row.email || null,
      plan_type: row.selected_plan === 'monthly' ? 'monthly' : '8_week',
      phase: 'Phase 1', split: splitGuess, start_date: todayStr, weeks: 8,
      targets: { weight: row.goal_weight || null, calories: 2200, protein: 160, water: 100, steps: 10000, sleep: 7.5 },
      program_notes: notes,
    };
    const buildSeedSupps = cid => inSupps.map((spName, idx) => {
      const preset = COACH_SUPP_PRESETS.find(p => spName.toLowerCase().includes(p.name.split(/\s+/)[0].toLowerCase()));
      return {
        client_id: cid,
        name: spName,
        dosage: preset?.dosage || '',
        frequency: 'daily',
        timing: preset?.timing || 'Morning',
        status: 'active',
        added_by: 'intake',
        coach_note: '',
        reminder_enabled: true,
        reminder_time: preset?.reminder_time || '08:30',
        started_at: todayStr,
      };
    });
    if (S.mode === 'demo') {
      const id = 'd-' + Date.now();
      S.clients.push({ id, health_sync_token: 'demo_tok', ...payload });
      const seeded = buildSeedSupps(id).map((s, idx) => ({ id: 'ds-' + id + '-' + idx, ...s }));
      S.data[id] = { exercises: [], sets: [], checkins: [], measurements: [], notes: [], messages: [], photos: [], supplements: seeded, suppLogs: {} };
      row.status = 'approved'; S.view = 'client'; S.selId = id; S.tab = 'program';
      toast(`${fullName} onboarded${seeded.length ? ` (+${seeded.length} supplements)` : ''} (demo)`); render(); return;
    }
    const { data: created, error } = await sb.from('clients').insert(payload).select().single();
    if (error) { toast('Onboard failed: ' + error.message); return; }
    await sb.from('intake_submissions').update({ status: 'approved', onboarded_client_id: created.id }).eq('id', row.id);
    if (inSupps.length && S.suppTableReady) {
      await sb.from('client_supplements').insert(buildSeedSupps(created.id));
    }
    toast(`${fullName} added to roster!`);
    await fetchAll();
    S.view = 'client'; S.selId = created.id; S.tab = 'program'; render();
  }
  else if (act === 'next-phase') {
    const c = S.clients.find(x => x.id === btn.dataset.id);
    if (!c) return;
    const nextPhase = nextPhaseLabel(c.phase);
    const todayStr = ymd(new Date());
    if (S.mode === 'demo') {
      c.phase = nextPhase; c.start_date = todayStr;
      toast(`Rolled into ${nextPhase} (demo)`); render(); return;
    }
    const { error } = await sb.from('clients').update({
      phase: nextPhase, start_date: todayStr, renewal_notified_at: null, expired_notified_at: null, updated_at: new Date().toISOString()
    }).eq('id', c.id);
    if (error) toast('Phase update failed: ' + error.message);
    else { toast(`${c.full_name} rolled into ${nextPhase}!`); await fetchAll(); }
  }
  else if (act === 'decline-intake') {
    const id = btn.dataset.id;
    if (S.mode !== 'demo') await sb.from('intake_submissions').update({ status: 'declined' }).eq('id', id);
    const r = S.intakes.find(x => x.id === id); if (r) r.status = 'declined';
    toast('Application marked declined'); render();
  }
  else if (act === 'add-client') { S.editClient = null; render(); document.getElementById('client-modal')?.showModal(); }
  else if (act === 'edit-client') { S.editClient = S.clients.find(c => c.id === btn.dataset.id); render(); document.getElementById('client-modal')?.showModal(); }
  else if (act === 'close-modal') { document.getElementById('client-modal')?.close(); }
  else if (act === 'copy-health') {
    const info = `Endpoint: ${SUPABASE_URL}/rest/v1/rpc/sync_apple_health\nAPI Key: ${SUPABASE_KEY}\nToken: ${btn.dataset.token}`;
    const ok = await copyTextWithFallback(info);
    toast(ok ? 'Apple Health setup copied' : 'Copy failed');
  }
  else if (act === 'edit-ex-vid') {
    const id = String(btn.dataset.id);
    S.editVideoId = S.editVideoId === id ? null : id;
    render();
    if (S.editVideoId) {
      const inp = document.querySelector(`[data-ex-vid-form="${CSS.escape(id)}"] input[name="video_url"]`);
      inp?.focus();
    }
  }
  else if (act === 'cancel-ex-vid') {
    S.editVideoId = null;
    render();
  }
  else if (act === 'reset-ex-vid') {
    const id = String(btn.dataset.id);
    if (S.mode !== 'demo') {
      const { error } = await sb.from('program_exercises').update({ video_url: '' }).eq('id', id);
      if (error) { toast('Reset failed: ' + error.message); return; }
    }
    const ex = S.data[S.selId]?.exercises.find(x => String(x.id) === id);
    if (ex) ex.video_url = '';
    S.editVideoId = null;
    toast('Reset to curated form video');
    render();
  }
  else if (act === 'jump-traj') {
    S.tab = 'overview';
    S.liftSel = btn.dataset.v || 'all';
    render();
  }
  else if (act === 'promote-ex') {
    if (!S.selId) return;
    const dayName = String(btn.dataset.day || 'Day 1').trim();
    const exName = String(btn.dataset.ex || '').trim();
    const sets = Math.max(1, Math.min(15, Number(btn.dataset.sets) || 3));
    const reps = Math.max(1, Math.min(100, Number(btn.dataset.reps) || 12));
    const isBw = btn.dataset.bw === '1';
    if (!exName) return;
    const cur = S.data[S.selId]?.exercises || [];
    if (cur.some(x => x.day_name.toLowerCase() === dayName.toLowerCase() && x.name.toLowerCase() === exName.toLowerCase())) {
      toast(`${exName} is already on ${dayName}`);
      render();
      return;
    }
    const days = [...new Set(cur.map(x => x.day_name))];
    const matchDay = days.find(d => d.toLowerCase() === dayName.toLowerCase()) || dayName;
    const dayOrder = days.includes(matchDay) ? days.indexOf(matchDay) + 1 : days.length + 1;
    const payload = {
      client_id: S.selId,
      day_name: matchDay,
      day_order: dayOrder,
      exercise_order: cur.filter(x => x.day_name === matchDay).length + 1,
      name: exName,
      sets,
      target_reps: reps,
      rep_label: String(reps),
      rest_sec: 75,
      is_bodyweight: isBw,
      cue: '',
      video_url: '',
    };
    if (S.mode === 'demo') {
      S.data[S.selId].exercises.push({ id: 'd-' + Date.now(), ...payload });
      toast(`Added ${exName} to ${matchDay} (demo)`);
      render();
      return;
    }
    const { error } = await sb.from('program_exercises').insert(payload);
    if (error) toast('Add failed: ' + error.message);
    else { toast(`Added ${exName} to ${matchDay}!`); await fetchAll(); }
  }
  else if (act === 'del-ex') {
    const id = btn.dataset.id;
    if (S.mode !== 'demo') await sb.from('program_exercises').delete().eq('id', id);
    if (S.data[S.selId]) S.data[S.selId].exercises = S.data[S.selId].exercises.filter(x => x.id !== id);
    if (S.editVideoId === String(id)) S.editVideoId = null;
    toast('Exercise removed'); render();
  }
  else if (act === 'del-note') {
    const id = btn.dataset.id;
    if (S.mode !== 'demo') await sb.from('coach_notes').delete().eq('id', id);
    if (S.data[S.selId]) S.data[S.selId].notes = S.data[S.selId].notes.filter(x => x.id !== id);
    toast('Note removed'); render();
  }
  else if (act === 'save-tpl') {
    const c = S.clients.find(x => x.id === S.selId);
    const exs = S.data[S.selId]?.exercises || [];
    if (!c || !exs.length) return;
    const name = prompt('Template name:', `${c.phase} — ${c.split}`);
    if (!name) return;
    const clean = exs.map(({ day_name, day_order, exercise_order, name: n, sets, target_reps, rep_label, rest_sec, is_bodyweight, cue, video_url }) => ({
      day_name, day_order, exercise_order, name: n, sets, target_reps, rep_label, rest_sec, is_bodyweight, cue,
      video_url: isSearchVideoUrl(video_url) ? '' : String(video_url).trim(),
    }));
    if (S.mode === 'demo') { S.templates.unshift({ id: 'd-' + Date.now(), name, split: c.split, exercises: clean }); toast('Template saved (demo)'); render(); return; }
    const { error } = await sb.from('program_templates').insert({ coach_id: S.user.id, name: name.trim(), split: c.split, exercises: clean });
    if (error) toast('Save failed: ' + error.message);
    else { toast(`Saved template "${name}"`); await fetchAll(); }
  }
  else if (act === 'apply-tpl') {
    const pick = document.getElementById('tpl-pick')?.value;
    if (!pick || !S.selId) return;
    let source = [];
    if (pick.startsWith('tpl:')) source = S.templates.find(t => t.id === pick.slice(4))?.exercises || [];
    else if (pick.startsWith('cli:')) source = S.data[pick.slice(4)]?.exercises || [];
    if (!source.length) return;
    const rows = source.map(e => ({
      client_id: S.selId, day_name: e.day_name, day_order: e.day_order, exercise_order: e.exercise_order,
      name: e.name, sets: e.sets, target_reps: e.target_reps, rep_label: e.rep_label,
      rest_sec: e.rest_sec, is_bodyweight: !!e.is_bodyweight, cue: e.cue || '',
      video_url: isSearchVideoUrl(e.video_url) ? '' : String(e.video_url).trim(),
    }));
    if (S.mode === 'demo') {
      S.data[S.selId].exercises = rows.map((r, i) => ({ id: 'd-' + Date.now() + '-' + i, ...r }));
      toast(`Applied ${rows.length} exercises (demo)`); render(); return;
    }
    await sb.from('program_exercises').delete().eq('client_id', S.selId);
    const { error } = await sb.from('program_exercises').insert(rows);
    if (error) toast('Apply failed: ' + error.message);
    else { toast(`Applied ${rows.length} exercises!`); await fetchAll(); }
  }
  else if (act === 'signout') {
    if (S.mode !== 'demo' && sb) await sb.auth.signOut();
    S.mode = 'auth'; S.user = null; S.view = 'overview'; S.selId = null; S.editVideoId = null; S.authMsg = ''; render();
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'coach-lift-jump') {
    S.liftSel = e.target.value;
    render();
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id === 'auth-form') {
    e.preventDefault();
    const { email, password } = Object.fromEntries(new FormData(e.target));
    S.authMsg = 'Signing in…'; S.authTone = ''; render();
    const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (error) { S.authMsg = error.message; S.authTone = 'bad'; render(); }
    else { S.user = data.user; S.mode = 'app'; await fetchAll(); }
  }
  if (e.target.dataset.exVidForm) {
    e.preventDefault();
    const id = String(e.target.dataset.exVidForm);
    const raw = e.target.elements.video_url.value.trim();
    if (raw && !/^https?:\/\//i.test(raw)) {
      toast('Video URL must start with https://');
      return;
    }
    if (/youtube\.com\/results\b/i.test(raw)) {
      toast('Paste a direct video URL (not a YouTube search link), or click Use Curated');
      return;
    }
    if (S.mode !== 'demo') {
      const { error } = await sb.from('program_exercises').update({ video_url: raw }).eq('id', id);
      if (error) { toast('Save failed: ' + error.message); return; }
    }
    const ex = S.data[S.selId]?.exercises.find(x => String(x.id) === id);
    if (ex) ex.video_url = raw;
    S.editVideoId = null;
    toast(raw ? 'Custom video URL saved' : 'Using curated form video');
    render();
  }
  if (e.target.id === 'coach-chat-form') {
    e.preventDefault();
    const body = e.target.elements.body.value.trim();
    if (!body || !S.selId) return;
    if (S.mode === 'demo') {
      S.data[S.selId].messages = (S.data[S.selId].messages || []).concat({ id: 'd-' + Date.now(), sender_role: 'coach', body, created_at: new Date().toISOString() });
      render(); return;
    }
    const { error } = await sb.from('messages').insert({ client_id: S.selId, coach_id: S.user.id, sender_role: 'coach', body });
    if (error) toast('Send failed: ' + error.message);
    else await fetchAll();
  }
  if (e.target.id === 'note-form') {
    e.preventDefault();
    const message = e.target.elements.message.value.trim();
    const alsoEmail = Boolean(e.target.elements.send_email?.checked);
    const curClient = S.clients.find(x => x.id === S.selId);
    if (!message || !S.selId) return;
    if (S.mode === 'demo') {
      S.data[S.selId].notes.forEach(n => n.pinned = false);
      S.data[S.selId].notes.unshift({ id: 'd-' + Date.now(), message, pinned: true, created_at: new Date().toISOString() });
      if (alsoEmail && curClient?.email) {
        await sendCoachAutomation({ action: 'coach_send_email', template: 'checkin_reviewed', to: curClient.email, name: curClient.full_name, message, label: 'Check-In Feedback Email' }, '');
      } else {
        toast('Note pinned (demo)');
      }
      render(); return;
    }
    await sb.from('coach_notes').update({ pinned: false }).eq('client_id', S.selId);
    const { error } = await sb.from('coach_notes').insert({ client_id: S.selId, coach_id: S.user.id, message, pinned: true });
    if (error) toast('Failed: ' + error.message);
    else {
      if (alsoEmail && curClient?.email) {
        await sendCoachAutomation({ action: 'coach_send_email', template: 'checkin_reviewed', to: curClient.email, name: curClient.full_name, message, label: 'Check-In Feedback Email' }, '');
      } else {
        toast('Pinned to client app');
        await fetchAll();
      }
    }
  }
  if (e.target.id === 'ex-form') {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const rawVid = f.video_url.trim();
    if (/youtube\.com\/results\b/i.test(rawVid)) {
      toast('Paste a direct video link (or leave blank to auto-use curated demo)');
      return;
    }
    const cur = S.data[S.selId]?.exercises || [];
    const days = [...new Set(cur.map(x => x.day_name))];
    const dayOrder = days.includes(f.day_name) ? days.indexOf(f.day_name) + 1 : days.length + 1;
    const payload = {
      client_id: S.selId, day_name: f.day_name.trim(), day_order: dayOrder,
      exercise_order: cur.filter(x => x.day_name === f.day_name.trim()).length + 1,
      name: f.name.trim(), sets: Number(f.sets) || 3,
      target_reps: /^\d+$/.test(f.rep_label.trim()) ? Number(f.rep_label.trim()) : null,
      rep_label: f.rep_label.trim() || '10', rest_sec: Number(f.rest_sec) || 90,
      is_bodyweight: f.is_bodyweight === 'true', cue: f.cue.trim(), video_url: rawVid,
    };
    if (S.mode === 'demo') {
      S.data[S.selId].exercises.push({ id: 'd-' + Date.now(), ...payload });
      toast('Exercise added (demo)'); render(); return;
    }
    const { error } = await sb.from('program_exercises').insert(payload);
    if (error) toast('Failed: ' + error.message);
    else { toast('Exercise added'); await fetchAll(); }
  }
  if (e.target.id === 'coach-supp-form') {
    e.preventDefault();
    if (!S.selId) return;
    const f = Object.fromEntries(new FormData(e.target));
    const cleanName = String(f.name || '').trim().slice(0, 80);
    if (!cleanName) return;
    const isImm = f.status === 'active';
    const todayStr = ymd(new Date());
    const payload = {
      client_id: S.selId,
      name: cleanName,
      dosage: String(f.dosage || '').trim().slice(0, 40),
      frequency: 'daily',
      timing: f.timing || 'Morning',
      status: isImm ? 'active' : 'recommended',
      added_by: 'coach',
      coach_note: String(f.coach_note || '').trim().slice(0, 240),
      reminder_enabled: Boolean(f.reminder_time),
      reminder_time: f.reminder_time || '08:30',
      started_at: isImm ? todayStr : null,
    };
    if (S.mode === 'demo') {
      S.data[S.selId].supplements = (S.data[S.selId].supplements || []).concat({ id: 'ds-' + Date.now(), ...payload });
      e.target.reset();
      toast(isImm ? `${cleanName} activated (demo)` : `Sent ${cleanName} recommendation (demo)`);
      render(); return;
    }
    if (!S.suppTableReady) { toast('Please run the Supabase SQL migration first'); return; }
    const { error } = await sb.from('client_supplements').insert(payload);
    if (error) toast('Failed: ' + error.message);
    else {
      toast(isImm ? `${cleanName} activated` : `Recommended ${cleanName} to client`);
      await fetchAll();
    }
  }
  if (e.target.id === 'client-form') {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const slug = f.full_name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'client-' + Date.now();
    const payload = {
      full_name: f.full_name.trim(), email: f.email.trim() || null,
      plan_type: f.plan_type === 'monthly' ? 'monthly' : '8_week',
      phase: f.phase.trim() || 'Phase 1', split: f.split.trim() || 'Full Body',
      start_date: f.start_date || ymd(new Date()), weeks: Number(f.weeks) || 8,
      targets: { weight: Number(f.weight) || null, calories: Number(f.calories) || null, protein: Number(f.protein) || null, water: Number(f.water) || null, steps: Number(f.steps) || null, sleep: Number(f.sleep) || null },
      program_notes: f.program_notes.trim(),
    };
    document.getElementById('client-modal')?.close();
    if (S.mode === 'demo') {
      if (S.editClient?.id) Object.assign(S.editClient, payload);
      else { const id = 'd-' + Date.now(); S.clients.push({ id, slug, health_sync_token: 'demo_tok', ...payload }); S.data[id] = { exercises: [], sets: [], checkins: [], measurements: [], notes: [], supplements: [], suppLogs: {} }; }
      toast('Saved (demo)'); render(); return;
    }
    let error;
    if (S.editClient?.id) ({ error } = await sb.from('clients').update(payload).eq('id', S.editClient.id));
    else ({ error } = await sb.from('clients').insert({ coach_id: S.user.id, slug, ...payload }));
    if (error) toast('Save failed: ' + error.message);
    else { toast(S.editClient?.id ? 'Client updated' : 'Client added'); await fetchAll(); }
  }
});

initAuth();
})();
</script>
</body>
</html>
