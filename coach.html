<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLF Coaching — Coach Dashboard</title>
<meta name="description" content="Coach workspace for CLF Protocol clients: strength trajectory, training progress, nutrition adherence, check-ins and flags.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.coach{
  --bg:#F6F5F2; --side:#F1F0EC; --surface:#FFFFFF; --surface-2:#FAF9F7; --sunken:#EFEDE8;
  --line:#E7E5E0; --line-soft:#F0EEEA; --line-2:#D9D6CF;
  --text:#151413; --text-2:#5A5650; --text-3:#8E8A83;
  --accent:#FF5A1F; --accent-text:#C2410C; --accent-tint:#FFF1EA;
  --ok:#15803D; --ok-tint:#EAF6EE; --warn:#A35A06; --warn-tint:#FCF3E3; --bad:#B42318; --bad-tint:#FCEBE9;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 0 rgba(21,20,19,.02),0 1px 3px rgba(21,20,19,.05);
  --ease:cubic-bezier(.2,.7,.2,1);
  font-family:var(--font);font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;
}
.mono,.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#140A05;display:grid;place-items:center;font:700 10px/1 var(--mono);letter-spacing:.04em;box-shadow:inset 0 -1px 0 rgba(0,0,0,.15)}
.brand-title{font-weight:600;font-size:14px;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--text-3)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--text-2);font-size:13.5px;font-weight:500;text-align:left}
.nav-btn:hover{background:rgba(21,20,19,.04);color:var(--text)}
.nav-btn[aria-current=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.side-label{display:flex;justify-content:space-between;align-items:center;padding:18px 10px 6px;font-size:11.5px;font-weight:500;color:var(--text-3)}
.mini-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--text-2)}
.mini-btn:hover{color:var(--text)}
.mini-btn svg.i{width:13px;height:13px}
.client-btn{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:transparent;text-align:left}
.client-btn:hover{background:rgba(21,20,19,.04)}
.client-btn[aria-current=true]{background:var(--surface);box-shadow:var(--shadow)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--sunken);color:var(--text-2);display:grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:.02em}
.avatar.lg{width:44px;height:44px;font-size:15px}
.client-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-sub{font-size:11.5px;color:var(--text-3)}
.flag-dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.flag-dot.bad{background:var(--bad)}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--text-3);line-height:1.5;border-top:1px solid var(--line)}

/* Main */
.main{padding:32px 40px 72px;max-width:1320px;width:100%}
.view{animation:enter .3s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(4px)}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:14px}
.crumb{font-size:12.5px;color:var(--text-3);margin-bottom:6px}
.crumb button{border:0;background:none;padding:0;color:var(--text-3)}
.crumb button:hover{color:var(--text)}
h1{font-size:28px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin:0}
.meta{font-size:13px;color:var(--text-2);margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:#CBC7BF}
.btn-dark{background:var(--text);border-color:var(--text);color:#fff}
.btn-dark:hover{background:#2A2826;border-color:#2A2826}
.btn-ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:rgba(21,20,19,.05)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.notice{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px;padding:11px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--text-2);box-shadow:var(--shadow)}
.notice strong{color:var(--text);font-weight:600}
.notice.error{background:var(--bad-tint);border-color:#F3CFCB;color:var(--bad)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:500;background:var(--sunken);color:var(--text-2);white-space:nowrap}
.tag.ok{background:var(--ok-tint);color:var(--ok)}
.tag.warn{background:var(--warn-tint);color:var(--warn)}
.tag.bad{background:var(--bad-tint);color:var(--bad)}
.tag.accent{background:var(--accent-tint);color:var(--accent-text)}

.tabs{display:flex;gap:22px;margin-top:26px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:0 0 11px;font-size:13.5px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--text)}

.grid{display:grid;gap:14px;margin-top:22px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card-pad{padding:18px 20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.card-sub{font-size:12.5px;color:var(--text-3)}
.stat-label{font-size:12.5px;color:var(--text-3);font-weight:500}
.stat-value{font-size:28px;font-weight:500;letter-spacing:-.035em;line-height:1.1;margin-top:10px}
.stat-value small{font-size:13px;color:var(--text-3);letter-spacing:0;margin-left:3px;font-weight:400}
.stat-foot{font-size:12.5px;color:var(--text-3);margin-top:8px;display:flex;gap:6px;align-items:center}
.up{color:var(--ok)} .down{color:var(--bad)}
.meter{height:4px;border-radius:4px;background:var(--sunken);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--text);border-radius:inherit}

.chart{height:256px;padding:8px 12px 12px}
.chart svg{display:block;width:100%;height:100%}
.chart-legend{display:flex;gap:16px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{display:inline-block;width:14px;height:2px;border-radius:1px}

/* Strength trajectory controls */
.traj-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 0;flex-wrap:wrap}
.lift-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.lift-pills::-webkit-scrollbar{display:none}
.lift-pill{height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.lift-pill:hover{color:var(--text);border-color:var(--line-2)}
.lift-pill[aria-selected=true]{background:var(--text);border-color:var(--text);color:#fff}
.mode-switch{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--sunken)}
.mode-switch button{height:24px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--text-2);font-size:12px;font-weight:500}
.mode-switch button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.traj-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 20px 4px}
.traj-stat{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-soft)}
.traj-stat span{display:block;font-size:11.5px;color:var(--text-3)}
.traj-stat b{display:block;font-size:17px;font-weight:550;letter-spacing:-.02em;margin-top:3px}
.traj-stat small{font-size:12px;color:var(--text-3);font-weight:400;margin-left:2px}
tr.is-sel td{background:var(--accent-tint)!important}
tr.is-sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

.flags{padding:6px 20px 18px}
.flag{display:grid;grid-template-columns:8px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.flag:first-child{border-top:0}
.flag i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn)}
.flag i.bad{background:var(--bad)}
.flag-title{font-size:13.5px;font-weight:500}
.flag-body{font-size:12.5px;color:var(--text-2);margin-top:2px}
.allclear{padding:22px 20px;font-size:13px;color:var(--text-3)}
.profile-note{margin:0 20px 18px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-soft);font-size:12.5px;color:var(--text-2);line-height:1.5}
.profile-note b{display:block;color:var(--text);font-size:12px;font-weight:600;margin-bottom:2px}

.table-wrap{overflow-x:auto;padding:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;font-weight:500;color:var(--text-3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td.muted{color:var(--text-3)}
td.wrap{white-space:normal;min-width:220px;color:var(--text-2)}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--surface-2)}
.strong{font-weight:500;color:var(--text)}
.dash{color:#C9C5BD}
.subrow td{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--text-2);padding-top:9px;padding-bottom:9px}

.week-pick{display:flex;gap:4px;padding:3px;background:var(--sunken);border-radius:10px;width:max-content;margin-top:18px;max-width:100%;overflow-x:auto}
.week-pick button{height:30px;min-width:46px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-size:12.5px;font-weight:500;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.week-pick button[aria-selected=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.week-pick .d{width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.week-pick .d.done{background:var(--ok)} .week-pick .d.partial{background:var(--warn)}

.heat{display:grid;grid-template-columns:34px repeat(7,1fr);gap:5px;padding:4px 20px 6px}
.heat span{font-size:11px;color:var(--text-3);display:flex;align-items:center}
.heat .dow{justify-content:center}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--sunken)}
.heat i.ok{background:var(--ok)}
.heat i.partial{background:#E9C58A}
.heat i.future{background:transparent;border:1px dashed var(--line-2)}
.heat i.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--text)}
.heat-legend{display:flex;gap:14px;padding:8px 20px 18px;font-size:11.5px;color:var(--text-3)}
.heat-legend span{display:inline-flex;align-items:center;gap:6px}
.heat-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bars{padding:6px 20px 18px}
.bar-row{display:grid;grid-template-columns:96px 1fr 120px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px}
.bar-row:first-child{border-top:0}
.bar-row .meter{margin:0}
.bar-row .meter i.ok{background:var(--ok)} .bar-row .meter i.bad{background:var(--bad)}

.spark{display:block}
.empty-state{padding:56px 24px;text-align:center}
.empty-state h2{font-size:17px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.empty-state p{color:var(--text-2);margin:0 auto 16px;max-width:420px}

/* Dialog */
dialog.modal{border:0;padding:0;border-radius:16px;width:min(520px,calc(100% - 32px));background:var(--surface);color:var(--text);box-shadow:0 24px 64px rgba(21,20,19,.18),0 0 0 1px rgba(21,20,19,.06)}
dialog.modal[open]{animation:pop .2s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}}
dialog.modal::backdrop{background:rgba(21,20,19,.28)}
.modal-body{padding:22px 24px 8px}
.modal-body h2{font-size:18px;font-weight:600;letter-spacing:-.02em;margin:0}
.modal-body p{font-size:13px;color:var(--text-2);margin:6px 0 4px;line-height:1.5}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:12.5px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.field input{width:100%;height:38px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);padding:0 11px;font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--text-2);box-shadow:0 0 0 3px rgba(21,20,19,.06)}
.field small{display:block;font-size:12px;color:var(--text-3);margin-top:5px}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 24px 20px}
.modal-status{font-size:12.5px;color:var(--text-3);margin-top:12px;min-height:18px}
.modal-status.ok{color:var(--ok)} .modal-status.bad{color:var(--bad)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--text);color:#fff;font-size:13px;font-weight:500;padding:10px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:opacity .2s,transform .2s var(--ease);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.g4,.traj-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2-1,.g-1-1{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .brand{padding:0 8px 0 4px}.side-label,.side-foot{display:none}
  .nav-btn,.client-btn{width:auto}
  .main{padding:24px 18px 56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="coach">
<div class="shell">
  <aside class="side" aria-label="Navigation">
    <div class="brand"><span class="mark" aria-hidden="true">CLF</span><div><div class="brand-title">CLF Coaching</div><div class="brand-sub">Coach workspace</div></div></div>
    <button class="nav-btn" data-action="roster" id="nav-roster"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Overview</button>
    <div class="side-label"><span>Clients</span><button class="mini-btn" data-action="add-client" aria-label="Add client"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button></div>
    <div id="side-clients"></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<dialog class="modal" id="client-dialog" aria-labelledby="cd-title">
  <form method="dialog" id="client-form" autocomplete="off">
    <div class="modal-body">
      <h2 id="cd-title">Add client</h2>
      <p>Each client has their own copy of the master sheet with the sync script installed. See the setup guide for the 2-minute install.</p>
      <label class="field"><span>Name</span><input name="name" required placeholder="First and last name"></label>
      <label class="field"><span>Google Sheet URL</span><input name="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/…"></label>
      <label class="field"><span>Sync URL</span><input name="syncUrl" placeholder="https://script.google.com/macros/s/…/exec"><small>From Apps Script → Deploy → Web app. Leave blank to keep sample data.</small></label>
      <label class="field"><span>Access code</span><input name="token" placeholder="Optional — must match ACCESS_CODE in the script"></label>
      <div class="modal-status" id="cd-status"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost danger" data-action="delete-client" id="cd-delete">Remove</button>
      <div style="display:flex;gap:8px;margin-left:auto">
        <button type="button" class="btn" data-action="test-client">Test</button>
        <button value="cancel" class="btn">Cancel</button>
        <button type="button" class="btn btn-dark" data-action="save-client">Save</button>
      </div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const KEY = 'clf.coach.v1';
const DAY = 86400000;
const SCOTT_SHEET = 'https://docs.google.com/spreadsheets/d/1_vKUq7Ag6K9-CC_cEuQ7F_v8FlycaQkUIDHKuiu2UBg/edit';
const EMILY_SHEET = 'https://docs.google.com/spreadsheets/d/18Q60mm_E2qZAlsLvz63iAI4Zf653y42j53qglrNQ1oo/edit';

const $ = (s, el = document) => el.querySelector(s);
const z = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = (v, d = 0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fw = v => v == null ? '—' : fmt(v, v % 1 ? 1 : 0);
const mean = a => { const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((p, c) => p + c, 0) / v.length : null; };
const e1rm = (w, r) => (w > 0 && r > 0) ? w * (1 + r / 30) : null;
const short = s => parseYmd(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const dow = s => parseYmd(s).toLocaleDateString('en-US', { weekday: 'short' });
const initials = n => String(n || '?').split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
const shortLift = s => String(s || '').replace(/\s*\(.*?\)\s*/g, '').replace(/^Barbell\s+/i, '').replace(/^Trap Bar or Conv\.\s+/i, '');
const uid = () => Math.random().toString(36).slice(2, 10);

function endpoint(c) { const u = new URL(c.syncUrl); if (c.token) u.searchParams.set('token', c.token); return u.toString(); }
async function fetchSnap(c) { const res = await fetch(endpoint(c)); const j = await res.json(); if (!j.ok) throw new Error(j.error || 'Unexpected response'); return j.data; }

async function load(c, force) {
  if (!c.syncUrl) { DATA[c.id] = { snap: demoSnapshot(c), demo: true }; return; }
  const cached = S.cache[c.id];
  if (!DATA[c.id] && cached) DATA[c.id] = { snap: cached.snap, demo: false, fetchedAt: cached.at };
  if (DATA[c.id] && DATA[c.id].loading) return;
  DATA[c.id] = Object.assign({}, DATA[c.id] || {}, { loading: true, error: null });
  if (force) render();
  try {
    const snap = await fetchSnap(c);
    DATA[c.id] = { snap, demo: false, fetchedAt: Date.now() };
    S.cache[c.id] = { snap, at: Date.now() }; save();
  } catch (err) {
    DATA[c.id] = Object.assign({}, DATA[c.id], { loading: false, error: String(err.message || err) });
  }
  render();
}

/* ---------- regression & analysis ---------- */
function ols(pts) {
  const n = pts.length;
  if (n < 2) return null;
  const mx = pts.reduce((a, p) => a + p.wk, 0) / n;
  const my = pts.reduce((a, p) => a + p.v, 0) / n;
  let numSum = 0, denSum = 0;
  pts.forEach(p => { numSum += (p.wk - mx) * (p.v - my); denSum += (p.wk - mx) * (p.wk - mx); });
  if (!denSum) return null;
  const slope = numSum / denSum;
  const intercept = my - slope * mx;
  return { slope, intercept, at: w => intercept + slope * w };
}

function analyze(s) {
  const P = Object.assign({ startDate: '2026-10-27', weeks: 8 }, s.profile || {});
  const T = Object.assign({ weight: null, calories: null, protein: null, water: null, steps: null, sleep: null }, s.targets || {});
  const hasShoulder = /shoulder|labrum|cuff|ac joint/i.test(P.injuries || '');
  const jointLabel = hasShoulder ? 'Shoulder' : 'Joint feel';
  const weeks = P.weeks || 8, total = weeks * 7;
  const di = Math.round((parseYmd(today()) - parseYmd(P.startDate)) / DAY);
  const curWeek = clamp(Math.floor(di / 7) + 1, 1, weeks);
  const asOf = di >= total ? addDays(P.startDate, total - 1) : di < 0 ? P.startDate : today();
  const daily = (s.daily || []).filter(r => r.date).sort((a, b) => a.date < b.date ? -1 : 1);
  const isLogged = r => ['weight', 'calories', 'protein', 'water', 'steps', 'shoulder'].some(k => r[k] != null);
  const logged = daily.filter(isLogged);
  const between = (a, b) => logged.filter(r => r.date >= a && r.date <= b);
  const last7 = between(addDays(asOf, -6), asOf), prev7 = between(addDays(asOf, -13), addDays(asOf, -7));
  const onT = r => T.calories != null && r.calories != null && r.calories <= T.calories && (r.protein ?? 0) >= T.protein && (r.water ?? 0) >= T.water && (r.steps ?? 0) >= T.steps;
  const weighed = logged.filter(r => r.weight != null);
  const startW = weighed.length ? weighed[0].weight : null;
  const avg7 = mean(last7.map(r => r.weight)), avgPrev = mean(prev7.map(r => r.weight));
  const tr = s.training || [];
  const days = [...new Set(tr.map(r => r.day))];
  const sess = (w, d) => { const rows = tr.filter(r => r.week === w && r.day === d); if (!rows.length) return 'none'; const n = rows.filter(r => r.done).length; return n === rows.length ? 'done' : (n || rows.some(r => r.weight != null)) ? 'partial' : 'none'; };
  const weekState = w => { const st = days.map(d => sess(w, d)); return st.every(x => x === 'done') ? 'done' : st.some(x => x !== 'none') ? 'partial' : 'none'; };
  const sessionsThis = days.filter(d => sess(curWeek, d) === 'done').length;
  let sessionsDone = 0; for (let w = 1; w <= weeks; w++) days.forEach(d => { if (sess(w, d) === 'done') sessionsDone++; });
  const isBW = n => /push-?up|pull-?up|chin-?up|dip|knee raise/i.test(n);
  const cTier = n => /shrug|curl|tricep|lateral|face pull|calf|lunge|goblet|leg curl/i.test(n) ? 0
    : /barbell|trap bar|hip thrust|stiff-legged|romanian|front squat|hack squat/i.test(n) ? 3
    : /press|squat|deadlift|thrust|seal row|chest-supported.*row|pendlay/i.test(n) ? 2 : 0;
  const w1 = tr.filter(r => r.week === 1 && !isBW(r.exercise));
  const primary = days.flatMap(d => w1.filter(r => r.day === d).slice(0, 1).map(r => r.exercise));
  const extra = w1.filter(r => !primary.includes(r.exercise) && cTier(r.exercise) > 0)
    .sort((a, b) => cTier(b.exercise) - cTier(a.exercise)).map(r => r.exercise);
  const keyNames = [...new Set([...primary, ...extra])].slice(0, 6);

  const keyLifts = keyNames.map(name => {
    const rows = tr.filter(r => r.exercise === name);
    const pts = [];
    const byWeek = Array.from({ length: weeks }, (_, i) => {
      const r = rows.find(x => x.week === i + 1);
      if (r && r.weight > 0) {
        const repUsed = r.actualReps || r.reps || 5;
        const est = r.e1rm ?? e1rm(r.weight, repUsed);
        pts.push({ wk: i + 1, w: r.weight, r: repUsed, e1rm: est });
        return Object.assign({}, r, { e1rmCalc: est });
      }
      return null;
    });
    const regE = ols(pts.map(p => ({ wk: p.wk, v: p.e1rm })));
    const regW = ols(pts.map(p => ({ wk: p.wk, v: p.w })));
    const ws = pts.map(p => p.w);
    const es = pts.map(p => p.e1rm).filter(Boolean);
    return {
      name, short: shortLift(name), target: rows[0] ? rows[0].target : '',
      byWeek, pts, regE, regW,
      first: ws.length ? ws[0] : null, last: ws.length ? ws[ws.length - 1] : null,
      firstE: es.length ? es[0] : null, lastE: es.length ? es[es.length - 1] : null,
      best: es.length ? Math.max(...es) : null,
      paceW: regW ? regW.slope : null, projW: regW ? Math.max(0, regW.at(weeks)) : null,
      paceE: regE ? regE.slope : null, projE: regE ? Math.max(0, regE.at(weeks)) : null,
    };
  });

  // Composite Compound Strength Index (% e1RM gain vs each lift's starting baseline)
  const idxPts = [];
  for (let wk = 1; wk <= weeks; wk++) {
    const rels = keyLifts.map(l => {
      if (!l.pts.length || !l.pts[0].e1rm) return null;
      const cur = l.pts.find(p => p.wk === wk);
      return cur ? ((cur.e1rm - l.pts[0].e1rm) / l.pts[0].e1rm) * 100 : null;
    }).filter(v => v != null);
    if (rels.length) idxPts.push({ wk, v: mean(rels) });
  }
  const idxReg = ols(idxPts);
  const strengthIdx = { pts: idxPts, reg: idxReg, cur: idxPts.length >= 2 ? idxPts[idxPts.length - 1].v : null, pace: idxReg ? idxReg.slope : null, proj: idxReg ? idxReg.at(weeks) : null };

  const lastLog = logged.length ? logged[logged.length - 1] : null;

  const flags = [];
  const lowSh = last7.filter(r => r.shoulder != null && r.shoulder <= 6);
  if (lowSh.length) flags.push({ tone: 'bad', title: `${jointLabel} comfort ${Math.min(...lowSh.map(r => r.shoulder))}/10`, body: `Reported ${lowSh.map(r => short(r.date)).join(', ')}${lowSh[0].notes ? ` — “${lowSh[0].notes}”` : ''}. Review loads before progressing.` });
  if (!lastLog) flags.push({ tone: 'warn', title: 'No check-ins yet', body: 'Send the client their app link so daily logs start coming in.' });
  else { const gap = Math.round((parseYmd(asOf) - parseYmd(lastLog.date)) / DAY); if (gap >= 2) flags.push({ tone: 'warn', title: `No check-in for ${gap} days`, body: `Last logged ${short(lastLog.date)}.` }); }
  if (T.protein != null) { const n = last7.filter(r => r.protein != null && r.protein < T.protein).length; if (n >= 3) flags.push({ tone: 'warn', title: `Protein under ${T.protein} g on ${n} of 7 days`, body: 'Consistently below the floor this week.' }); }
  if (T.calories != null) { const n = last7.filter(r => r.calories != null && r.calories > T.calories).length; if (n >= 3) flags.push({ tone: 'warn', title: `Over calorie ceiling on ${n} of 7 days`, body: `Ceiling is ${fmt(T.calories)} kcal.` }); }
  if (avg7 != null && avgPrev != null && T.weight != null && startW != null) {
    const ch = avg7 - avgPrev, gaining = T.weight > startW;
    if (gaining && ch < -0.2) flags.push({ tone: 'warn', title: 'Bodyweight trending down', body: `7-day average down ${fmt(-ch, 1)} lb vs the week before. Goal is ${T.weight} lb.` });
    if (gaining && ch > 0.8) flags.push({ tone: 'warn', title: 'Gaining faster than lean target', body: `7-day average up +${fmt(ch, 1)} lb this week. Consider trimming surplus slightly.` });
    if (!gaining && ch > 0.2) flags.push({ tone: 'warn', title: 'Bodyweight trending up', body: `7-day average up ${fmt(ch, 1)} lb vs the week before. Goal is ${T.weight} lb.` });
  }
  keyLifts.forEach(l => {
    if (l.pts.length >= 3) {
      const a3 = l.pts.slice(-3);
      if (a3[2].e1rm <= a3[0].e1rm) flags.push({ tone: 'warn', title: `Strength plateau on ${l.short}`, body: `No e1RM increase across Weeks ${a3[0].wk}–${a3[2].wk}. Consider micro-loading or a volume adjustment.` });
    }
  });
  if (curWeek > 1 && days.length && di >= 7) { const missed = days.filter(d => sess(curWeek - 1, d) !== 'done'); if (missed.length) flags.push({ tone: 'warn', title: `Week ${curWeek - 1}: ${missed.length} of ${days.length} sessions incomplete`, body: missed.join(', ') }); }
  const hi = tr.filter(r => r.week === curWeek && r.rpe >= 9.5); if (hi.length) flags.push({ tone: 'warn', title: 'RPE 9.5+ this week', body: hi.map(r => r.exercise).join(', ') });

  return { P, T, jointLabel, weeks, total, di, curWeek, asOf, daily, logged, last7, prev7, onT, startW, avg7, avgPrev, tr, days, sess, weekState, sessionsThis, sessionsDone, keyLifts, strengthIdx, lastLog, flags };
}

  renderSide();
  const main = $('#main');
  const c = S.clients.find(x => x.id === S.selected);
  main.innerHTML = S.view === 'client' && c ? viewClient(c) : viewRoster();
  if (S.view === 'client' && c) {
    if (S.tab === 'overview') { drawWeight(c); drawStrength(c); }
    else if (S.tab === 'training') { drawStrength(c); }
  }
}

function renderSide() {
  $('#nav-roster').setAttribute('aria-current', String(S.view === 'roster'));
  $('#side-clients').innerHTML = S.clients.map(c => {
    const d = DATA[c.id]; const a = d && d.snap ? analyze(d.snap) : null;
    const bad = a && a.flags.some(f => f.tone === 'bad');
    return `<button class="client-btn" data-action="open" data-id="${c.id}" aria-current="${S.view === 'client' && S.selected === c.id}">
      <span class="avatar">${esc(initials(c.name))}</span>
      <span style="min-width:0"><span class="client-name" style="display:block">${esc(c.name)}</span><span class="client-sub">${a ? `Week ${a.curWeek} of ${a.weeks}` : 'Loading'}${d && d.demo ? ' · sample' : ''}</span></span>
      ${a && a.flags.length ? `<span class="flag-dot${bad ? ' bad' : ''}" title="${a.flags.length} flag${a.flags.length > 1 ? 's' : ''}"></span>` : '<span></span>'}
    </button>`;
  }).join('');
  const demo = S.clients.filter(c => !c.syncUrl).length;
  $('#side-foot').innerHTML = demo ? `${demo} client${demo > 1 ? 's' : ''} showing sample data until a sync URL is added.` : 'All clients syncing from Google Sheets.';
}

function viewRoster() {
  const rows = S.clients.map(c => ({ c, d: DATA[c.id], a: DATA[c.id] && DATA[c.id].snap ? analyze(DATA[c.id].snap) : null }));
  const ready = rows.filter(r => r.a);
  const checkedToday = ready.filter(r => r.a.lastLog && r.a.lastLog.date === today()).length;
  const sessWeek = ready.reduce((s, r) => s + r.a.sessionsThis, 0);
  const sessWeekMax = ready.reduce((s, r) => s + r.a.days.length, 0);
  const needs = ready.filter(r => r.a.flags.length).length;
  const adh = mean(ready.map(r => r.a.last7.length ? r.a.last7.filter(r.a.onT).length / 7 : null));
  return `<section class="view">
    <div class="page-head">
      <div><div class="crumb">${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</div><h1>Clients</h1><div class="meta">${S.clients.length} active · ${needs ? `${needs} need${needs === 1 ? 's' : ''} attention` : 'nothing flagged'}</div></div>
      <div class="actions"><button class="btn" data-action="refresh">${icon('refresh')}Refresh</button><button class="btn btn-dark" data-action="add-client">${icon('plus')}Add client</button></div>
    </div>
    <div class="grid g4">
      ${stat('Active clients', S.clients.length, '', `${S.clients.filter(c => c.syncUrl).length} syncing live`)}
      ${stat('Checked in today', `${checkedToday}<small>/ ${S.clients.length}</small>`, '', 'Daily check-ins logged today')}
      ${stat('Sessions this week', `${sessWeek}<small>/ ${sessWeekMax}</small>`, '', 'Across all clients', sessWeekMax ? sessWeek / sessWeekMax : 0)}
      ${stat('Nutrition on target', adh == null ? '—' : `${Math.round(adh * 100)}<small>%</small>`, '', 'Average of last 7 days', adh || 0)}
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-head"><div class="card-title">Roster</div><div class="card-sub">Click a client to inspect strength &amp; metabolic trends</div></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Client</th><th>Program &amp; split</th><th class="c">Week</th><th>Last check-in</th><th class="r">Bodyweight</th><th class="r">Strength</th><th class="c">Sessions</th><th class="r">On target (7d)</th><th>Status</th></tr></thead>
        <tbody>${rows.map(({ c, d, a }) => !a ? `<tr><td class="strong">${esc(c.name)}</td><td colspan="8" class="muted">${d && d.error ? esc(d.error) : 'Loading…'}</td></tr>` : `
          <tr class="link" data-action="open" data-id="${c.id}">
            <td><div style="display:flex;align-items:center;gap:10px"><span class="avatar">${esc(initials(c.name))}</span><span class="strong">${esc(c.name)}</span>${d.demo ? '<span class="tag">Sample</span>' : ''}</div></td>
            <td class="muted">${esc(a.P.program || '—')}${a.P.split ? ` <span style="color:var(--text-3)">· ${esc(a.P.split)}</span>` : ''}</td>
            <td class="c n">${a.curWeek} / ${a.weeks}</td>
            <td>${a.lastLog ? `${short(a.lastLog.date)} <span class="muted">· ${relDays(a.lastLog.date, a.asOf)}</span>` : dash}</td>
            <td class="r n">${a.avg7 != null ? `${fmt(a.avg7, 1)} lb` : dash}</td>
            <td class="r n">${a.strengthIdx.cur != null ? `<span class="${a.strengthIdx.cur >= 0 ? 'up' : 'down'}">${a.strengthIdx.cur >= 0 ? '+' : '−'}${fmt(Math.abs(a.strengthIdx.cur), 1)}%</span>` : dash}</td>
            <td class="c n">${a.sessionsThis} / ${a.days.length}</td>
            <td class="r n">${a.last7.length ? `${a.last7.filter(a.onT).length} / 7` : dash}</td>
            <td>${a.flags.length ? `<span class="tag ${a.flags.some(f => f.tone === 'bad') ? 'bad' : 'warn'}">${a.flags.length} flag${a.flags.length > 1 ? 's' : ''}</span>` : '<span class="tag ok">On track</span>'}</td>
          </tr>`).join('')}</tbody>
      </table></div>
    </div>
  </section>`;
}

function relDays(d, asOf) { const n = Math.round((parseYmd(asOf) - parseYmd(d)) / DAY); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : `${n} days ago`; }
function stat(label, value, unit, foot, meter) {
  return `<div class="card card-pad"><div class="stat-label">${label}</div><div class="stat-value n">${value}${unit ? `<small>${unit}</small>` : ''}</div>
    ${meter != null ? `<div class="meter"><i style="width:${clamp(meter * 100, 0, 100)}%"></i></div>` : ''}<div class="stat-foot">${foot}</div></div>`;
}

function viewClient(c) {
  const d = DATA[c.id];
  if (!d || !d.snap) return `<section class="view"><div class="empty-state"><h2>${esc(c.name)}</h2><p>${d && d.error ? `Couldn't load this client's sheet: ${esc(d.error)}` : 'Loading…'}</p><button class="btn" data-action="edit-client" data-id="${c.id}">${icon('edit')}Edit connection</button></div></section>`;
  const a = analyze(d.snap);
  if (!S.lift || (S.lift !== 'ALL' && !a.keyLifts.some(l => l.name === S.lift))) {
    const firstLogged = a.keyLifts.find(l => l.pts.length >= 2) || a.keyLifts[0];
    S.lift = firstLogged ? firstLogged.name : 'ALL';
  }
  const started = short(a.P.startDate);
  const tabs = [['overview', 'Overview'], ['training', 'Training'], ['nutrition', 'Nutrition']];
  return `<section class="view">
    <div class="page-head">
      <div>
        <div class="crumb"><button data-action="roster">Clients</button> / ${esc(c.name)}</div>
        <div class="who"><span class="avatar lg">${esc(initials(c.name))}</span><div><h1>${esc(c.name)}</h1>
        <div class="meta">${esc(a.P.program || 'Program')} · Week ${a.curWeek} of ${a.weeks} · Started ${started}${a.P.split ? ' · ' + esc(a.P.split) : ''}</div></div></div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" data-action="edit-client" data-id="${c.id}">${icon('edit')}Edit</button>
        <button class="btn" data-action="refresh-one" data-id="${c.id}" ${!c.syncUrl ? 'disabled' : ''}>${icon('refresh', d.loading ? 'spin' : '')}Refresh</button>
        ${c.sheetUrl ? `<a class="btn" href="${esc(c.sheetUrl)}" target="_blank" rel="noopener">${icon('ext')}Open sheet</a>` : ''}
        <button class="btn btn-dark" data-action="copy-link" data-id="${c.id}">${icon('link')}Copy client link</button>
      </div>
    </div>
    ${d.demo ? `<div class="notice"><span><strong>Sample data.</strong> Add ${esc(c.name.split(' ')[0])}'s sync URL to show live numbers from Google Sheets.</span><button class="btn" data-action="edit-client" data-id="${c.id}">Connect sheet</button></div>` : ''}
    ${d.error ? `<div class="notice error"><span>Last refresh failed: ${esc(d.error)}. Showing the most recent data.</span></div>` : ''}
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${S.tab === k}" data-action="tab" data-tab="${k}">${l}</button>`).join('')}</div>
    ${S.tab === 'training' ? tabTraining(a) : S.tab === 'nutrition' ? tabNutrition(a) : tabOverview(a)}
  </section>`;
}

function strengthCard(a) {
  const isAll = S.lift === 'ALL';
  const isE1 = S.liftMode === 'e1rm';
  const sel = isAll ? null : a.keyLifts.find(l => l.name === S.lift);

  let k1 = ['Current', '—', ''], k2 = ['Total gain', '—', ''], k3 = ['Weekly velocity', '—', ''], k4 = [`Week ${a.weeks} trajectory`, '—', ''];
  if (isAll) {
    const cur = a.strengthIdx.cur, pace = a.strengthIdx.pace, proj = a.strengthIdx.proj;
    k1 = ['Compound index', cur != null ? `${cur >= 0 ? '+' : '−'}${fmt(Math.abs(cur), 1)}` : '—', cur != null ? '%' : ''];
    k2 = ['Baseline', '0.0', '% (Week 1)'];
    k3 = ['Weekly velocity', pace != null ? `${pace >= 0 ? '+' : '−'}${fmt(Math.abs(pace), 1)}` : '—', pace != null ? '% / wk' : ''];
    k4 = [`Proj. Week ${a.weeks}`, proj != null ? `${proj >= 0 ? '+' : '−'}${fmt(Math.abs(proj), 1)}` : '—', proj != null ? '%' : ''];
  } else if (sel) {
    const cur = sel.pts.length ? (isE1 ? sel.lastE : sel.last) : null;
    const start = sel.pts.length ? (isE1 ? sel.firstE : sel.first) : null;
    const gain = cur != null && start != null && sel.pts.length >= 2 ? cur - start : null;
    const pace = isE1 ? sel.paceE : sel.paceW;
    const proj = isE1 ? sel.projE : sel.projW;
    k1 = [isE1 ? 'Current est. 1RM' : 'Current working load', cur != null ? fmt(cur, isE1 ? 1 : (cur % 1 ? 1 : 0)) : '—', cur != null ? 'lb' : ''];
    k2 = ['Gain since start', gain != null ? `${gain >= 0 ? '+' : '−'}${fmt(Math.abs(gain), 1)}` : '—', gain != null ? 'lb' : ''];
    k3 = ['Weekly velocity', pace != null ? `${pace >= 0 ? '+' : '−'}${fmt(Math.abs(pace), 1)}` : '—', pace != null ? 'lb / wk' : ''];
    k4 = [`Proj. Week ${a.weeks}`, proj != null ? fmt(proj, 0) : '—', proj != null ? 'lb' : ''];
  }

  return `<div class="card" style="margin-top:14px">
    <div class="card-head">
      <div><div class="card-title">Strength trajectory</div><div class="card-sub">Progressive overload curve, linear pace &amp; Week ${a.weeks} projection</div></div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div class="chart-legend">
          <span><i style="background:var(--accent)"></i>Logged</span>
          <span><i style="background:repeating-linear-gradient(90deg,#8E8A83 0 3px,transparent 3px 6px)"></i>Trend fit</span>
          <span><i style="background:repeating-linear-gradient(90deg,#FF5A1F 0 4px,transparent 4px 8px)"></i>W${a.weeks} projection</span>
        </div>
        ${!isAll ? `<div class="mode-switch" role="group" aria-label="Strength metric">
          <button type="button" data-action="lift-mode" data-mode="e1rm" aria-pressed="${isE1}">Est. 1RM</button>
          <button type="button" data-action="lift-mode" data-mode="weight" aria-pressed="${!isE1}">Working lb</button>
        </div>` : ''}
      </div>
    </div>
    <div class="traj-bar">
      <div class="lift-pills" role="tablist" aria-label="Compound lifts">
        <button type="button" class="lift-pill" role="tab" aria-selected="${isAll}" data-action="pick-lift" data-name="ALL">All compounds (%)</button>
        ${a.keyLifts.map(l => `<button type="button" class="lift-pill" role="tab" aria-selected="${S.lift === l.name}" data-action="pick-lift" data-name="${esc(l.name)}">${esc(l.short)}</button>`).join('')}
      </div>
    </div>
    <div class="traj-stats">
      ${[k1, k2, k3, k4].map(([lbl, val, u], idx) => `<div class="traj-stat"><span>${lbl}</span><b class="n ${idx > 0 && String(val).startsWith('+') ? 'up' : idx > 0 && String(val).startsWith('−') ? 'down' : ''}">${val}${u ? `<small>${u}</small>` : ''}</b></div>`).join('')}
    </div>
    <div class="chart" id="lchart"></div>
  </div>`;
}

function tabOverview(a) {
  const T = a.T;
  const wDelta = a.avg7 != null && a.avgPrev != null ? a.avg7 - a.avgPrev : null;
  const gaining = T.weight != null && a.startW != null ? T.weight > a.startW : true;
  const good = wDelta == null ? null : (gaining ? wDelta >= 0 : wDelta <= 0);
  const on7 = a.last7.filter(a.onT).length;
  const sCur = a.strengthIdx.cur, sPace = a.strengthIdx.pace;
  const recent = a.logged.slice(-7).reverse();
  return `
    <div class="grid g4">
      ${stat('Bodyweight · 7-day avg', fmt(a.avg7, 1), 'lb', wDelta != null ? `<span class="${good ? 'up' : 'down'} n">${wDelta >= 0 ? '+' : '−'}${fmt(Math.abs(wDelta), 1)} lb</span> vs prior week${T.weight ? ` · goal ${T.weight}` : ''}` : (T.weight ? `Goal ${T.weight} lb` : ''))}
      ${stat('Compound strength', sCur == null ? '—' : `${sCur >= 0 ? '+' : '−'}${fmt(Math.abs(sCur), 1)}`, sCur == null ? '' : '%', sPace != null ? `<span class="${sPace >= 0 ? 'up' : 'down'} n">${sPace >= 0 ? '+' : '−'}${fmt(Math.abs(sPace), 1)}%/wk</span> e1RM trajectory` : 'Log 2+ weeks to calculate pace')}
      ${stat('Sessions this week', `${a.sessionsThis}<small>/ ${a.days.length}</small>`, '', `${a.sessionsDone} of ${a.days.length * a.weeks} completed this phase`, a.days.length ? a.sessionsThis / a.days.length : 0)}
      ${stat('Nutrition on target', `${on7}<small>/ 7 days</small>`, '', 'Calories, protein, water and steps', on7 / 7)}
    </div>
    <div class="grid g-2-1">
      <div class="card">
        <div class="card-head"><div><div class="card-title">Bodyweight</div><div class="card-sub">Daily weigh-ins and 7-day average</div></div>
          <div class="chart-legend"><span><i style="background:#C9C5BD;height:6px;width:6px;border-radius:50%"></i>Daily</span><span><i style="background:var(--accent)"></i>7-day avg</span><span><i style="background:repeating-linear-gradient(90deg,#5A5650 0 3px,transparent 3px 6px)"></i>Goal</span></div></div>
        <div class="chart" id="wchart"></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Needs attention</div>${a.flags.length ? `<span class="tag ${a.flags.some(f => f.tone === 'bad') ? 'bad' : 'warn'}">${a.flags.length}</span>` : ''}</div>
        ${a.flags.length ? `<div class="flags">${a.flags.map(f => `<div class="flag"><i class="${f.tone}"></i><div><div class="flag-title">${esc(f.title)}</div><div class="flag-body">${esc(f.body)}</div></div></div>`).join('')}</div>` : `<div class="allclear">Nothing flagged. Check-ins, nutrition and strength progression are on track.</div>`}
        ${a.P.injuries ? `<div class="profile-note"><b>Program notes</b>${esc(a.P.injuries)}</div>` : ''}
      </div>
    </div>
    ${strengthCard(a)}
    <div class="card" style="margin-top:14px">
      <div class="card-head"><div><div class="card-title">Key lifts</div><div class="card-sub">Click any lift row to plot its trajectory above · working weight by week (lb)</div></div></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Lift</th><th>Target</th>${Array.from({ length: a.weeks }, (_, i) => `<th class="r">W${i + 1}</th>`).join('')}<th class="r">Best e1RM</th><th class="r">Gain</th><th class="r">Pace (/wk)</th><th class="r">Proj. W${a.weeks}</th><th>Trend</th></tr></thead>
        <tbody>${a.keyLifts.map(l => `<tr class="link${S.lift === l.name ? ' is-sel' : ''}" data-action="pick-lift" data-name="${esc(l.name)}">
          <td class="strong">${esc(l.name)}</td><td class="muted n">${esc(l.target)}</td>
          ${l.byWeek.map((r, i) => `<td class="r n${i + 1 === a.curWeek ? ' strong' : ''}">${r ? fw(r.weight) : dash}</td>`).join('')}
          <td class="r n strong">${l.best ? fmt(l.best, 1) : dash}</td>
          <td class="r n">${l.first != null && l.last != null && l.pts.length >= 2 ? `<span class="${l.last >= l.first ? 'up' : 'down'}">${l.last >= l.first ? '+' : '−'}${fw(Math.abs(l.last - l.first))}</span>` : dash}</td>
          <td class="r n">${l.paceW != null ? `<span class="${l.paceW >= 0 ? 'up' : 'down'}">${l.paceW >= 0 ? '+' : '−'}${fmt(Math.abs(l.paceW), 1)}</span>` : dash}</td>
          <td class="r n strong">${l.projW != null ? fmt(l.projW, 0) : dash}</td>
          <td>${spark(l.byWeek.map(r => r ? r.weight : null))}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-head"><div><div class="card-title">Recent check-ins</div><div class="card-sub">Last ${recent.length || 0} logged days</div></div><button class="btn btn-ghost" data-action="tab" data-tab="nutrition">View all</button></div>
      ${recent.length ? checkinTable(recent, a) : `<div class="allclear">No check-ins logged yet.</div>`}
    </div>`;
}

function checkinTable(rows, a) {
  const T = a.T;
  const cell = (v, ok, d = 0) => v == null ? `<td class="r">${dash}</td>` : `<td class="r n${ok === false ? ' down' : ''}">${fmt(v, d)}</td>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Date</th><th class="r">Weight</th><th class="r">Calories</th><th class="r">Protein</th><th class="r">Water</th><th class="r">Steps</th><th class="r">Sleep</th><th class="r">${esc(a.jointLabel)}</th><th>Status</th><th>Notes</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td><span class="strong">${short(r.date)}</span> <span class="muted">${dow(r.date)}</span></td>
      ${cell(r.weight, null, 1)}${cell(r.calories, r.calories == null ? null : r.calories <= T.calories)}${cell(r.protein, r.protein == null ? null : r.protein >= T.protein)}
      ${cell(r.water, r.water == null ? null : r.water >= T.water)}${cell(r.steps, r.steps == null ? null : r.steps >= T.steps)}${cell(r.sleep, null, 1)}
      ${r.shoulder == null ? `<td class="r">${dash}</td>` : `<td class="r n${r.shoulder <= 6 ? ' down strong' : ''}">${r.shoulder}</td>`}
      <td>${a.onT(r) ? '<span class="tag ok">On target</span>' : '<span class="tag warn">Partial</span>'}</td>
      <td class="wrap">${esc(r.notes || '')}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function spark(vals) {
  const pts = vals.map((v, i) => v == null ? null : [i, v]).filter(Boolean);
  if (pts.length < 2) return `<span class="dash">—</span>`;
  const W = 96, H = 24, lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), n = vals.length - 1;
  const x = i => 2 + i / n * (W - 4), y = v => hi === lo ? H / 2 : 3 + (1 - (v - lo) / (hi - lo)) * (H - 6);
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="#151413" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ')}"/><circle cx="${x(last[0])}" cy="${y(last[1])}" r="2.5" fill="#FF5A1F"/></svg>`;
}

function tabTraining(a) {
  const wk = S.week && S.week <= a.weeks ? S.week : a.curWeek;
  const rows = a.tr.filter(r => r.week === wk);
  return `
    ${strengthCard(a)}
    <div class="week-pick" role="tablist" aria-label="Week">${Array.from({ length: a.weeks }, (_, i) => `<button role="tab" aria-selected="${i + 1 === wk}" data-action="week" data-week="${i + 1}"><span class="d ${a.weekState(i + 1)}"></span>W${i + 1}</button>`).join('')}</div>
    ${a.days.map(day => {
      const list = rows.filter(r => r.day === day);
      const vol = list.reduce((s, r) => s + (r.volume || 0), 0);
      const st = a.sess(wk, day);
      return `<div class="card" style="margin-top:14px">
        <div class="card-head"><div><div class="card-title">${esc(day)}</div><div class="card-sub">Week ${wk} · ${list.length} exercises${vol ? ` · ${fmt(vol)} lb volume` : ''}</div></div>
          <span class="tag ${st === 'done' ? 'ok' : st === 'partial' ? 'warn' : ''}">${st === 'done' ? 'Completed' : st === 'partial' ? 'In progress' : 'Not started'}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Exercise</th><th>Target</th><th class="r">Weight</th><th class="r">Reps</th><th class="r">RPE</th><th class="r">e1RM</th><th class="r">vs last week</th><th class="r">Volume</th><th class="c">Done</th><th>Client note</th></tr></thead>
          <tbody>${list.map(r => {
            const prev = a.tr.find(x => x.week === wk - 1 && x.exercise === r.exercise);
            const diff = prev && prev.weight > 0 && r.weight > 0 ? r.weight - prev.weight : null;
            const est = r.e1rm ?? e1rm(r.weight, r.actualReps || r.reps);
            return `<tr>
              <td class="strong" title="${esc(r.cue)}">${esc(r.exercise)}</td><td class="muted n">${esc(r.target)}</td>
              <td class="r n">${r.weight == null ? dash : r.weight === 0 ? 'BW' : fw(r.weight)}</td><td class="r n">${r.actualReps ?? dash}</td>
              <td class="r n${r.rpe >= 9.5 ? ' down strong' : ''}">${r.rpe ?? dash}</td><td class="r n">${est ? fmt(est, 1) : dash}</td>
              <td class="r n">${diff == null ? dash : diff === 0 ? '<span class="muted">±0</span>' : `<span class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : '−'}${fw(Math.abs(diff))}</span>`}</td>
              <td class="r n">${r.volume ? fmt(r.volume) : dash}</td>
              <td class="c">${r.done ? '<span class="tag ok">Yes</span>' : dash}</td>
              <td class="wrap">${esc(r.note || '')}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
      </div>`;
    }).join('')}`;
}

function tabNutrition(a) {
  const T = a.T;
  const weeksRows = Array.from({ length: a.weeks }, (_, i) => {
    const rows = a.logged.filter(r => r.date >= addDays(a.P.startDate, i * 7) && r.date <= addDays(a.P.startDate, i * 7 + 6));
    return { w: i + 1, rows, weight: mean(rows.map(r => r.weight)), cal: mean(rows.map(r => r.calories)), pro: mean(rows.map(r => r.protein)), wat: mean(rows.map(r => r.water)), steps: mean(rows.map(r => r.steps)), sleep: mean(rows.map(r => r.sleep)), sh: mean(rows.map(r => r.shoulder)), on: rows.filter(a.onT).length };
  });
  weeksRows.forEach((r, i) => { r.delta = i && r.weight != null && weeksRows[i - 1].weight != null ? r.weight - weeksRows[i - 1].weight : null; });
  const heat = ['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const startDow = (parseYmd(a.P.startDate).getDay() + 6) % 7;
  const dowLabels = Array.from({ length: 7 }, (_, i) => heat[1 + (startDow + i) % 7]);
  const byDate = Object.fromEntries(a.daily.map(r => [r.date, r]));
  const grid = Array.from({ length: a.weeks }, (_, w) => `<span class="n">W${w + 1}</span>` + Array.from({ length: 7 }, (_, d) => {
    const date = addDays(a.P.startDate, w * 7 + d); const r = byDate[date];
    const logged = r && ['weight', 'calories', 'protein', 'water', 'steps'].some(k => r[k] != null);
    const cls = date > a.asOf ? 'future' : logged ? (a.onT(r) ? 'ok' : 'partial') : '';
    return `<i class="${cls}${date === today() ? ' today' : ''}" title="${short(date)}"></i>`;
  }).join('')).join('');
  const l7 = a.last7;
  const bar = (label, v, goal, kind, unit) => {
    if (goal == null) return '';
    const pct = v == null ? 0 : clamp(v / goal * 100, 0, 100);
    const ok = v == null ? null : kind === 'max' ? v <= goal : v >= goal;
    return `<div class="bar-row"><span>${label}</span><div class="meter"><i class="${ok == null ? '' : ok ? 'ok' : 'bad'}" style="width:${pct}%"></i></div><span class="r n" style="text-align:right">${fmt(v)} <span style="color:var(--text-3)">/ ${fmt(goal)}${unit}</span></span></div>`;
  };
  return `
    <div class="grid g-1-1">
      <div class="card">
        <div class="card-head"><div><div class="card-title">Last 7 days vs targets</div><div class="card-sub">Daily averages</div></div></div>
        <div class="bars">
          ${bar('Calories', mean(l7.map(r => r.calories)), T.calories, 'max', '')}
          ${bar('Protein', mean(l7.map(r => r.protein)), T.protein, 'min', ' g')}
          ${bar('Water', mean(l7.map(r => r.water)), T.water, 'min', ' oz')}
          ${bar('Steps', mean(l7.map(r => r.steps)), T.steps, 'min', '')}
          ${bar('Sleep', mean(l7.map(r => r.sleep)), T.sleep, 'min', ' h')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div><div class="card-title">Consistency</div><div class="card-sub">${a.logged.length} of ${Math.min(a.total, Math.max(1, a.di + 1))} days logged · ${a.logged.filter(a.onT).length} on target</div></div></div>
        <div class="heat"><span></span>${dowLabels.map(l => `<span class="dow">${l}</span>`).join('')}${grid}</div>
        <div class="heat-legend"><span><i style="background:var(--ok)"></i>All targets</span><span><i style="background:#E9C58A"></i>Partial</span><span><i style="background:var(--sunken)"></i>Not logged</span></div>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-head"><div><div class="card-title">Weekly summary</div><div class="card-sub">Mirrors the Command Console tab in the sheet</div></div></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Week</th><th>Dates</th><th class="r">Avg weight</th><th class="r">Change</th><th class="r">Calories</th><th class="r">Protein</th><th class="r">Water</th><th class="r">Steps</th><th class="r">Sleep</th><th class="r">${esc(a.jointLabel)}</th><th class="r">On target</th></tr></thead>
        <tbody>${weeksRows.map(r => `<tr${r.w === a.curWeek ? ' style="background:var(--accent-tint)"' : ''}>
          <td class="strong">Week ${r.w}</td><td class="muted">${short(addDays(a.P.startDate, (r.w - 1) * 7))} – ${short(addDays(a.P.startDate, r.w * 7 - 1))}</td>
          <td class="r n">${r.weight != null ? fmt(r.weight, 1) : dash}</td>
          <td class="r n">${r.delta == null ? dash : `<span class="${(r.delta >= 0) === (T.weight >= (a.startW ?? 0)) ? 'up' : 'down'}">${r.delta >= 0 ? '+' : '−'}${fmt(Math.abs(r.delta), 1)}</span>`}</td>
          <td class="r n">${r.cal != null ? fmt(r.cal) : dash}</td><td class="r n">${r.pro != null ? fmt(r.pro) : dash}</td><td class="r n">${r.wat != null ? fmt(r.wat) : dash}</td>
          <td class="r n">${r.steps != null ? fmt(r.steps) : dash}</td><td class="r n">${r.sleep != null ? fmt(r.sleep, 1) : dash}</td><td class="r n">${r.sh != null ? fmt(r.sh, 1) : dash}</td>
          <td class="r n">${r.rows.length ? `${r.on} / ${r.rows.length}` : dash}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-head"><div><div class="card-title">Daily log</div><div class="card-sub">Newest first</div></div></div>
      ${a.logged.length ? checkinTable(a.logged.slice().reverse(), a) : `<div class="allclear">No check-ins logged yet.</div>`}
    </div>`;
}

function drawStrength(c) {
  const el = $('#lchart'); const d = DATA[c.id]; if (!el || !d || !d.snap) return;
  const a = analyze(d.snap);
  const W = Math.max(320, el.clientWidth - 24), H = Math.max(200, el.clientHeight - 20), P = { t: 18, r: 22, b: 26, l: 46 };
  const isAll = S.lift === 'ALL';
  const isE1 = S.liftMode === 'e1rm';
  let pts = [], reg = null, unit = 'lb';
  if (isAll) {
    pts = a.strengthIdx.pts.map(p => ({ wk: p.wk, v: p.v, label: `${p.v >= 0 ? '+' : ''}${fmt(p.v, 1)}%` }));
    reg = a.strengthIdx.reg;
    unit = '%';
  } else {
    const l = a.keyLifts.find(x => x.name === S.lift);
    if (l) {
      pts = l.pts.map(p => ({ wk: p.wk, v: isE1 ? p.e1rm : p.w, label: `${fw(p.w)}×${p.r}` }));
      reg = isE1 ? l.regE : l.regW;
    }
  }
  if (!pts.length) { el.innerHTML = `<div class="allclear">No sets logged on this lift yet.</div>`; return; }

  const weeks = a.weeks;
  const projEnd = reg ? (isAll ? reg.at(weeks) : Math.max(0, reg.at(weeks))) : null;
  const vals = pts.map(p => p.v).concat(projEnd != null ? [projEnd, reg.at(pts[0].wk)] : []);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const padV = Math.max(isAll ? 2 : 5, (maxV - minV) * 0.22);
  const lo = isAll ? Math.floor(minV - padV) : Math.max(0, Math.floor((minV - padV) / 5) * 5);
  const hi = Math.ceil((maxV + padV) / (isAll ? 2 : 5)) * (isAll ? 2 : 5) || (lo + 10);

  const x = wk => P.l + ((wk - 1) / Math.max(1, weeks - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / Math.max(1, hi - lo)) * (H - P.t - P.b);
  const step = Math.max(isAll ? 2 : 5, Math.round((hi - lo) / 4));
  const ticks = []; for (let t = lo; t <= hi; t += step) ticks.push(t);
  const last = pts[pts.length - 1];
  const linePath = pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.wk).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const areaPath = pts.length >= 2 ? `${linePath} L${x(last.wk).toFixed(1)},${(H - P.b).toFixed(1)} L${x(pts[0].wk).toFixed(1)},${(H - P.b).toFixed(1)} Z` : '';

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Strength trajectory">
    <defs><linearGradient id="lfillc" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF5A1F" stop-opacity=".12"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#EFEDE8"/><text x="${P.l - 10}" y="${y(t) + 3.5}" text-anchor="end" font-size="11" fill="#8E8A83" font-family="Geist Mono, ui-monospace, monospace">${isAll && t > 0 ? '+' + t + '%' : isAll ? t + '%' : t}</text>`).join('')}
    ${Array.from({ length: weeks }, (_, w) => `<text x="${x(w + 1)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#8E8A83" font-family="Geist Mono, ui-monospace, monospace">W${w + 1}</text>`).join('')}
    ${areaPath ? `<path d="${areaPath}" fill="url(#lfillc)"/>` : ''}
    ${reg ? `<line x1="${x(pts[0].wk).toFixed(1)}" y1="${y(reg.at(pts[0].wk)).toFixed(1)}" x2="${x(last.wk).toFixed(1)}" y2="${y(reg.at(last.wk)).toFixed(1)}" stroke="#8E8A83" stroke-width="1.3" stroke-dasharray="3 3"/>` : ''}
    ${reg && last.wk < weeks ? `<line x1="${x(last.wk).toFixed(1)}" y1="${y(last.v).toFixed(1)}" x2="${x(weeks).toFixed(1)}" y2="${y(projEnd).toFixed(1)}" stroke="#FF5A1F" stroke-opacity=".8" stroke-width="1.8" stroke-dasharray="5 4"/>
      <circle cx="${x(weeks).toFixed(1)}" cy="${y(projEnd).toFixed(1)}" r="4.2" fill="#FFFFFF" stroke="#FF5A1F" stroke-width="2"/>
      <text x="${x(weeks) - 8}" y="${Math.max(14, y(projEnd) - 8)}" text-anchor="end" font-size="11" font-weight="600" fill="#C2410C" font-family="Geist Mono, ui-monospace, monospace">W${weeks}: ${isAll ? (projEnd >= 0 ? '+' : '') + fmt(projEnd, 1) + '%' : fmt(projEnd, 0) + ' ' + unit}</text>` : ''}
    ${pts.length >= 2 ? `<path d="${linePath}" fill="none" stroke="#FF5A1F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${pts.map((p, k) => `<circle cx="${x(p.wk).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${k === pts.length - 1 ? 4.5 : 3.2}" fill="#FF5A1F" stroke="#FFFFFF" stroke-width="2"/>`).join('')}
    <text x="${x(last.wk) + 9}" y="${y(last.v) + 4}" font-size="11.5" font-weight="600" fill="#151413" font-family="Geist Mono, ui-monospace, monospace">${isAll ? (last.v >= 0 ? '+' : '') + fmt(last.v, 1) + '%' : fmt(last.v, isE1 ? 1 : (last.v % 1 ? 1 : 0))}</text>
  </svg>`;
}

function drawWeight(c) {
  const el = $('#wchart'); const d = DATA[c.id]; if (!el || !d || !d.snap) return;
  const a = analyze(d.snap);
  const W = Math.max(320, el.clientWidth - 24), H = Math.max(200, el.clientHeight - 20), P = { t: 14, r: 10, b: 24, l: 40 };
  const pts = a.daily.filter(r => r.weight != null).map(r => ({ i: Math.round((parseYmd(r.date) - parseYmd(a.P.startDate)) / DAY), v: r.weight })).filter(p => p.i >= 0 && p.i < a.total);
  if (!pts.length) { el.innerHTML = `<div class="allclear">No weigh-ins yet.</div>`; return; }
  const vals = pts.map(p => p.v).concat(a.T.weight != null ? [a.T.weight] : []);
  const lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 0.5);
  const x = i => P.l + i / (a.total - 1) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const avg = pts.map(p => { const win = pts.filter(q => q.i <= p.i && q.i > p.i - 7); return { i: p.i, v: win.reduce((s, q) => s + q.v, 0) / win.length }; });
  const step = Math.max(1, Math.round((hi - lo) / 4));
  const ticks = []; for (let t = lo; t <= hi; t += step) ticks.push(t);
  const last = avg[avg.length - 1];
  const todayI = clamp(a.di, 0, a.total - 1);
  const area = `M${x(avg[0].i)},${y(lo)} ` + avg.map(p => `L${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ') + ` L${x(last.i)},${y(lo)} Z`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight trend">
    <defs><linearGradient id="wfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF5A1F" stop-opacity=".10"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#EFEDE8"/><text x="${P.l - 10}" y="${y(t) + 3.5}" text-anchor="end" font-size="11" fill="#8E8A83" font-family="Geist Mono, ui-monospace, monospace">${t}</text>`).join('')}
    ${Array.from({ length: a.weeks }, (_, w) => `<text x="${x(w * 7 + 3)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#8E8A83" font-family="Geist Mono, ui-monospace, monospace">W${w + 1}</text>`).join('')}
    <line x1="${x(todayI)}" x2="${x(todayI)}" y1="${P.t}" y2="${H - P.b}" stroke="#E7E5E0"/>
    ${a.T.weight != null ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(a.T.weight)}" y2="${y(a.T.weight)}" stroke="#5A5650" stroke-dasharray="3 4"/><text x="${W - P.r}" y="${y(a.T.weight) - 7}" text-anchor="end" font-size="11" fill="#5A5650" font-family="Geist, ui-sans-serif, system-ui">Goal ${a.T.weight} lb</text>` : ''}
    <path d="${area}" fill="url(#wfill)"/>
    ${pts.map(p => `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.5" fill="#C9C5BD"/>`).join('')}
    <path d="${avg.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('')}" fill="none" stroke="#FF5A1F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last.i)}" cy="${y(last.v)}" r="4.5" fill="#FF5A1F" stroke="#fff" stroke-width="2"/>
    <text x="${x(last.i) + 9}" y="${y(last.v) + 4}" font-size="11.5" font-weight="600" fill="#151413" font-family="Geist Mono, ui-monospace, monospace">${fmt(last.v, 1)}</text>
  </svg>`;
}

/* ---------- client dialog ---------- */
function openDialog(c) {
  editing = c ? c.id : null;
  const f = $('#client-form');
  $('#cd-title').textContent = c ? `Edit ${c.name}` : 'Add client';
  f.elements.name.value = c ? c.name : ''; f.elements.sheetUrl.value = c ? c.sheetUrl || '' : ''; f.elements.syncUrl.value = c ? c.syncUrl || '' : ''; f.elements.token.value = c ? c.token || '' : '';
  $('#cd-delete').style.visibility = c ? 'visible' : 'hidden';
  $('#cd-status').textContent = ''; $('#cd-status').className = 'modal-status';
  $('#client-dialog').showModal();
}
async function testDialog() {
  const f = $('#client-form'); const st = $('#cd-status');
  if (!f.elements.syncUrl.value.trim()) { st.className = 'modal-status bad'; st.textContent = 'Paste the sync URL first.'; return; }
  st.className = 'modal-status'; st.textContent = 'Connecting…';
  try { const snap = await fetchSnap({ syncUrl: f.elements.syncUrl.value.trim(), token: f.elements.token.value.trim() }); st.className = 'modal-status ok'; st.textContent = `Connected — ${snap.sheetName || 'sheet'} (${snap.daily.filter(r => r.weight != null).length} weigh-ins, ${snap.training.filter(r => r.done).length} exercises done).`; if (!f.elements.name.value.trim() && snap.profile && snap.profile.name) f.elements.name.value = snap.profile.name; }
  catch (err) { st.className = 'modal-status bad'; st.textContent = `Couldn't connect: ${err.message || err}`; }
}
function saveDialog() {
  const f = $('#client-form');
  const vals = { name: f.elements.name.value.trim(), sheetUrl: f.elements.sheetUrl.value.trim(), syncUrl: f.elements.syncUrl.value.trim(), token: f.elements.token.value.trim() };
  if (!vals.name) { $('#cd-status').className = 'modal-status bad'; $('#cd-status').textContent = 'Name is required.'; return; }
  let c = S.clients.find(x => x.id === editing);
  if (c) { if (c.syncUrl !== vals.syncUrl) { delete DATA[c.id]; delete S.cache[c.id]; } Object.assign(c, vals); }
  else { c = Object.assign({ id: uid(), preset: /^emily\b/i.test(vals.name) ? 'emily' : undefined }, vals); S.clients.push(c); }
  S.view = 'client'; S.selected = c.id; S.tab = 'overview'; save();
  $('#client-dialog').close(); render(); load(c, true);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  const a = t.dataset.action, c = S.clients.find(x => x.id === t.dataset.id);
  if (a === 'roster') { S.view = 'roster'; save(); render(); }
  else if (a === 'open') { S.view = 'client'; S.selected = t.dataset.id; S.tab = 'overview'; S.week = null; S.lift = null; save(); render(); window.scrollTo({ top: 0 }); }
  else if (a === 'tab') { S.tab = t.dataset.tab; save(); render(); }
  else if (a === 'week') { S.week = +t.dataset.week; render(); }
  else if (a === 'pick-lift') { S.lift = t.dataset.name; save(); render(); }
  else if (a === 'lift-mode') { S.liftMode = t.dataset.mode; save(); render(); }
  else if (a === 'refresh') { loadAll(true).then(() => toast('Updated')); }
  else if (a === 'refresh-one' && c) { load(c, true).then(() => toast(DATA[c.id].error ? 'Refresh failed' : 'Updated')); }
  else if (a === 'add-client') openDialog(null);
  else if (a === 'edit-client' && c) openDialog(c);
  else if (a === 'test-client') testDialog();
  else if (a === 'save-client') saveDialog();
  else if (a === 'delete-client') {
    const x = S.clients.find(y => y.id === editing);
    if (x && confirm(`Remove ${x.name} from this dashboard? Their Google Sheet is not affected.`)) { S.clients = S.clients.filter(y => y.id !== x.id); if (!S.removedIds.includes(x.id)) S.removedIds.push(x.id); delete DATA[x.id]; delete S.cache[x.id]; S.view = 'roster'; save(); $('#client-dialog').close(); render(); }
  }
  else if (a === 'copy-link' && c) {
    const baseUrl = new URL('client.html', location.href);
    baseUrl.hash = '';
    const preset = c.preset || (c.id === 'emily' || /^emily\b/i.test(c.name) ? 'emily' : c.id === 'scott' ? 'scott' : '');
    if (preset) baseUrl.searchParams.set('client', preset);
    const link = c.syncUrl
      ? `${baseUrl.toString()}#${new URLSearchParams({ url: c.syncUrl, token: c.token || '', name: c.name })}`
      : baseUrl.toString();
    const note = c.syncUrl ? `Link for ${c.name.split(' ')[0]} copied` : `App link for ${c.name.split(' ')[0]} copied (add Sync URL later for sheet sync)`;
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast(note)).catch(() => prompt('Copy this link', link));
  }
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const c = S.clients.find(x => x.id === S.selected); if (S.view === 'client' && c) { if (S.tab === 'overview') drawWeight(c); if (S.tab === 'overview' || S.tab === 'training') drawStrength(c); } }, 120); });

S.clients.forEach(c => { if (!c.syncUrl) DATA[c.id] = { snap: demoSnapshot(c), demo: true }; else if (S.cache[c.id]) DATA[c.id] = { snap: S.cache[c.id].snap, demo: false, fetchedAt: S.cache[c.id].at }; });
render();
loadAll(false);
})();
</script>
