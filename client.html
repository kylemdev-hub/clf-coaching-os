<title>CLF Protocol — Client App</title>
<meta name="description" content="CLF Protocol mobile training log, daily check-ins, strength trajectory, body measurements, and Apple Health sync.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#030404;color-scheme:dark}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.app{
  --bg:#050707; --surface:#0C1011; --surface-2:#111617; --surface-3:#192021;
  --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.11);
  --text:#ECF3F2; --text-2:#9AA7A6; --text-3:#5F6B6B;
  --accent:#2DD4BF; --accent-press:#14B8A6; --on-accent:#022320;
  --accent-tint:rgba(45,212,191,.10); --accent-line:rgba(45,212,191,.32);
  --ok:#4ADE80; --ok-tint:rgba(74,222,128,.10);
  --warn:#F2B84B; --bad:#F2706A;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  position:relative;max-width:520px;min-height:100dvh;margin:0 auto;
  background:radial-gradient(120% 420px at 50% -160px,rgba(45,212,191,.075),transparent 70%) no-repeat,var(--bg);
  color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
.app:has(.dock){padding-bottom:calc(172px + env(safe-area-inset-bottom))}
@media (min-width:560px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* Auth screen */
.auth-wrap{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px}
.auth-card{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:26px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 20px 60px rgba(0,0,0,.6)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.auth-title{font-size:22px;font-weight:600;letter-spacing:-.03em;margin:0}
.auth-sub{font-size:13.5px;color:var(--text-2);margin:6px 0 20px;line-height:1.5}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin-bottom:16px}
.auth-tabs button{height:34px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font-size:13px;font-weight:500}
.auth-tabs button[aria-selected=true]{background:var(--surface-3);color:var(--text)}
.auth-msg{margin-top:12px;font-size:13px;min-height:18px;color:var(--text-2)}
.auth-msg.ok{color:var(--ok)} .auth-msg.bad{color:var(--bad)}
.auth-foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--text-3)}

/* Header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 12px calc(20px + env(safe-area-inset-left));
  background:rgba(5,7,7,.88);
  -webkit-backdrop-filter:saturate(150%) blur(16px);backdrop-filter:saturate(150%) blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 auto}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(160deg,#5EEAD4,#14B8A6);color:var(--on-accent);display:grid;place-items:center;
  font:700 10.5px/1 var(--mono);letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.2);flex:none}
.brand-name{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--text-2);font-size:12px;font-weight:500;white-space:nowrap;flex:none;transition:background .2s var(--ease)}
.chip:hover{background:var(--surface-2)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.chip[data-state=ok] .dot{background:var(--ok)}
.chip[data-state=pending] .dot{background:var(--warn)}
.chip[data-state=error] .dot{background:var(--bad)}
.chip[data-state=syncing] .dot{background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* Coach preview switcher */
.coach-bar{display:flex;align-items:center;gap:8px;padding:10px calc(20px + env(safe-area-inset-right)) 10px calc(20px + env(safe-area-inset-left));background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--text-2);overflow-x:auto}
.coach-bar select{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;color:var(--text);font-size:12.5px;outline:none}
.coach-bar a{margin-left:auto;color:var(--accent);text-decoration:none;font-weight:500;white-space:nowrap}

/* Layout */
main{padding:24px calc(20px + env(safe-area-inset-right)) 24px calc(20px + env(safe-area-inset-left))}
.view{opacity:1}
.view.view-enter{animation:enter .18s var(--ease) both}
@keyframes enter{from{opacity:.85;transform:translateY(3px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12.5px;color:var(--text-3);font-weight:500}
h1{font-size:34px;line-height:1.04;letter-spacing:-.04em;font-weight:600;margin:6px 0 0}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lede{color:var(--text-2);font-size:14px;margin:8px 0 0}
.section-label{font-size:12px;font-weight:500;color:var(--text-3);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Future-week preview banner & confirmation modal */
.future-banner{margin-top:12px;padding:10px 13px;border-radius:12px;background:rgba(242,184,75,.09);border:1px solid rgba(242,184,75,.32);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.future-banner b{color:var(--warn);font-weight:600}
.future-jump{height:28px;padding:0 10px;border-radius:8px;border:1px solid rgba(242,184,75,.38);background:var(--surface);color:var(--text);font-size:12px;font-weight:500;white-space:nowrap}
.future-jump:hover{background:var(--surface-2)}
dialog.confirm-modal{border:0;padding:0;margin:auto;width:min(400px,calc(100% - 32px));border-radius:18px;background:var(--surface);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 64px rgba(0,0,0,.7),0 0 0 1px var(--line-2)}
dialog.confirm-modal::backdrop{background:rgba(0,0,0,.68);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.confirm-inner{padding:22px 20px 18px}
.confirm-title{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.confirm-body{font-size:13.5px;color:var(--text-2);line-height:1.5;margin:0 0 18px}
.confirm-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}

/* Pinned coach note */
.coach-note{margin-top:16px;padding:13px 15px;border-radius:14px;background:var(--surface);border:1px solid var(--accent-line);
  box-shadow:inset 3px 0 0 var(--accent),0 1px 2px rgba(0,0,0,.35)}
.coach-note-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.01em}
.coach-note-head span{color:var(--text-3);font-weight:400}
.coach-note p{margin:0;font-size:13.5px;color:var(--text);line-height:1.5}

/* Stepper & Segmented */
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.stepper-btn{width:30px;height:30px;border:0;background:transparent;border-radius:7px;display:grid;place-items:center;color:var(--text-2)}
.stepper-btn:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.stepper-btn:disabled{opacity:.3;cursor:default}
.stepper-btn svg.i{width:16px;height:16px}
.stepper-label{font-size:12.5px;color:var(--text);min-width:40px;text-align:center}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:18px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg-btn{height:38px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-size:13.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;transition:background .2s var(--ease),color .2s var(--ease)}
.seg[data-many=true] .seg-btn{font-size:12px;gap:3px;padding:0 2px}
.seg-btn[aria-selected=true]{background:var(--surface-3);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.4)}
.seg-tick{display:grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--ok);color:#041A0C;flex:none}
.seg-tick svg.i{width:9px;height:9px;stroke-width:3}

/* Progress track */
.progress{margin-top:18px}
.progress-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:8px}
.track{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.track i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .45s var(--ease)}
.track i[data-tone=ok]{background:var(--ok)}
.track i[data-tone=bad]{background:var(--bad)}

/* Exercise cards */
.ex-list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 1px 2px rgba(0,0,0,.35);overflow:hidden;transition:border-color .2s var(--ease)}
.ex.is-open{border-color:var(--line-2)}
.ex-head{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto 18px;align-items:center;gap:10px;padding:14px 15px;background:transparent;border:0;text-align:left}
.ex-idx{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font:500 11.5px/1 var(--mono);color:var(--text-3)}
.ex.is-done .ex-idx{background:var(--ok);border-color:transparent;color:#041A0C}
.ex.is-done .ex-idx svg.i{width:14px;height:14px;stroke-width:2.6}
.ex-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.ex-name-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;min-width:0}
.ex-name{font-size:15px;font-weight:550;letter-spacing:-.01em;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pr-badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--accent-tint);border:1px solid var(--accent-line);color:var(--accent);font:600 10px/1 var(--mono);letter-spacing:.03em;flex:none}
.ex-sub{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-sub b{color:var(--accent);font-weight:500}
.ex-target{font-size:13px;color:var(--text-2);white-space:nowrap}
.ex-chev{color:var(--text-3);transition:transform .25s var(--ease)}
.ex-chev svg.i{width:16px;height:16px}
.ex.is-open .ex-chev{transform:rotate(180deg)}
.ex-body{padding:0 16px 16px;animation:enter .2s var(--ease) both}
.cue{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.cue-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.cue strong{font-size:12.5px;font-weight:600;color:var(--text)}
.video-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;padding:3px 8px;border-radius:6px;background:var(--accent-tint);border:1px solid var(--accent-line);white-space:nowrap;flex:none}
.video-link:hover{filter:brightness(1.1)}
.video-link svg.i{width:13px;height:13px}
.cue p{margin:0;font-size:13px;line-height:1.5;color:var(--text-2)}

.sets{margin-top:14px}
.set-head,.set{display:grid;grid-template-columns:26px 1fr 1fr 1fr 44px;gap:8px;align-items:center}
.set-head{font-size:11.5px;color:var(--text-3);padding:0 0 6px;font-weight:500}
.set-head span:not(:first-child){text-align:center}
.set{padding:4px 0}
.set-n{font-size:12.5px;color:var(--text-3);text-align:center}
.num-input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;color:var(--text);outline:none;transition:border-color .15s,background .15s;-moz-appearance:textfield}
.num-input::placeholder{color:var(--text-3)}
.num-input:focus{border-color:var(--accent-line);background:var(--surface-3)}
.num-input.is-invalid{border-color:var(--bad)!important;background:rgba(242,112,106,.08)!important}
.set.is-done .num-input{background:transparent;border-color:transparent;color:var(--text)}
.set-check{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--text-3);display:grid;place-items:center;transition:background .15s,color .15s,transform .1s}
.set-check:active{transform:scale(.94)}
.set.is-done .set-check{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.set-check svg.i{width:18px;height:18px;stroke-width:2.4}
.ex-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12.5px;color:var(--text-3)}
.ex-foot-actions{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px}
.mini-act{height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.mini-act:hover{background:var(--surface-3);color:var(--text)}
.mini-act.accent{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.mini-act.danger{color:var(--bad)}
.extra-badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--surface-3);border:1px solid var(--line-2);color:var(--text-2);font:600 9.5px/1 var(--mono);letter-spacing:.04em;flex:none}
.extra-zone{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.extra-quick{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--text-3)}
.extra-chip{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--accent-line);background:var(--accent-tint);color:var(--accent);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.extra-chip svg.i{width:13px;height:13px}
.extra-card{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:15px;animation:enter .2s var(--ease) both}
.extra-grid{display:grid;grid-template-columns:1fr 90px 124px;gap:8px;margin-top:10px}
@media(max-width:480px){.extra-grid{grid-template-columns:1fr 1fr}.extra-grid .span-2{grid-column:1/-1}}
.extra-field{min-width:0}
.extra-field label{display:block;font-size:11.5px;color:var(--text-3);margin-bottom:4px}
.extra-field input,.extra-field select{width:100%;height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 11px;font-size:16px;color:var(--text);outline:none}
.extra-field input:focus,.extra-field select:focus{border-color:var(--accent-line);background:var(--surface-3)}
.extra-chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none}
.extra-chk input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.lift-jump{width:100%;height:36px;margin-bottom:10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 10px;font-size:13px;color:var(--text);outline:none}
.lift-jump:focus{border-color:var(--accent-line)}
.text-input{width:100%;margin-top:12px;height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;padding:0 12px;font-size:14px;outline:none}
.text-input:focus{border-color:var(--accent-line);background:var(--surface-2)}
.text-input::placeholder{color:var(--text-3)}

/* Buttons */
.btn{height:48px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex-shrink:0;transition:background .15s,filter .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn-primary{background:linear-gradient(180deg,#3FE0CB,#20BFAA);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.5)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-secondary{background:var(--surface-2);border-color:var(--line-2);color:var(--text)}
.btn-secondary:hover{background:var(--surface-3)}
.btn-sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%;flex-shrink:1}
.finish{margin-top:20px}
.finish-note{text-align:center;font-size:12.5px;color:var(--text-3);margin:10px 0 0}
.link-btn{border:0;background:none;padding:6px 0;font-size:13px;color:var(--text-2);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.link-btn.danger{color:var(--bad)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 1px 2px rgba(0,0,0,.35)}
.card + .card{margin-top:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;letter-spacing:-.01em;min-width:0;line-height:1.3}
.card-meta{font-size:12px;color:var(--text-3)}

/* Check-in & Measurements */
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.verdict{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--text-2)}
.verdict b{color:var(--text);font-weight:600}
.pips{display:flex;gap:4px;margin-left:auto}
.pips i{width:18px;height:4px;border-radius:2px;background:var(--surface-3)}
.pips i.on{background:var(--ok)}
.metric + .metric{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.metric-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.metric-top label{font-size:14px;font-weight:500}
.metric-hint{font-size:12px;color:var(--text-3)}
.metric-hint[data-tone=ok]{color:var(--ok)}
.metric-ctl{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}
.step{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);display:grid;place-items:center}
.step:hover{background:var(--surface-3);color:var(--text)}
.step svg.i{width:16px;height:16px}
.metric-field{position:relative}
.metric-field .num-input{padding-right:40px;padding-left:40px}
.unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-3);pointer-events:none}
.metric .track{margin-top:9px;height:3px}
.quick-adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qadd{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--accent-text);font:500 12px/1 var(--mono);transition:background .15s,border-color .15s,transform .1s}
.qadd:hover{background:var(--accent-tint);border-color:var(--accent-line)}
.qadd:active{transform:scale(.95)}
.qadd-custom{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.qadd-custom input{width:64px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);text-align:center;font:500 12.5px/1 var(--mono);color:var(--text);outline:none}
.qadd-custom input:focus{border-color:var(--accent-line)}
.qadd-custom button{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--accent-line);background:var(--accent-tint);color:var(--accent);font:600 12px/1 var(--mono)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font:500 13px/1 var(--mono);color:var(--text-2);padding:0}
.scale button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.scale button.on.t-bad{background:var(--bad);color:#1A0805}
.scale button.on.t-warn{background:var(--warn);color:#1A1205}
.scale-legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);margin-top:6px}
textarea.text-input{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.45;margin-top:0}
.meas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.meas-field label{display:block;font-size:12px;color:var(--text-3);margin-bottom:5px}

/* Progress & Trajectory */
.mode-switch{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.mode-switch button{height:24px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--text-3);font-size:11.5px;font-weight:500}
.mode-switch button[aria-pressed=true]{background:var(--surface-3);color:var(--text)}
.stat-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.stat-big{font-size:36px;font-weight:500;letter-spacing:-.04em;line-height:1}
.stat-big small{font-size:14px;color:var(--text-3);margin-left:4px;letter-spacing:0}
.stat-side{text-align:right;font-size:12.5px;color:var(--text-3);line-height:1.55}
.delta-up{color:var(--ok)} .delta-down{color:var(--bad)}
.chart{margin-top:14px;height:152px}
.chart.tall{height:170px}
.chart svg{display:block;width:100%;height:100%}
.lift-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.lift-pills::-webkit-scrollbar{display:none}
.lift-pill{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.lift-pill[aria-selected=true]{background:var(--accent-tint);border-color:var(--accent-line);color:var(--accent)}
.traj-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.traj-kpi{display:flex;flex-direction:column;gap:2px}
.traj-kpi span{font-size:11px;color:var(--text-3)}
.traj-kpi b{font-size:13.5px;font-weight:500}
.lift{width:100%;display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:11px 6px;margin:0 -6px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;border-radius:8px}
.lift:first-of-type{border-top:0}
.lift:hover{background:rgba(255,255,255,.02)}
.lift.is-sel .lift-name{color:var(--accent)}
.lift-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ------------------------------------------------------------------ *
 * Strict Numeric Validation (Entry & Save)
 * ------------------------------------------------------------------ */
const NUM_RULES = {
  set_weight:    { min: 0,  max: 1500,   dec: 2, maxDigits: 4, label: 'Weight', unit: 'lb' },
  set_reps:      { min: 1,  max: 100,    dec: 0, maxDigits: 3, label: 'Reps', unit: '' },
  set_rpe:       { min: 1,  max: 10,     dec: 1, maxDigits: 2, label: 'RPE', unit: '' },
  chk_weight:    { min: 50, max: 600,    dec: 1, maxDigits: 3, label: 'Bodyweight', unit: 'lb' },
  chk_calories:  { min: 0,  max: 10000,  dec: 0, maxDigits: 5, label: 'Calories', unit: 'kcal' },
  chk_protein:   { min: 0,  max: 500,    dec: 0, maxDigits: 3, label: 'Protein', unit: 'g' },
  chk_water_oz:  { min: 0,  max: 500,    dec: 0, maxDigits: 3, label: 'Water', unit: 'oz' },
  chk_steps:     { min: 0,  max: 100000, dec: 0, maxDigits: 6, label: 'Steps', unit: 'steps' },
  chk_sleep_hrs: { min: 0,  max: 24,     dec: 2, maxDigits: 2, label: 'Sleep', unit: 'hr' },
  meas:          { min: 5,  max: 100,    dec: 2, maxDigits: 3, label: 'Measurement', unit: 'in' },
  cadd_water_oz: { min: 1,  max: 500,    dec: 0, maxDigits: 3, label: 'Water add', unit: 'oz' },
};

function sanitizeNumInput(raw, ruleKey) {
  const rule = NUM_RULES[ruleKey];
  if (!rule) return { text: raw, capped: false };
  let s = String(raw ?? '').replace(/[-+eE\s,]/g, '');
  s = rule.dec > 0 ? s.replace(/[^0-9.]/g, '') : s.replace(/[^0-9]/g, '');
  if (rule.dec > 0) {
    const firstDot = s.indexOf('.');
    if (firstDot !== -1) {
      s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');
      if (firstDot === 0) s = '0' + s;
    }
  }
  if (s === '') return { text: '', capped: false };
  let [intPart, decPart] = s.split('.');
  if (intPart.length > 1) intPart = intPart.replace(/^0+(?=\d)/, '');
  let capped = false;
  if (intPart.length > rule.maxDigits) {
    intPart = intPart.slice(0, rule.maxDigits);
    capped = true;
  }
  if (decPart !== undefined && decPart.length > rule.dec) {
    decPart = decPart.slice(0, rule.dec);
    capped = true;
  }
  let out = decPart !== undefined ? `${intPart}.${decPart}` : intPart;
  while (out !== '' && out !== '0.' && Number(out) > rule.max) {
    out = out.slice(0, -1);
    if (out.endsWith('.')) out = out.slice(0, -1);
    capped = true;
  }
  return { text: out, capped };
}

function parseValidNum(raw, ruleKey) {
  const rule = NUM_RULES[ruleKey];
  const s = String(raw ?? '').trim();
  if (s === '') return { ok: true, value: null };
  if (/[-+eE]/.test(s)) return { ok: false, error: `Invalid ${rule.label.toLowerCase()}` };
  const pattern = rule.dec > 0 ? /^\d+(\.\d+)?$/ : /^\d+$/;
  if (!pattern.test(s)) {
    return { ok: false, error: `${rule.label} must be a valid ${rule.dec > 0 ? 'number' : 'whole number'}` };
  }
  const n = Number(s);
  if (!Number.isFinite(n) || n < rule.min || n > rule.max) {
    const unit = rule.unit === 'in' ? '"' : (rule.unit ? ' ' + rule.unit : '');
    return { ok: false, error: `${rule.label} must be ${rule.min}–${fmt(rule.max)}${unit}` };
  }
  return { ok: true, value: rule.dec > 0 ? +n.toFixed(rule.dec) : Math.round(n) };
}

function flashInvalid(el, fallbackVal) {
  if (!el) return;
  el.classList.add('is-invalid');

}

function currentWeek(c) {

function dayExercises(day) {

function extraDayExercises(wk, day) {
  const prescribedLow = new Set(dayExercises(day).map(e => e.name.toLowerCase()));
  const byName = new Map();
  Object.values(S.setsMap).forEach(r => {
    if (r.week !== wk || r.day_name !== day || !r.exercise_name) return;
    if (prescribedLow.has(r.exercise_name.toLowerCase())) return;
    if (!r.done && r.weight == null && r.reps == null) return;
    const cur = byName.get(r.exercise_name) || { name: r.exercise_name, maxSet: 0, bwHint: false };
    if (r.set_num > cur.maxSet) cur.maxSet = r.set_num;
    if (r.note === 'bw') cur.bwHint = true;
    byName.set(r.exercise_name, cur);
  });
  Object.entries(S.bonusDrafts).forEach(([k, d]) => {
    if (!d || !d.name) return;
    const prefix = `${wk}|${day}|`;
    if (!k.startsWith(prefix)) return;
    if (prescribedLow.has(d.name.toLowerCase())) return;
    const cur = byName.get(d.name) || { name: d.name, maxSet: 0, bwHint: false };
    cur.draft = d;
    byName.set(d.name, cur);
  });
  return [...byName.values()].map(item => {
    const priorAnyBw = Object.values(S.setsMap).some(r => r.exercise_name === item.name && r.note === 'bw');
    const isBw = item.draft ? !!item.draft.is_bodyweight : (item.bwHint || priorAnyBw);
    const sets = Math.max(item.draft?.sets || 0, item.maxSet || 0, 3);
    return {
      name: item.name,
      day_name: day,
      sets: item.draft?.sets ? Math.max(item.draft.sets, item.maxSet) : (item.maxSet || 3),
      target_reps: null,
      rep_label: 'Extra',
      rest_sec: item.draft?.rest_sec || 75,
      is_bodyweight: isBw,
      cue: '',
      video_url: '',
      is_extra: true,
    };
  });
}

function priorDayExtraNames(wk, day) {
  const activeLow = new Set([
    ...dayExercises(day).map(e => e.name.toLowerCase()),
    ...extraDayExercises(wk, day).map(e => e.name.toLowerCase()),
  ]);
  const found = new Map();
  Object.values(S.setsMap).forEach(r => {
    if (!r.done || r.day_name !== day || r.week === wk || !r.exercise_name) return;
    const low = r.exercise_name.toLowerCase();
    if (activeLow.has(low)) return;
    const prev = found.get(low);
    if (!prev || r.set_num > prev.sets) {
      found.set(low, { name: r.exercise_name, sets: Math.max(prev?.sets || 3, r.set_num), is_bodyweight: r.note === 'bw' || (prev?.is_bodyweight ?? false) });
    }
  });
  return [...found.values()];
}

function findDayExercise(day, exName, wk = S.week) {

}

/* Prior-week performance, PR detection, and Next-Session Target suggestion */
function priorSetsFor(exName, beforeWeek) {
  const low = String(exName || '').toLowerCase();
  return Object.values(S.setsMap).filter(r => String(r.exercise_name || '').toLowerCase() === low && r.done && r.week < beforeWeek);
}

function bestPrior(exName, beforeWeek) {
  const rows = priorSetsFor(exName, beforeWeek);
  let bestE1 = 0, bestReps = 0, lastWk = 0, lastRow = null;
  for (const r of rows) {
    const e = e1rm(Number(r.weight), Number(r.reps));
    if (e && e > bestE1) bestE1 = e;
    if (Number(r.reps) > bestReps) bestReps = Number(r.reps);
    if (r.week > lastWk || (r.week === lastWk && Number(r.weight || 0) >= Number(lastRow?.weight || 0))) {
      lastWk = r.week; lastRow = r;
    }
  }
  return { bestE1, bestReps, lastRow };
}

function isPR(ex, row) {
  if (!row.done) return false;
  const { bestE1, bestReps } = bestPrior(ex.name, row.week);
  if (ex.is_bodyweight) return bestReps > 0 && Number(row.reps) > bestReps;
  const cur = e1rm(Number(row.weight), Number(row.reps));
  return bestE1 > 0 && cur != null && cur > bestE1 + 0.5;
}

function nextTargetHint(ex, wk) {
  const { lastRow } = bestPrior(ex.name, wk);
  if (!lastRow) return null;
  if (ex.is_bodyweight) {
    const r = Number(lastRow.reps || 0);
    return r ? `Next target: ${r + 1} reps` : null;
  }
  const w = Number(lastRow.weight || 0), r = Number(lastRow.reps || 0);
  if (!w) return null;
  const hitTarget = ex.target_reps ? r >= ex.target_reps : true;
  if (hitTarget) {
    const bump = /squat|deadlift|hip thrust|leg press/i.test(ex.name) ? 5 : 2.5;
    return `Next target: ${w + bump} lb × ${ex.target_reps || r}`;
  }
  return `Next target: ${w} lb × ${r + 1}`;
}

async function loadClientBundle(clientRow) {
  S.client = clientRow;
  S.mode = 'app';
  S.week = currentWeek(clientRow);
  S.confirmedFutureWeeks = {};
  S.showExtraForm = false;
  S.bonusDrafts = loadBonusDrafts(clientRow.id);
  S.requestedExtras = {};
  S.syncState = 'syncing';
  render();
  try {
    const [exRes, setRes, chkRes, measRes, noteRes, msgRes, phRes] = await Promise.all([
      sb.from('program_exercises').select('*').eq('client_id', clientRow.id).order('day_order').order('exercise_order'),
      sb.from('workout_sets').select('*').eq('client_id', clientRow.id),
      sb.from('checkins').select('*').eq('client_id', clientRow.id).order('date'),
      sb.from('measurements').select('*').eq('client_id', clientRow.id).order('date'),
      sb.from('coach_notes').select('*').eq('client_id', clientRow.id).order('created_at', { ascending: false }).limit(10),
      sb.from('messages').select('*').eq('client_id', clientRow.id).order('created_at'),
      sb.from('progress_photos').select('*').eq('client_id', clientRow.id).order('date'),
    ]);
    S.exercises = exRes.data || [];
    S.setsMap = {};
    (setRes.data || []).forEach(r => { S.setsMap[setKey(r.week, r.day_name, r.exercise_name, r.set_num)] = r; });
    S.checkins = {};
    (chkRes.data || []).forEach(r => { S.checkins[r.date] = r; });
    S.measurements = measRes.data || [];
    S.notes = noteRes.data || [];
    S.messages = msgRes.error ? [] : (msgRes.data || []);
    S.photos = phRes.error ? [] : (phRes.data || []);
    S.photoUrls = {};
    if (S.photos.length) {
      await Promise.all(S.photos.map(async p => {
        const { data } = await sb.storage.from('progress-photos').createSignedUrl(p.storage_path, 3600);
        if (data?.signedUrl) S.photoUrls[p.id] = data.signedUrl;
      }));
    }
    const ds = daysList();
    S.day = ds[0] || '';
    S.openEx = null;
    S.syncState = 'ok';
  } catch (err) {
    S.syncState = 'error';
    toast('Sync error: ' + err.message);
  }
  render();
}

async function uploadProgressPhoto(file, pose) {
  if (!file || !S.client) return;
  if (S.mode === 'demo') { toast('Sign in to upload private progress photos'); return; }
  S.syncState = 'syncing'; updateChip();
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${S.client.id}/${Date.now()}_${pose.toLowerCase()}.${ext}`;
  const { error: upErr } = await sb.storage.from('progress-photos').upload(path, file, { upsert: false });
  if (upErr) { S.syncState = 'error'; updateChip(); toast('Upload failed: ' + upErr.message); return; }
  const { data: row, error: insErr } = await sb.from('progress_photos').insert({
    client_id: S.client.id, date: S.checkDate, pose, storage_path: path
  }).select().single();
  if (insErr) { S.syncState = 'error'; updateChip(); toast('Save failed: ' + insErr.message); return; }
  const { data: signed } = await sb.storage.from('progress-photos').createSignedUrl(path, 3600);
  S.photos.push(row);

}

async function sendChat(body) {

async function initAuth() {
  try { screen.orientation?.lock?.('portrait').catch(() => {}); } catch {}
  if (!sb) { S.mode = 'auth'; S.authMsg = 'Supabase SDK failed to load.'; S.authTone = 'bad'; render(); return; }
  render();
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { S.mode = 'auth'; render(); return; }
    await onSignedIn(session.user);
  } catch (err) {
    S.mode = 'auth';
    S.authMsg = 'Session error: ' + (err?.message || err);
    S.authTone = 'bad';
    render();
  }
}

async function onSignedIn(user) {
  S.user = user;
  S.mode = 'loading';
  S.syncState = 'syncing';
  render();

  // Check if coach (owns clients) or client (linked by auth_user_id)
  const { data: coachClients } = await sb.from('clients').select('*').eq('coach_id', user.id).eq('active', true).order('created_at');
  if (coachClients && coachClients.length > 0) {
    S.isCoach = true;
    S.allClients = coachClients;
    const qp = new URLSearchParams(location.search).get('client');
    const chosen = coachClients.find(c => c.slug === qp) || coachClients[0];
    await loadClientBundle(chosen);
    return;
  }

  const { data: selfRows } = await sb.from('clients').select('*').eq('auth_user_id', user.id).limit(1);
  if (selfRows && selfRows.length > 0) {
    S.isCoach = false;
    S.allClients = selfRows;
    await loadClientBundle(selfRows[0]);
    return;
  }

  S.mode = 'auth';
  S.authMsg = 'Signed in, but no client profile is linked to ' + user.email + ' yet. Ask your coach to add your email in the Coach Dashboard.';
  S.authTone = 'bad';
  await sb.auth.signOut();
  render();
}

async function persistSet(row) {
  for (const [k, rk] of [['weight', 'set_weight'], ['reps', 'set_reps'], ['rpe', 'set_rpe']]) {
    if (row[k] != null && row[k] !== '') {
      const check = parseValidNum(row[k], rk);

      row[k] = check.value;
    } else {
      row[k] = null;
    }
  }
  S.setsMap[setKey(row.week, row.day_name, row.exercise_name, row.set_num)] = row;
  if (S.mode === 'demo') return true;
  S.syncState = 'syncing'; updateChip();
  const payload = {
    client_id: S.client.id, week: row.week, day_name: row.day_name, exercise_name: row.exercise_name,
    set_num: row.set_num, weight: row.weight, reps: row.reps, rpe: row.rpe, done: !!row.done, note: row.note || '',

}

let chkTimer;
function persistCheckin(date, patch) {
  const chkRules = { weight: 'chk_weight', calories: 'chk_calories', protein: 'chk_protein', water_oz: 'chk_water_oz', steps: 'chk_steps', sleep_hrs: 'chk_sleep_hrs' };
  const cleanPatch = { ...patch };
  for (const [k, rk] of Object.entries(chkRules)) {
    if (k in cleanPatch) {
      if (cleanPatch[k] == null || cleanPatch[k] === '') cleanPatch[k] = null;
      else {
        const res = parseValidNum(cleanPatch[k], rk);
        if (!res.ok) { toast(res.error); return false; }
        cleanPatch[k] = res.value;
      }
    }
  }
  const cur = Object.assign({ date, weight: null, calories: null, protein: null, water_oz: null, steps: null, sleep_hrs: null, energy: null, joint_comfort: null, notes: '', source: 'manual' }, S.checkins[date] || {}, cleanPatch);
  S.checkins[date] = cur;
  if (S.mode === 'demo') return true;
  S.syncState = 'syncing'; updateChip();
  clearTimeout(chkTimer);
  chkTimer = setTimeout(async () => {
    const payload = { ...cur, client_id: S.client.id, updated_at: new Date().toISOString() };
    delete payload.id;
    const { error } = await sb.from('checkins').upsert(payload, { onConflict: 'client_id,date' });
    S.syncState = error ? 'error' : 'ok';
    if (error) toast('Check-in save failed');
    updateChip();
  }, 450);
  return true;
}

async function saveMeasurement(form) {
  const fields = [
    ['waist_in', 'Waist'],
    ['chest_in', 'Chest'],
    ['hips_in', 'Hips'],
    ['arms_in', 'Arms'],
    ['thighs_in', 'Thighs'],
  ];
  const parsed = {};
  for (const [k, label] of fields) {
    const inp = form.elements[k];
    const v = inp.value.trim();
    if (v === '') { parsed[k] = null; continue; }
    const res = parseValidNum(v, 'meas');
    if (!res.ok) {
      flashInvalid(inp);
      inp.focus();
      toast(`${label} must be 5–100"`);
      return;
    }
    parsed[k] = res.value;
  }
  const photo_url = form.elements.photo_url.value.trim();
  const notes = form.elements.notes.value.trim();
  if (Object.values(parsed).every(v => v == null) && !photo_url && !notes) {
    toast('Enter at least one measurement or note');
    return;
  }
  const row = {
    client_id: S.client?.id, date: S.checkDate,
    ...parsed,
    photo_url,
    notes,
  };
  if (S.mode === 'demo') {
    S.measurements = S.measurements.filter(m => m.date !== row.date).concat(row).sort((a, b) => a.date.localeCompare(b.date));
    S.showMeasForm = false;
    toast('Measurements saved (demo)'); render(); return;

  S.syncState = 'syncing'; updateChip();

    S.measurements = S.measurements.filter(m => m.date !== row.date).concat(row).sort((a, b) => a.date.localeCompare(b.date));
    S.syncState = 'ok'; toast('Measurements saved');
  }
  S.showMeasForm = false;
  render();
}

/* ------------------------------------------------------------------ *
 * Rest Timer (Web Audio Chime + Vibrate + Background/0 +15s Restart)
 * ------------------------------------------------------------------ */
let audioCtx = null;
function unlockRestAudio() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  } catch {}
}

function triggerRestAlert() {
  try { navigator.vibrate?.([200, 100, 250]); } catch {}
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const now = audioCtx.currentTime;
    [[880, 0, 0.15], [1174.66, 0.17, 0.26]].forEach(([freq, offset, dur]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + offset);
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.22, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + dur + 0.02);
    });
  } catch {}
}

function startRest(sec, label) {
  unlockRestAudio();
  S.rest = { end: Date.now() + sec * 1000, total: sec, label, alerted: false };
  clearInterval(restInt);
  restInt = setInterval(tickRest, 250);
  renderDock();
}

function addRestSeconds(sec) {
  if (!S.rest) return;
  unlockRestAudio();
  const now = Date.now();
  if (S.rest.end <= now) {
    S.rest.end = now + sec * 1000;
    S.rest.total = sec;
  } else {
    S.rest.end += sec * 1000;
    S.rest.total += sec;
  }
  S.rest.alerted = false;
  clearInterval(restInt);
  restInt = setInterval(tickRest, 250);
  if (!document.getElementById('dock-time')) renderDock();
  else tickRest();
}

function tickRest() {
  if (!S.rest) { clearInterval(restInt); restInt = null; return; }
  const now = Date.now();
  const left = Math.max(0, Math.ceil((S.rest.end - now) / 1000));
  const tEl = document.getElementById('dock-time');
  const bEl = document.getElementById('dock-bar');
  if (tEl) {
    tEl.textContent = left ? `${Math.floor(left / 60)}:${z(left % 60)}` : 'Ready';
    tEl.classList.toggle('done', left === 0);
  }
  if (bEl) bEl.style.width = `${Math.max(0, Math.min(100, (left / Math.max(1, S.rest.total)) * 100))}%`;
  if (left === 0) {
    clearInterval(restInt);
    restInt = null;
    if (!S.rest.alerted) {
      S.rest.alerted = true;
      if (now - S.rest.end < 8000) triggerRestAlert();
    }
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.rest) tickRest();
});
window.addEventListener('focus', () => {
  if (S.rest) tickRest();
});

function renderDock() {
  const host = document.getElementById('dock-host');
  if (!host) return;
  if (!S.rest) { host.innerHTML = ''; return; }
  const left = Math.max(0, Math.ceil((S.rest.end - Date.now()) / 1000));
  if (left === 0 && !S.rest.alerted) S.rest.alerted = true;
  host.innerHTML = `<div class="dock"><div class="dock-card">
    <div class="dock-inner">
      <div><span class="dock-label">Rest · ${esc(S.rest.label)}</span><div class="dock-time num ${left === 0 ? 'done' : ''}" id="dock-time">${left ? `${Math.floor(left / 60)}:${z(left % 60)}` : 'Ready'}</div></div>
      <div class="dock-actions">
        <button class="pill-btn" data-act="rest-add">+15s</button>
        <button class="pill-btn" data-act="rest-close">Done</button>
      </div>
    </div>
    <div class="dock-track"><i id="dock-bar" style="width:${Math.max(0, Math.min(100, (left / Math.max(1, S.rest.total)) * 100))}%"></i></div>
  </div></div>`;
}

/* ------------------------------------------------------------------ *
 * Strength Trajectory & Charts
 * ------------------------------------------------------------------ */
function isPrescribedLift(name) {
  const low = String(name || '').toLowerCase();
  return S.exercises.some(e => e.name.toLowerCase() === low);
}

function compoundLifts() {
  const map = new Map();
  S.exercises.forEach(e => {
    if (e.is_bodyweight) return;
    if (/curl|tricep|calf|lateral|face pull|shrug|woodchop|plank|knee raise|abduction|adduction|kickback/i.test(e.name)) return;
    const low = e.name.toLowerCase();
    if (!map.has(low)) map.set(low, e.name);
  });
  const base = [...map.values()];
  return base.length ? base : trackedLifts();
}

function trackedLifts() {
  const byLow = new Map();
  const loggedLow = new Set();
  S.exercises.forEach(e => {
    if (!e.is_bodyweight) {
      const low = e.name.toLowerCase();
      if (!byLow.has(low)) byLow.set(low, e.name);
    }
  });
  Object.values(S.setsMap).forEach(r => {
    if (!r.done || !r.exercise_name || !Number(r.weight)) return;
    const low = r.exercise_name.toLowerCase();
    loggedLow.add(low);
    if (!byLow.has(low)) byLow.set(low, r.exercise_name);
  });
  return [...byLow.entries()]
    .sort((a, b) => (loggedLow.has(b[0]) ? 1 : 0) - (loggedLow.has(a[0]) ? 1 : 0))
    .map(x => x[1]);
}

function liftSeries(name) {
  const low = String(name || '').toLowerCase();
  const byWk = new Map();
  Object.values(S.setsMap).forEach(r => {
    if (!r.done || String(r.exercise_name || '').toLowerCase() !== low || !r.weight) return;
    const w = Number(r.weight), reps = Number(r.reps || 0);
    const val = S.liftMode === 'e1rm' ? e1rm(w, reps) : w;
    if (!val) return;
    if (!byWk.has(r.week) || val > byWk.get(r.week)) byWk.set(r.week, val);
  });
  return [...byWk.entries()].sort((a, b) => a[0] - b[0]).map(([wk, v]) => ({ wk, v }));
}

function liftPrRows() {
  const map = new Map();
  Object.values(S.setsMap).forEach(r => {
    if (!r.done || !r.exercise_name) return;
    const low = r.exercise_name.toLowerCase();
    const w = Number(r.weight || 0), reps = Number(r.reps || 0);
    const est = w > 0 ? e1rm(w, reps) : null;
    const cur = map.get(low) || {
      name: S.exercises.find(e => e.name.toLowerCase() === low)?.name || r.exercise_name,
      isExtra: !isPrescribedLift(r.exercise_name),
      isBw: w <= 0,
      bestE1: 0, bestSet: null, firstE1: null, firstWk: 999, lastWk: 0, sessions: new Set(),
    };
    cur.sessions.add(`${r.week}|${r.day_name}`);
    if (w > 0) cur.isBw = false;
    if (est && r.week <= cur.firstWk) {
      if (r.week < cur.firstWk || est > (cur.firstE1 || 0)) { cur.firstWk = r.week; cur.firstE1 = est; }
    }
    if (est && est > cur.bestE1) { cur.bestE1 = est; cur.bestSet = r; }
    else if (!est && reps > (cur.bestSet?.reps || 0)) { cur.bestSet = r; }
    if (r.week > cur.lastWk) cur.lastWk = r.week;
    map.set(low, cur);
  });
  return [...map.values()].sort((a, b) => (b.isBw === a.isBw ? b.bestE1 - a.bestE1 : (a.isBw ? 1 : -1)));
}

function compositeSeries(lifts) {
  const byWk = new Map();
  lifts.forEach(name => {
    const pts = liftSeries(name);
    if (!pts.length) return;
    const base = pts[0].v;
    pts.forEach(p => {
      const pct = ((p.v - base) / base) * 100;
      if (!byWk.has(p.wk)) byWk.set(p.wk, []);
      byWk.get(p.wk).push(pct);
    });
  });
  return [...byWk.entries()].sort((a, b) => a[0] - b[0]).map(([wk, arr]) => ({ wk, v: arr.reduce((a, b) => a + b, 0) / arr.length }));
}

function linReg(pts) {
  if (pts.length < 2) return null;
  const n = pts.length;
  const sx = pts.reduce((a, p) => a + p.wk, 0), sy = pts.reduce((a, p) => a + p.v, 0);
  const sxx = pts.reduce((a, p) => a + p.wk * p.wk, 0), sxy = pts.reduce((a, p) => a + p.wk * p.v, 0);
  const den = n * sxx - sx * sx;
  if (!den) return null;
  const m = (n * sxy - sx * sy) / den, b = (sy - m * sx) / n;
  return { m, b, at: x => m * x + b };
}

function renderLiftChart(pts, weeks, isAll) {
  if (!pts.length) return '<div class="empty">Log completed sets to see your strength trajectory.</div>';
  const W = 440, H = 166, P = { l: 38, r: 16, t: 14, b: 22 };
  const reg = linReg(pts);
  const last = pts[pts.length - 1];
  const projEnd = reg ? reg.at(weeks) : last.v;
  const vals = pts.map(p => p.v).concat(reg ? [projEnd] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 4) { lo -= 3; hi += 3; } else { const pad = (hi - lo) * 0.16; lo -= pad; hi += pad; }
  const x = w => P.l + ((w - 1) / Math.max(1, weeks - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const ticks = [lo, (lo + hi) / 2, hi].map(v => Math.round(v));
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.wk).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${line} L${x(last.wk).toFixed(1)},${H - P.b} L${x(pts[0].wk).toFixed(1)},${H - P.b} Z`;
  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="lf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".18"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.06)"/><text x="${P.l - 7}" y="${y(t) + 3.5}" text-anchor="end" font-size="10" fill="#5F6B6B" font-family="Geist Mono,monospace">${isAll && t > 0 ? '+' + t + '%' : isAll ? t + '%' : t}</text>`).join('')}
    ${Array.from({ length: weeks }, (_, i) => `<text x="${x(i + 1)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="#5F6B6B" font-family="Geist Mono,monospace">W${i + 1}</text>`).join('')}
    ${pts.length >= 2 ? `<path d="${area}" fill="url(#lf)"/>` : ''}
    ${reg && last.wk < weeks ? `<line x1="${x(last.wk)}" y1="${y(last.v)}" x2="${x(weeks)}" y2="${y(projEnd)}" stroke="#2DD4BF" stroke-opacity=".75" stroke-width="1.75" stroke-dasharray="4 4"/>
      <circle cx="${x(weeks)}" cy="${y(projEnd)}" r="3.8" fill="#0C1011" stroke="#2DD4BF" stroke-width="1.8"/>
      <text x="${x(weeks) - 6}" y="${Math.max(12, y(projEnd) - 8)}" text-anchor="end" font-size="10" fill="#9AA7A6" font-family="Geist Mono,monospace">${isAll ? (projEnd >= 0 ? '+' : '') + fmt(projEnd, 1) + '%' : fmt(projEnd, 0) + ' lb'}</text>` : ''}
    ${pts.length >= 2 ? `<path d="${line}" fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${pts.map((p, k) => `<circle cx="${x(p.wk)}" cy="${y(p.v)}" r="${k === pts.length - 1 ? 4.2 : 2.8}" fill="#2DD4BF" stroke="#0C1011" stroke-width="1.8"/>`).join('')}

function renderWeightChart() {
  const c = S.client;
  const start = parseYmd(c.start_date);
  const totalDays = (c.weeks || 8) * 7;
  const pts = Object.values(S.checkins).filter(r => r.weight != null).map(r => ({
    i: Math.round((parseYmd(r.date) - start) / DAY_MS), v: Number(r.weight)
  })).filter(p => p.i >= 0 && p.i <= totalDays).sort((a, b) => a.i - b.i);
  if (!pts.length) return '<div class="empty">Log daily weigh-ins (or sync Apple Health) to see your weight trend.</div>';
  const W = 440, H = 150, P = { l: 38, r: 14, t: 14, b: 22 };
  const goal = c.targets?.weight;
  const vals = pts.map(p => p.v).concat(goal ? [goal] : []);
  let lo = Math.min(...vals) - 2, hi = Math.max(...vals) + 2;
  const x = i => P.l + (i / Math.max(1, totalDays - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const ticks = [lo, (lo + hi) / 2, hi].map(v => Math.round(v));
  const path = pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.06)"/><text x="${P.l - 7}" y="${y(t) + 3.5}" text-anchor="end" font-size="10" fill="#5F6B6B" font-family="Geist Mono,monospace">${t}</text>`).join('')}
    ${goal ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(goal)}" y2="${y(goal)}" stroke="#9AA7A6" stroke-dasharray="3 4" stroke-width="1"/><text x="${W - P.r}" y="${y(goal) - 5}" text-anchor="end" font-size="10" fill="#9AA7A6">Goal ${goal} lb</text>` : ''}
    ${Array.from({ length: c.weeks || 8 }, (_, w) => `<text x="${x(w * 7 + 3)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="#5F6B6B" font-family="Geist Mono,monospace">W${w + 1}</text>`).join('')}
    <path d="${path}" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last.i)}" cy="${y(last.v)}" r="4" fill="#2DD4BF" stroke="#0C1011" stroke-width="2"/>
  </svg>`;
}

/* ------------------------------------------------------------------ *
 * Event Delegation
 * ------------------------------------------------------------------ */
document.addEventListener('keydown', e => {
  const el = e.target;
  const rk = el?.dataset?.numRule;
  if (!rk || e.ctrlKey || e.metaKey || e.altKey) return;
  const rule = NUM_RULES[rk];
  if (!rule) return;
  if (['-', '+', 'e', 'E'].includes(e.key)) { e.preventDefault(); return; }
  if (e.key === ',' || (e.key === '.' && (rule.dec === 0 || String(el.value).includes('.')))) {
    e.preventDefault();
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  const rk = el?.dataset?.numRule;
  if (!rk) return;
  const rule = NUM_RULES[rk];
  if (!rule) return;
  const { text, capped } = sanitizeNumInput(el.value, rk);
  if (text !== el.value) el.value = text;
  if (capped) {
    const unit = rule.unit === 'in' ? '"' : (rule.unit ? ' ' + rule.unit : '');
    toast(`${rule.label} max is ${fmt(rule.max)}${unit}`);
  }
});

document.addEventListener('cancel', e => {
  if (e.target?.id === 'future-wk-modal') {
    const cancel = S.pendingFutureCancel;
    S.pendingFutureFn = null;
    S.pendingFutureCancel = null;
    if (cancel) cancel();
  }
}, true);

document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act, v = btn.dataset.v;
  if (act === 'auth-tab') { S.authTab = v; S.authMsg = ''; render(); }
  else if (act === 'demo') {
    const d = makeDemoState();
    S.mode = 'demo'; S.client = d.client; S.exercises = d.exercises; S.setsMap = {};
    d.sets.forEach(r => { S.setsMap[setKey(r.week, r.day_name, r.exercise_name, r.set_num)] = r; });
    S.checkins = d.checkins; S.measurements = d.measurements; S.notes = d.notes;
    S.confirmedFutureWeeks = {}; S.pendingFutureFn = null; S.pendingFutureCancel = null;
    S.showExtraForm = false; S.bonusDrafts = {}; S.requestedExtras = {};
    S.week = 3; S.day = 'Full Body A'; S.openEx = d.exercises[0].name;
    render();
  }
  else if (act === 'tab') { S.tab = v; render(true); window.scrollTo(0, 0); }
  else if (act === 'day') { S.day = v; S.openEx = null; S.showExtraForm = false; render(); }
  else if (act === 'wk-prev') { S.week = Math.max(1, S.week - 1); S.showExtraForm = false; render(); }
  else if (act === 'wk-next') { S.week = Math.min(S.client.weeks || 8, S.week + 1); S.showExtraForm = false; render(); }
  else if (act === 'wk-cur') { S.week = currentWeek(S.client); S.showExtraForm = false; render(); }
  else if (act === 'fw-confirm') {
    S.confirmedFutureWeeks[S.week] = true;
    document.getElementById('future-wk-modal')?.close();
    const fn = S.pendingFutureFn;
    S.pendingFutureFn = null; S.pendingFutureCancel = null;
    if (fn) await fn();
  }
  else if (act === 'fw-cancel') {
    document.getElementById('future-wk-modal')?.close();
    const cancel = S.pendingFutureCancel;
    S.pendingFutureFn = null; S.pendingFutureCancel = null;
    if (cancel) cancel();
  }
  else if (act === 'fw-go-cur') {
    document.getElementById('future-wk-modal')?.close();
    const cancel = S.pendingFutureCancel;
    S.pendingFutureFn = null; S.pendingFutureCancel = null;
    if (cancel) cancel();
    S.week = currentWeek(S.client);
    render();
  }
  else if (act === 'toggle-ex') { S.openEx = S.openEx === v ? null : v; render(); }
  else if (act === 'toggle-extra-form') {
    S.showExtraForm = !S.showExtraForm;
    render();
    if (S.showExtraForm) document.getElementById('extra-ex-name')?.focus();
  }
  else if (act === 'quick-extra') {
    const exName = String(btn.dataset.ex || '').trim();
    const sets = Math.max(1, Math.min(12, Number(btn.dataset.sets) || 3));
    const isBw = btn.dataset.bw === '1';
    if (!exName) return;
    requireFutureWeekConfirm(() => {
      S.bonusDrafts[bonusKey(S.week, S.day, exName)] = { name: exName, sets, is_bodyweight: isBw, rest_sec: 75 };
      saveBonusDrafts();
      S.openEx = exName;
      S.showExtraForm = false;
      toast(`Added ${exName}`);
      render();
    });
  }
  else if (act === 'extra-add-set') {
    const exName = String(btn.dataset.ex || '').trim();
    const curEx = findDayExercise(S.day, exName, S.week);
    if (!curEx || curEx.sets >= 12) return;
    const k = bonusKey(S.week, S.day, exName);
    S.bonusDrafts[k] = { name: exName, sets: curEx.sets + 1, is_bodyweight: !!curEx.is_bodyweight, rest_sec: curEx.rest_sec || 75 };
    saveBonusDrafts();
    render();
  }
  else if (act === 'req-extra') {
    const exName = String(btn.dataset.ex || '').trim();
    const curEx = findDayExercise(S.day, exName, S.week);
    if (!exName) return;
    const rk = `${S.day}|${exName.toLowerCase()}`;
    S.requestedExtras[rk] = true;
    await sendChat(`Exercise request: Can we add "${exName}" (${curEx?.sets || 3} sets, ${curEx?.is_bodyweight ? 'Bodyweight' : 'Weighted'}) to my ${S.day} split?`);
    toast('Sent exercise request to Coach Kyle');
  }
  else if (act === 'del-extra') {
    const exName = String(btn.dataset.ex || '').trim();
    if (!exName) return;
    const existingRows = Object.values(S.setsMap).filter(r => r.week === S.week && r.day_name === S.day && r.exercise_name === exName && (r.done || r.weight != null || r.reps != null));
    if (existingRows.length && !confirm(`Remove "${exName}" and clear its ${existingRows.length} logged set${existingRows.length === 1 ? '' : 's'} for Week ${S.week}?`)) return;
    delete S.bonusDrafts[bonusKey(S.week, S.day, exName)];
    saveBonusDrafts();
    Object.keys(S.setsMap).forEach(k => {
      const r = S.setsMap[k];
      if (r && r.week === S.week && r.day_name === S.day && r.exercise_name === exName) delete S.setsMap[k];
    });
    if (S.openEx === exName) S.openEx = null;
    if (S.mode !== 'demo' && sb && S.client?.id && existingRows.length) {
      const { error } = await sb.from('workout_sets').delete().eq('client_id', S.client.id).eq('week', S.week).eq('day_name', S.day).eq('exercise_name', exName);
      if (error) {
        await Promise.all(existingRows.map(r => sb.from('workout_sets').upsert({
          client_id: S.client.id, week: S.week, day_name: S.day, exercise_name: exName, set_num: r.set_num,
          weight: null, reps: null, rpe: null, done: false, note: '', logged_at: new Date().toISOString()
        }, { onConflict: 'client_id,week,day_name,exercise_name,set_num' })));
      }
    }
    toast('Extra exercise removed');
    render();
  }
  else if (act === 'pick-lift') {
    S.liftSel = v;
    render();
    document.getElementById('traj-top')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  else if (act === 'check-set') {
    if (Date.now() - (S.lastInvalidAt || 0) < 350) return;
    const exName = btn.dataset.ex, n = Number(btn.dataset.n), rest = Number(btn.dataset.rest || 90);
    const ex = findDayExercise(S.day, exName, S.week);
    const prev = { ...getSet(S.week, S.day, exName, n) };
    const rowEl = btn.closest('.set');
    const domPatch = {};
    if (rowEl) {
      for (const inp of rowEl.querySelectorAll('[data-set-in]')) {
        if (inp.disabled) continue;
        const sk = inp.dataset.setIn;
        const res = parseValidNum(inp.value, 'set_' + sk);
        if (!res.ok) {
          flashInvalid(inp);
          inp.focus();
          toast(res.error);
          return;
        }
        domPatch[sk] = res.value;
      }
    }
    const noteTag = ex?.is_extra ? (ex.is_bodyweight ? 'bw' : (prev.note || 'extra')) : (prev.note || '');
    const cur = { ...prev, ...domPatch, note: noteTag, done: !prev.done };
    if (cur.done && cur.reps == null && ex?.target_reps) cur.reps = ex.target_reps;
    if (cur.done && cur.reps == null) {
      const repInp = rowEl?.querySelector('[data-set-in="reps"]');
      if (repInp) { flashInvalid(repInp); repInp.focus(); }
      toast('Enter reps (1–100) before completing set');
      return;
    }
    requireFutureWeekConfirm(async () => {
      const ok = await persistSet(cur);
      if (!ok) return;
      if (cur.done) {
        if (ex && isPR(ex, cur)) toast('New PR logged!');
        startRest(rest, exName);
      }
      render();
    }, () => {
      if (rowEl) {
        for (const inp of rowEl.querySelectorAll('[data-set-in]')) {
          const sk = inp.dataset.setIn;
          inp.value = prev[sk] ?? '';
        }
      }
    });
  }
  else if (act === 'rest-add') { addRestSeconds(15); }
  else if (act === 'rest-close') { S.rest = null; clearInterval(restInt); restInt = null; renderDock(); }
  else if (act === 'date-prev') { S.checkDate = ymd(new Date(parseYmd(S.checkDate).getTime() - DAY_MS)); render(); }
  else if (act === 'date-next') { S.checkDate = ymd(new Date(parseYmd(S.checkDate).getTime() + DAY_MS)); render(); }
  else if (act === 'step') {
    const k = btn.dataset.k, delta = Number(btn.dataset.d);
    const rule = NUM_RULES['chk_' + k];
    const rawCur = S.checkins[S.checkDate]?.[k];
    let base;
    if (rawCur != null && rawCur !== '') {
      base = Number(rawCur);
    } else if (k === 'weight') {
      const priorWt = Object.values(S.checkins)
        .filter(r => r.weight != null && r.weight >= 50 && r.weight <= 600)
        .sort((a, b) => a.date.localeCompare(b.date))
        .pop()?.weight;
      base = priorWt ?? S.client?.targets?.weight ?? 180;
    } else {
      base = 0;
    }
    const dec = rule?.dec ?? 1;
    let next = +(base + delta).toFixed(dec);
    let clamped = false;
    if (rule) {
      if (next < rule.min) {
        next = rule.min;
        clamped = true;
        const u = rule.unit ? ' ' + rule.unit : '';
        toast(`${rule.label} min is ${rule.min}${u}`);
      } else if (next > rule.max) {
        next = rule.max;
        clamped = true;
        const u = rule.unit ? ' ' + rule.unit : '';
        toast(`${rule.label} max is ${fmt(rule.max)}${u}`);
      }
    }
    persistCheckin(S.checkDate, { [k]: next });
    if (btn.dataset.u && !clamped) toast(`+${delta} ${btn.dataset.u} → ${next} ${btn.dataset.u}`);
    render();
  }
  else if (act === 'scale') { persistCheckin(S.checkDate, { [btn.dataset.k]: Number(v) }); render(); }
  else if (act === 'toggle-meas') { S.showMeasForm = !S.showMeasForm; render(); }
  else if (act === 'lsel') { S.liftSel = v; render(); }
  else if (act === 'lmode') { S.liftMode = v; render(); }
  else if (act === 'pose') { S.photoPose = v; render(); }
  else if (act === 'open-sheet') { document.getElementById('settings-sheet')?.showModal(); }
  else if (act === 'close-sheet') { document.getElementById('settings-sheet')?.close(); }
  else if (act === 'copy-val') {
    const ok = await copyTextWithFallback(v);
    toast(ok ? 'Copied to clipboard' : 'Copy failed');
  }
  else if (act === 'delete-acct') {
    if (!confirm('Permanently delete your CLF Protocol account and all logged workout/check-in data? This cannot be undone.')) return;
    document.getElementById('settings-sheet')?.close();
    const { error } = await sb.rpc('delete_my_account');
    if (error) { toast('Delete failed: ' + error.message); return; }
    await sb.auth.signOut();
    S.mode = 'auth'; S.user = null; S.client = null; S.confirmedFutureWeeks = {};
    S.authMsg = 'Your account and data have been permanently deleted.'; S.authTone = 'ok';
    document.getElementById('root').dataset.cid = '';
    render();
  }
  else if (act === 'signout') {
    document.getElementById('settings-sheet')?.close();
    if (S.mode !== 'demo' && sb) await sb.auth.signOut();
    S.mode = 'auth'; S.user = null; S.isCoach = false; S.client = null; S.confirmedFutureWeeks = {}; S.authMsg = '';
    document.getElementById('root').dataset.cid = '';
    render();
  }
});

document.addEventListener('change', async e => {
  if (e.target.id === 'coach-switch') {
    const cl = S.allClients.find(x => x.id === e.target.value);
    if (cl) await loadClientBundle(cl);
  }
  if (e.target.id === 'lift-jump') {
    S.liftSel = e.target.value;
    render();
  }
  if (e.target.id === 'photo-pose') { S.photoPose = e.target.value; }
  if (e.target.id === 'photo-file' && e.target.files?.[0]) {
    await uploadProgressPhoto(e.target.files[0], S.photoPose);
    e.target.value = '';
  }
  if (e.target.dataset.setIn) {
    const el = e.target;
    const k = el.dataset.setIn, ex = el.dataset.ex, n = Number(el.dataset.n);
    const exObj = findDayExercise(S.day, ex, S.week);
    const prev = getSet(S.week, S.day, ex, n);
    const res = parseValidNum(el.value, 'set_' + k);
    if (!res.ok) {
      S.lastInvalidAt = Date.now();
      flashInvalid(el, prev[k] ?? '');
      toast(res.error);
      return;
    }
    el.value = res.value ?? '';
    requireFutureWeekConfirm(async () => {
      const noteTag = exObj?.is_extra ? (exObj.is_bodyweight ? 'bw' : (prev.note || 'extra')) : (prev.note || '');
      const cur = { ...getSet(S.week, S.day, ex, n), [k]: res.value, note: noteTag };
      await persistSet(cur);
    }, () => {
      el.value = prev[k] ?? '';
    });
  }
  if (e.target.dataset.chkIn) {
    const el = e.target;
    const k = el.dataset.chkIn;
    if (k === 'notes') {
      persistCheckin(S.checkDate, { notes: el.value });
    } else {
      const prevVal = S.checkins[S.checkDate]?.[k] ?? '';
      const res = parseValidNum(el.value, 'chk_' + k);
      if (!res.ok) {
        flashInvalid(el, prevVal);
        toast(res.error);
        return;
      }
      el.value = res.value ?? '';
      persistCheckin(S.checkDate, { [k]: res.value });
    }
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id === 'auth-form') {
    e.preventDefault();
    const email = e.target.elements.email.value.trim();
    const password = e.target.elements.password?.value;
    S.authMsg = 'Signing in…'; S.authTone = ''; render();
    if (S.authTab === 'password') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { S.authMsg = error.message; S.authTone = 'bad'; render(); }
      else await onSignedIn(data.user);
    } else {
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href } });
      S.authMsg = error ? error.message : 'Magic link sent! Check your email and tap the link to sign in.';
      S.authTone = error ? 'bad' : 'ok';
      render();
    }
  }
  if (e.target.id === 'extra-ex-form') {
    e.preventDefault();
    const rawName = e.target.elements.name.value.trim().replace(/\s+/g, ' ').slice(0, 80);
    if (!rawName) { toast('Enter an exercise name'); return; }
    const sets = Math.max(1, Math.min(12, Number(e.target.elements.sets?.value) || 3));
    const isBw = e.target.elements.is_bodyweight?.value === 'true';
    const askCoach = !!e.target.elements.ask_coach?.checked;
    const allToday = [...dayExercises(S.day), ...extraDayExercises(S.week, S.day)];
    const existing = allToday.find(x => x.name.toLowerCase() === rawName.toLowerCase());
    if (existing) {
      if (existing.is_extra && sets > existing.sets) {
        S.bonusDrafts[bonusKey(S.week, S.day, existing.name)] = { name: existing.name, sets, is_bodyweight: existing.is_bodyweight, rest_sec: existing.rest_sec || 75 };
        saveBonusDrafts();
      }
      S.openEx = existing.name;
      S.showExtraForm = false;
      if (askCoach && existing.is_extra) {
        S.requestedExtras[`${S.day}|${existing.name.toLowerCase()}`] = true;
        await sendChat(`Exercise request: Can we add "${existing.name}" (${sets} sets, ${isBw ? 'Bodyweight' : 'Weighted'}) to my ${S.day} split?`);
      }
      toast(`Opened ${existing.name}`);
      render();
      return;
    }
    const canon = exerciseSuggestions().find(s => s.toLowerCase() === rawName.toLowerCase()) || rawName;
    requireFutureWeekConfirm(async () => {
      S.bonusDrafts[bonusKey(S.week, S.day, canon)] = { name: canon, sets, is_bodyweight: isBw, rest_sec: 75 };
      saveBonusDrafts();
      S.openEx = canon;
      S.showExtraForm = false;
      if (askCoach) {
        S.requestedExtras[`${S.day}|${canon.toLowerCase()}`] = true;
        await sendChat(`Exercise request: Can we add "${canon}" (${sets} sets, ${isBw ? 'Bodyweight' : 'Weighted'}) to my ${S.day} split?`);
        toast(`Added ${canon} + sent request to Coach Kyle`);
      } else {
        toast(`Added ${canon} to ${S.day}`);
      }
      render();
    });
  }
  if (e.target.id === 'meas-form') {
    e.preventDefault();
    await saveMeasurement(e.target);
  }
  if (e.target.id === 'chat-form') {
    e.preventDefault();
    const inp = e.target.elements.body;
    await sendChat(inp.value);
    inp.value = '';
  }
  if (e.target.dataset.cadd) {
    e.preventDefault();
    const k = e.target.dataset.cadd, u = e.target.dataset.u || '';
    const inp = e.target.querySelector('input');
    const raw = inp?.value?.trim() || '';
    if (!raw) return;
    const res = parseValidNum(raw, 'cadd_' + k);
    if (!res.ok || res.value == null) {
      flashInvalid(inp);
      toast(res.error || 'Enter a valid amount');
      return;
    }
    const add = res.value;
    const rule = NUM_RULES['chk_' + k];
    const cur = Number(S.checkins[S.checkDate]?.[k] ?? 0);
    let next = +(cur + add).toFixed(rule?.dec ?? 0);
    if (rule && next > rule.max) {
      next = rule.max;
      toast(`${rule.label} capped at ${fmt(rule.max)} ${u}`);
    } else {
      toast(`+${add} ${u} → ${next} ${u}`);
    }
    if (inp) inp.value = '';
    persistCheckin(S.checkDate, { [k]: next });
    render();
  }
});

initAuth();
})();
</script>
</body>
</html>
