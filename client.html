<title>CLF — Training Log</title>
<meta name="description" content="Log training sessions, daily check-ins, and track strength trajectory for your CLF Protocol coaching program.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#030404}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.app{
  --bg:#050707; --surface:#0C1011; --surface-2:#111617; --surface-3:#192021;
  --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.10);
  --text:#ECF3F2; --text-2:#9AA7A6; --text-3:#5F6B6B;
  --accent:#2DD4BF; --accent-press:#14B8A6; --on-accent:#022320; --accent-tint:rgba(45,212,191,.10); --accent-line:rgba(45,212,191,.32);
  --ok:#4ADE80; --warn:#F2B84B; --bad:#F2706A;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  position:relative;max-width:520px;min-height:100dvh;margin:0 auto;
  background:radial-gradient(120% 420px at 50% -160px,rgba(45,212,191,.075),transparent 70%) no-repeat,var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
@media (min-width:560px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* Header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 20px 12px;background:rgba(5,7,7,.72);
  -webkit-backdrop-filter:saturate(150%) blur(16px);backdrop-filter:saturate(150%) blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(160deg,#5EEAD4,#14B8A6);color:var(--on-accent);display:grid;place-items:center;
  font:700 10.5px/1 var(--mono);letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.2)}
.brand-name{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:var(--text-3);margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--text-2);font-size:12px;font-weight:500;white-space:nowrap;transition:background .2s var(--ease)}
.chip:hover{background:var(--surface-2)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.chip[data-state=ok] .dot{background:var(--ok)}
.chip[data-state=pending] .dot{background:var(--warn)}
.chip[data-state=error] .dot{background:var(--bad)}
.chip[data-state=syncing] .dot{background:var(--text-2);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* Layout */
main{padding:28px 20px 24px}
.view{animation:enter .35s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
.eyebrow{font-size:12.5px;color:var(--text-3);font-weight:500}
h1{font-size:36px;line-height:1;letter-spacing:-.04em;font-weight:600;margin:8px 0 0}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lede{color:var(--text-2);font-size:14px;margin:10px 0 0}
.section-label{font-size:12px;font-weight:500;color:var(--text-3);margin:28px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Stepper (week) */
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.stepper-btn{width:30px;height:30px;border:0;background:transparent;border-radius:7px;display:grid;place-items:center;color:var(--text-2)}
.stepper-btn:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.stepper-btn:disabled{opacity:.3;cursor:default}
.stepper-btn svg.i{width:16px;height:16px}
.stepper-label{font-size:12.5px;color:var(--text);min-width:40px;text-align:center}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:22px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg-btn{height:38px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;transition:background .2s var(--ease),color .2s var(--ease)}
.seg[data-many=true] .seg-btn{font-size:12.5px;gap:4px;padding:0 2px}
.seg-btn[aria-selected=true]{background:var(--surface-3);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.4)}
.seg-tick{display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--ok);color:#06140C;flex:none}
.seg[data-many=true] .seg-tick{width:13px;height:13px}
.seg-tick svg.i{width:10px;height:10px;stroke-width:3}

/* Mini mode toggle */
.mode-switch{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.mode-switch button{height:24px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--text-3);font-size:11.5px;font-weight:500}
.mode-switch button[aria-pressed=true]{background:var(--surface-3);color:var(--text)}

/* Progress */
.progress{margin-top:20px}
.progress-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:8px}
.track{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.track i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .45s var(--ease)}
.track i[data-tone=ok]{background:var(--ok)}
.track i[data-tone=bad]{background:var(--bad)}
.track i[data-tone=muted]{background:var(--text-3)}

/* Exercise cards */
.ex-list{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 1px 2px rgba(0,0,0,.35);overflow:hidden;transition:border-color .2s var(--ease)}
.ex.is-open{border-color:var(--line-2)}
.ex-head{width:100%;display:grid;grid-template-columns:30px 1fr auto 18px;align-items:center;gap:12px;padding:15px 16px;background:transparent;border:0;text-align:left}
.ex-idx{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font:500 11.5px/1 var(--mono);color:var(--text-3)}
.ex.is-done .ex-idx{background:var(--ok);border-color:transparent;color:#06140C}
.ex.is-done .ex-idx svg.i{width:14px;height:14px;stroke-width:2.6}
.ex-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-name{font-size:15px;font-weight:550;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-sub{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-target{font-size:13px;color:var(--text-2)}
.ex-chev{color:var(--text-3);transition:transform .25s var(--ease)}
.ex-chev svg.i{width:16px;height:16px}
.ex.is-open .ex-chev{transform:rotate(180deg)}
.ex-body{padding:0 16px 16px;animation:enter .25s var(--ease) both}
.cue{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.cue strong{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:3px}
.cue p{margin:0;font-size:13px;line-height:1.5;color:var(--text-2)}
.sets{margin-top:14px}
.set-head,.set{display:grid;grid-template-columns:26px 1fr 1fr 1fr 44px;gap:8px;align-items:center}
.set-head{font-size:11.5px;color:var(--text-3);padding:0 0 6px;font-weight:500}
.set-head span:not(:first-child){text-align:center}
.set{padding:4px 0}
.set-n{font-size:12.5px;color:var(--text-3);text-align:center}
.num-input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;color:var(--text);outline:none;transition:border-color .15s,background .15s;-moz-appearance:textfield}
.num-input::placeholder{color:var(--text-3)}
.num-input:focus{border-color:var(--accent-line);background:var(--surface-3)}
.set.is-done .num-input{background:transparent;border-color:transparent;color:var(--text)}
.set-check{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--text-3);display:grid;place-items:center;transition:background .15s,color .15s,transform .1s}
.set-check:active{transform:scale(.94)}
.set.is-done .set-check{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.set-check svg.i{width:18px;height:18px;stroke-width:2.4}
.ex-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;color:var(--text-3)}
.text-input{width:100%;margin-top:12px;height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;padding:0 12px;font-size:14px;outline:none}
.text-input:focus{border-color:var(--line-2);background:var(--surface-2)}
.text-input::placeholder{color:var(--text-3)}

/* Buttons */
.btn{height:50px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-size:15px;font-weight:600;letter-spacing:-.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn-primary{background:linear-gradient(180deg,#3FE0CB,#20BFAA);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.5)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-secondary{background:var(--surface-2);border-color:var(--line-2);color:var(--text)}
.btn-secondary:hover{background:var(--surface-3)}
.btn-block{width:100%}
.finish{margin-top:22px}
.finish-note{text-align:center;font-size:12.5px;color:var(--text-3);margin:10px 0 0}
.link-btn{border:0;background:none;padding:6px 0;font-size:13.5px;color:var(--text-2);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.link-btn.danger{color:var(--bad)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 1px 2px rgba(0,0,0,.35)}
.card + .card{margin-top:10px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.card-meta{font-size:12px;color:var(--text-3)}

/* Check-in */
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.verdict{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--text-2)}
.verdict b{color:var(--text);font-weight:600}
.pips{display:flex;gap:4px;margin-left:auto}
.pips i{width:18px;height:4px;border-radius:2px;background:var(--surface-3)}
.pips i.on{background:var(--ok)}
.metric + .metric{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.metric-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.metric-top label{font-size:14px;font-weight:500}
.metric-hint{font-size:12.5px;color:var(--text-3)}
.metric-hint[data-tone=ok]{color:var(--ok)}
.metric-hint[data-tone=bad]{color:var(--bad)}
.metric-ctl{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}
.step{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);display:grid;place-items:center}
.step:hover{background:var(--surface-3);color:var(--text)}
.step:active{transform:scale(.96)}
.step svg.i{width:16px;height:16px}
.metric-field{position:relative}
.metric-field .num-input{padding-right:40px;padding-left:40px}
.unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-3);pointer-events:none}
.metric .track{margin-top:10px;height:3px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font:500 13px/1 var(--mono);color:var(--text-2);padding:0;transition:background .15s,color .15s}
.scale button:hover{color:var(--text)}
.scale button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.scale button.on.t-bad{background:var(--bad);color:#1A0805}
.scale button.on.t-warn{background:var(--warn);color:#1A1205}
.scale-legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);margin-top:7px}
textarea.text-input{height:auto;min-height:84px;padding:11px 12px;resize:vertical;line-height:1.45;margin-top:0}

/* Progress view & Strength Trajectory */
.stat-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.stat-big{font-size:38px;font-weight:500;letter-spacing:-.04em;line-height:1}
.stat-big small{font-size:14px;color:var(--text-3);margin-left:4px;letter-spacing:0}
.stat-side{text-align:right;font-size:12.5px;color:var(--text-3);line-height:1.6}
.delta-up{color:var(--ok)} .delta-down{color:var(--bad)}
.chart{margin-top:14px;height:150px}
.chart.tall{height:168px}
.chart svg{display:block;width:100%;height:100%}
.lift-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;-ms-overflow-style:none}
.lift-pills::-webkit-scrollbar{display:none}
.lift-pill{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:500;white-space:nowrap;flex:none;transition:background .15s,color .15s,border-color .15s}
.lift-pill:hover{color:var(--text)}
.lift-pill[aria-selected=true]{background:var(--accent-tint);border-color:var(--accent-line);color:var(--accent)}
.traj-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.traj-kpi{display:flex;flex-direction:column;gap:2px}
.traj-kpi span{font-size:11px;color:var(--text-3)}
.traj-kpi b{font-size:13.5px;font-weight:500}
.lift{width:100%;display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:12px 6px;margin:0 -6px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;border-radius:8px;transition:background .15s}
.lift:first-of-type{border-top:0}
.lift:hover{background:rgba(255,255,255,.02)}
.lift.is-sel .lift-name{color:var(--accent)}
.lift-name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lift-e1rm{font-size:14.5px;text-align:right}
.lift-sub{font-size:12px;color:var(--text-3)}
.lift-bars{display:flex;gap:3px;align-items:flex-end;height:20px;justify-content:flex-end}
.lift-bars i{width:6px;border-radius:2px;background:var(--surface-3)}
.lift-bars i.on{background:var(--text-2)}
.lift-bars i.cur{background:var(--accent)}
.grid-cal{display:grid;grid-template-columns:28px repeat(7,1fr);gap:5px;align-items:center}
.grid-cal span{font-size:11px;color:var(--text-3)}
.grid-cal i{aspect-ratio:1;border-radius:4px;background:var(--surface-3)}
.grid-cal i.ok{background:var(--ok)}
.grid-cal i.partial{background:rgba(242,184,75,.55)}
.grid-cal i.future{background:transparent;border:1px dashed var(--line-2)}
.grid-cal i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--text-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--text-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.legend i.line{width:14px;height:2px;border-radius:1px}
.empty{padding:24px 0 8px;text-align:center;color:var(--text-3);font-size:13px}

/* Rest timer dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));width:min(520px,100%);padding:0 12px;z-index:35;animation:rise .3s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}}
.dock-card{background:var(--surface-3);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.5);overflow:hidden}
.dock-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px}
.dock-label{font-size:12px;color:var(--text-3);display:block}
.dock-time{font-size:26px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.dock-time.done{color:var(--ok)}
.dock-actions{display:flex;gap:6px}
.pill-btn{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);font:500 12.5px/1 var(--mono);color:var(--text)}
.pill-btn:hover{background:var(--bg)}
.dock-track{height:3px;background:rgba(255,255,255,.06)}
.dock-track i{display:block;height:100%;background:var(--accent);transition:width .25s linear}

/* Tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);z-index:40;display:grid;grid-template-columns:repeat(3,1fr);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(5,7,7,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
@media (min-width:560px){.tabbar{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--text-3);font-size:11.5px;font-weight:500;border-radius:10px;transition:color .2s}
.tab svg.i{width:21px;height:21px}
.tab[aria-current=page]{color:var(--accent)}
.tab[aria-current=page] svg.i{stroke:var(--accent)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,8px);opacity:0;pointer-events:none;z-index:60;
  background:var(--text);color:var(--bg);font-size:13px;font-weight:500;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .2s,transform .2s var(--ease);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Settings sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;background:transparent;color:var(--text)}
dialog.sheet[open]{animation:sheet .3s var(--ease) both}
@keyframes sheet{from{transform:translateY(24px);opacity:0}}
dialog.sheet::backdrop{background:rgba(0,0,0,.62)}
.sheet-inner{background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom))}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--text-2)}
.icon-btn svg.i{width:16px;height:16px}
.sheet-copy{font-size:13.5px;color:var(--text-2);margin:8px 0 18px;line-height:1.5}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:12.5px;color:var(--text-3);margin-bottom:6px;font-weight:500}
.field input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);padding:0 12px;font-size:15px;outline:none}
.field input:focus{border-color:var(--accent-line)}
.sync-status{margin-top:14px;font-size:12.5px;color:var(--text-3);min-height:18px}
.sync-status[data-tone=ok]{color:var(--ok)} .sync-status[data-tone=bad]{color:var(--bad)}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sheet-actions .btn{height:46px;font-size:14px}
.sheet-divider{height:1px;background:var(--line);margin:18px 0 8px}
.sheet-row{display:flex;justify-content:space-between}
.demo-note{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--text-2);line-height:1.5}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">CLF</span>
      <div style="min-width:0">
        <div class="brand-name" id="client-name">CLF Protocol</div>
        <div class="brand-sub" id="client-sub">Loading…</div>
      </div>
    </div>
    <button class="chip" id="sync-chip" data-action="settings" aria-label="Sync settings"><span class="dot"></span><span id="sync-label">Demo data</span></button>
  </header>

  <main id="view" aria-live="polite"></main>

  <div class="dock" id="timer" hidden>
    <div class="dock-card">
      <div class="dock-inner">
        <div><span class="dock-label" id="timer-label">Rest</span><span class="dock-time mono" id="timer-time">2:00</span></div>
        <div class="dock-actions">
          <button class="pill-btn" data-action="timer-add" data-sec="-15">−15</button>
          <button class="pill-btn" data-action="timer-add" data-sec="15">+15</button>
          <button class="pill-btn" data-action="timer-skip">Skip</button>
        </div>
      </div>
      <div class="dock-track"><i id="timer-bar"></i></div>
    </div>
  </div>

  <nav class="tabbar" aria-label="Primary">
    <button class="tab" data-action="tab" data-tab="train" id="tab-train"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Train</button>
    <button class="tab" data-action="tab" data-tab="checkin" id="tab-checkin"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2.5"/><path d="M8 2.5v3M16 2.5v3M4 9.5h16M9 15l2 2 4-4"/></svg>Check-in</button>
    <button class="tab" data-action="tab" data-tab="progress" id="tab-progress"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 20.5h17"/><path d="M4 16l5-5 4 3 7-7"/><path d="M15 7h5v5"/></svg>Progress</button>
  </nav>

  <div class="toast" id="toast" role="status"></div>

  <dialog class="sheet" id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="sheet-inner" id="settings-form" autocomplete="off">
      <div class="grabber"></div>
      <div class="sheet-head">
        <h2 id="settings-title">Sync</h2>
        <button class="icon-btn" value="cancel" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <p class="sheet-copy">Sessions and check-ins save on this phone first, then sync to your coach's Google Sheet. If your coach sent you a link, these fields are already filled in.</p>
      <label class="field"><span>Name</span><input name="name" id="set-name"></label>
      <label class="field"><span>Sync URL</span><input name="url" id="set-url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="field"><span>Access code</span><input name="token" id="set-token" placeholder="Optional"></label>
      <div class="sync-status" id="sync-status"></div>
      <div class="sheet-actions">
        <button type="button" class="btn btn-secondary" data-action="test">Test connection</button>
        <button type="button" class="btn btn-primary" data-action="save-settings">Save</button>
      </div>

/* ---------- training & trajectory model ---------- */
function ensureSession(wk, day) {
  const k = `${wk}:${day}`;
  const sess = S.sessions[k] || (S.sessions[k] = { ex: {}, finishedAt: null, dirty: false });
  PROGRAM.filter(p => p.day === day).forEach(p => {
    if (!sess.ex[p.name]) sess.ex[p.name] = { note: '', sets: Array.from({ length: p.sets }, () => ({ w: '', r: '', rpe: '', done: false })) };
  });
  return sess;
}
function topSet(sets) {
  const done = sets.filter(s => s.done && num(s.w) != null);
  if (!done.length) return null;
  return done.reduce((a, s) => (num(s.w) > num(a.w) || (num(s.w) === num(a.w) && num(s.r) > num(a.r))) ? s : a);
}
function lastPerf(name, wk, day) {
  for (let w = wk - 1; w >= 1; w--) {
    const order = day ? [day, ...days().filter(d => d !== day)] : days();
    for (const d of order) {
      const s = S.sessions[`${w}:${d}`];
      const e = s && s.ex[name];
      const t = e && topSet(e.sets);
      if (t) return { w: num(t.w), r: num(t.r), week: w };
    }
  }
  return null;
}
function sessionState(wk, day) {
  const s = S.sessions[`${wk}:${day}`];
  if (!s) return 'none';
  if (s.finishedAt) return 'done';
  return Object.values(s.ex).some(e => e.sets.some(x => x.done)) ? 'partial' : 'none';
}
const defaultDay = wk => days().find(d => sessionState(wk, d) !== 'done') || days()[0];

function compoundTier(n) {
  if (/shrug|curl|tricep|lateral|face pull|calf|lunge|woodchop|leg curl|^db goblet/i.test(n)) return 0;
  if (/barbell|trap bar|hip thrust|stiff-leg|romanian|front squat|hack squat|banded goblet/i.test(n)) return 3;
  if (/press|squat|deadlift|thrust|seal row|chest-supported.*row|seated.*row|lat pulldown|pendlay/i.test(n)) return 2;
  return 0;
}
function keyLiftNames() {
  const primary = days().flatMap(d => PROGRAM.filter(p => p.day === d && !p.bw).slice(0, 1).map(p => p.name));
  const rest = PROGRAM.filter(p => !p.bw && !primary.includes(p.name) && compoundTier(p.name) > 0)
    .sort((a, b) => compoundTier(b.name) - compoundTier(a.name))
    .map(p => p.name);
  return [...new Set([...primary, ...rest])].slice(0, 6);
}

function ols(pts) {
  const n = pts.length;
  if (n < 2) return null;
  const mx = pts.reduce((a, p) => a + p.wk, 0) / n;
  const my = pts.reduce((a, p) => a + p.v, 0) / n;
  let numSum = 0, denSum = 0;
  pts.forEach(p => { numSum += (p.wk - mx) * (p.v - my); denSum += (p.wk - mx) * (p.wk - mx); });
  if (!denSum) return null;
  const slope = numSum / denSum;
  const intercept = my - slope * mx;
  return { slope, intercept, at: w => intercept + slope * w };
}

function buildLiftStats() {
  const names = keyLiftNames();
  const dList = days();
  const lifts = names.map(name => {
    const p = PROGRAM.find(x => x.name === name) || { day: dList[0], reps: 5 };
    const pts = [];
    const weeks = Array.from({ length: PROFILE.weeks }, (_, i) => {
      const wk = i + 1;
      let bestWk = null;
      dList.forEach(d => {
        const s = S.sessions[`${wk}:${d}`];
        const t = s && s.ex[name] && topSet(s.ex[name].sets);
        const w = t ? num(t.w) : null;
        if (w > 0) {
          const pd = PROGRAM.find(x => x.name === name && x.day === d) || p;
          const r = num(t.r) || pd.reps || 5;
          const est = e1rm(w, r);
          if (!bestWk || est > bestWk.e1rm || (est === bestWk.e1rm && w > bestWk.w)) bestWk = { w, r, e1rm: est };
        }
      });
      if (bestWk) pts.push({ wk, w: bestWk.w, r: bestWk.r, e1rm: bestWk.e1rm });
      return bestWk;
    });
    const regE = ols(pts.map(x => ({ wk: x.wk, v: x.e1rm })));
    const regW = ols(pts.map(x => ({ wk: x.wk, v: x.w })));
    const best = pts.length ? Math.max(...pts.map(x => x.e1rm)) : null;
    return {
      name, short: shortLift(name), pts, weeks, best,
      first: pts.length ? pts[0] : null,
      last: pts.length ? pts[pts.length - 1] : null,
      regE, regW,
    };
  });

  // Composite Compound Strength Index (% e1RM change vs each lift's starting baseline)
  const idxPts = [];
  for (let wk = 1; wk <= PROFILE.weeks; wk++) {
    const rels = lifts.map(l => {
      if (!l.first || !l.first.e1rm) return null;
      const cur = l.pts.find(x => x.wk === wk);
      return cur ? ((cur.e1rm - l.first.e1rm) / l.first.e1rm) * 100 : null;
    }).filter(v => v != null);
    if (rels.length) idxPts.push({ wk, v: rels.reduce((a, b) => a + b, 0) / rels.length, n: rels.length });
  }
  const idxReg = ols(idxPts);
  return { lifts, idx: { pts: idxPts, reg: idxReg, last: idxPts[idxPts.length - 1] || null } };
}

function hintFor(f, v) {
  if (f.kind === 'weight') {
    if (v == null) return { text: `Goal ${fmt(T.weight)} lb`, tone: '' };
    const d = T.weight - v;
    return { text: Math.abs(d) < 0.05 ? 'At goal' : `${fmt(Math.abs(d), 1)} lb ${d > 0 ? 'to go' : 'over goal'}`, tone: '' };
  }
  if (!f.kind) return { text: '', tone: '' };
  const g = f.goal();
  if (f.kind === 'max') {
    if (v == null) return { text: `Ceiling ${fmt(g)}`, tone: '' };
    return v <= g ? { text: `${fmt(g - v)} left`, tone: 'ok' } : { text: `${fmt(v - g)} over`, tone: 'bad' };
  }
  const unit = f.unit && f.unit !== 'h' ? ' ' + f.unit : f.unit;
  if (v == null) return { text: `Target ${fmt(g, f.dec > 0 && g % 1 ? 1 : 0)}${unit}`, tone: '' };
  return v >= g ? { text: 'Target hit', tone: 'ok' } : { text: `${fmt(g - v, g % 1 ? 1 : 0)}${unit} to go`, tone: '' };
}
function barFor(f, v) {
  if (!f.kind || f.kind === 'weight' || v == null) return { pct: 0, tone: 'muted' };
  const g = f.goal();
  const pct = clamp(v / g * 100, 0, 100);
  if (f.kind === 'max') return { pct, tone: v > g ? 'bad' : 'ok' };
  return { pct, tone: v >= g ? 'ok' : '' };
}

            <button type="button" class="step" data-action="step" data-key="${f.key}" data-dir="1" aria-label="Increase ${f.label}">${icon('plus')}</button>

function viewProgress() {
  const all = Object.keys(S.checkins).sort().filter(d => num(S.checkins[d].weight) != null);
  const tIdx = clamp(dayIndex(today()), 0, PROFILE.weeks * 7 - 1);
  const last7 = all.filter(d => dayIndex(d) > tIdx - 7 && dayIndex(d) <= tIdx).map(d => num(S.checkins[d].weight));
  const avg7 = last7.length ? last7.reduce((a, b) => a + b, 0) / last7.length : (all.length ? num(S.checkins[all[all.length - 1]].weight) : null);
  const startW = all.length ? num(S.checkins[all[0]].weight) : null;
  const delta = avg7 != null && startW != null ? avg7 - startW : null;
  const toGoal = avg7 != null ? T.weight - avg7 : null;

  const st = buildLiftStats();
  const lifts = st.lifts;
  if (!UI.lift || (UI.lift !== 'ALL' && !lifts.some(l => l.name === UI.lift))) {
    const firstLogged = lifts.find(l => l.pts.length >= 2) || lifts.find(l => l.pts.length) || lifts[0];
    UI.lift = firstLogged ? firstLogged.name : 'ALL';
  }
  const selLift = UI.lift === 'ALL' ? null : lifts.find(l => l.name === UI.lift);
  const isE1 = UI.liftMode === 'e1rm';

  let bigVal = '—', bigUnit = '', subCap = '', side1 = '', side2 = '', kpiStart = '—', kpiPace = '—', kpiProj = '—';
  if (UI.lift === 'ALL') {
    const cur = st.idx.last ? st.idx.last.v : null;
    const slope = st.idx.reg ? st.idx.reg.slope : null;
    const proj = st.idx.reg ? st.idx.reg.at(PROFILE.weeks) : null;
    subCap = 'Compound strength index (vs Week 1)';
    bigVal = cur == null ? '—' : `${cur >= 0 ? '+' : '−'}${fmt(Math.abs(cur), 1)}`;
    bigUnit = cur == null ? '' : '%';
    side1 = slope != null ? `<div class="${slope >= 0 ? 'delta-up' : 'delta-down'} mono">${slope >= 0 ? '+' : '−'}${fmt(Math.abs(slope), 1)}% / wk</div>` : '<div>Log 2+ weeks for pace</div>';
    side2 = proj != null ? `W${PROFILE.weeks} trajectory: ${proj >= 0 ? '+' : '−'}${fmt(Math.abs(proj), 1)}%` : 'Across tracked compounds';
    kpiStart = '0.0%';
    kpiPace = slope != null ? `${slope >= 0 ? '+' : '−'}${fmt(Math.abs(slope), 1)}%/wk` : '—';
    kpiProj = proj != null ? `${proj >= 0 ? '+' : '−'}${fmt(Math.abs(proj), 1)}%` : '—';
  } else if (selLift) {
    const reg = isE1 ? selLift.regE : selLift.regW;
    const curV = selLift.last ? (isE1 ? selLift.last.e1rm : selLift.last.w) : null;
    const startV = selLift.first ? (isE1 ? selLift.first.e1rm : selLift.first.w) : null;
    const gain = curV != null && startV != null && selLift.pts.length >= 2 ? curV - startV : null;
    const slope = reg ? reg.slope : null;
    const proj = reg ? Math.max(0, reg.at(PROFILE.weeks)) : null;
    subCap = selLift.last ? `${isE1 ? 'Current est. 1RM' : 'Working weight'} · ${fw(selLift.last.w)} lb × ${selLift.last.r}` : (isE1 ? 'Estimated 1RM' : 'Working weight');
    bigVal = curV != null ? fmt(curV, isE1 ? 0 : (curV % 1 ? 1 : 0)) : '—';
    bigUnit = curV != null ? 'lb' : '';
    side1 = gain != null ? `<div class="${gain >= 0 ? 'delta-up' : 'delta-down'} mono">${gain >= 0 ? '+' : '−'}${fmt(Math.abs(gain), 1)} lb since W${selLift.first.wk}</div>` : '<div>Log 2+ weeks for pace</div>';
    side2 = proj != null ? `W${PROFILE.weeks} trajectory: ${fmt(proj, 0)} lb` : 'Linear strength projection';
    kpiStart = startV != null ? `${fmt(startV, isE1 ? 0 : (startV % 1 ? 1 : 0))} lb` : '—';
    kpiPace = slope != null ? `${slope >= 0 ? '+' : '−'}${fmt(Math.abs(slope), 1)} lb/wk` : '—';
    kpiProj = proj != null ? `${fmt(proj, 0)} lb` : '—';
  }

  const maxW = Math.max(1, ...lifts.flatMap(l => l.weeks.filter(Boolean).map(x => x.w)));
  const curWk = weekOf(today());

  const cal = Array.from({ length: PROFILE.weeks }, (_, w) => `<span class="mono">W${w + 1}</span>` + Array.from({ length: 7 }, (_, d) => {
    const di = w * 7 + d; const date = addDays(PROFILE.startDate, di); const c = S.checkins[date];
    const cls = di > dayIndex(today()) ? 'future' : isOnTarget(c) ? 'ok' : hasData(c) ? 'partial' : '';
    return `<i class="${cls}${date === today() ? ' today' : ''}" title="${shortDate(date)}"></i>`;
  }).join('')).join('');
  const onT = Object.values(S.checkins).filter(isOnTarget).length;
  const loggedDays = Object.values(S.checkins).filter(hasData).length;

  return `<section class="view">
    <div class="eyebrow">${PROFILE.phase || 'Current phase'} · Day ${clamp(dayIndex(today()) + 1, 1, PROFILE.weeks * 7)} of ${PROFILE.weeks * 7}</div>
    <h1>Progress</h1>
    <p class="lede">${loggedDays ? `${loggedDays} days logged · ${onT} on target` : 'Your strength and bodyweight trends appear as you log.'}</p>

    <div class="section-label">
      <span>Strength trajectory</span>
      ${UI.lift !== 'ALL' ? `<div class="mode-switch" role="group" aria-label="Strength metric">
        <button type="button" data-action="lift-mode" data-mode="e1rm" aria-pressed="${isE1}">Est. 1RM</button>
        <button type="button" data-action="lift-mode" data-mode="weight" aria-pressed="${!isE1}">Working lb</button>
      </div>` : '<span>Composite %</span>'}
    </div>
    <div class="card">
      <div class="lift-pills" role="tablist" aria-label="Select lift">
        <button type="button" class="lift-pill" role="tab" aria-selected="${UI.lift === 'ALL'}" data-action="pick-lift" data-name="ALL">All compounds</button>
        ${lifts.map(l => `<button type="button" class="lift-pill" role="tab" aria-selected="${UI.lift === l.name}" data-action="pick-lift" data-name="${esc(l.name)}">${esc(l.short)}</button>`).join('')}
      </div>
      <div class="stat-row">
        <div><div class="card-meta" style="margin-bottom:6px">${esc(subCap)}</div><div class="stat-big mono">${bigVal}${bigUnit ? `<small>${bigUnit}</small>` : ''}</div></div>
        <div class="stat-side">${side1}<div>${side2}</div></div>
      </div>
      <div class="chart tall" id="lchart"></div>
      <div class="legend">
        <span><i class="line" style="background:var(--accent)"></i>Logged</span>
        <span><i class="line" style="background:repeating-linear-gradient(90deg,#2DD4BF 0 4px,transparent 4px 7px)"></i>Trajectory to W${PROFILE.weeks}</span>
      </div>
      <div class="traj-kpis">
        <div class="traj-kpi"><span>Baseline</span><b class="mono">${kpiStart}</b></div>
        <div class="traj-kpi"><span>Weekly velocity</span><b class="mono ${kpiPace.startsWith('+') ? 'delta-up' : ''}">${kpiPace}</b></div>
        <div class="traj-kpi"><span>Proj. Week ${PROFILE.weeks}</span><b class="mono">${kpiProj}</b></div>
      </div>
    </div>

    <div class="section-label"><span>Compound lifts</span><span>Tap a lift to inspect curve</span></div>
    <div class="card">
      ${lifts.map(l => {
        const slope = l.regW ? l.regW.slope : null;
        return `<button type="button" class="lift${UI.lift === l.name ? ' is-sel' : ''}" data-action="pick-lift" data-name="${esc(l.name)}">
          <div class="lift-name">${esc(l.name)}</div>
          <div class="lift-e1rm mono">${l.best ? fmt(l.best) : '—'}<span class="lift-sub"> e1RM</span></div>
          <div class="lift-sub mono">${l.first ? `${fw(l.first.w)} → ${fw(l.last.w)} lb${slope != null ? ` · <span class="${slope >= 0 ? 'delta-up' : 'delta-down'}">${slope >= 0 ? '+' : '−'}${fmt(Math.abs(slope), 1)}/wk</span>` : ''}` : 'Not logged yet'}</div>
          <div class="lift-bars">${l.weeks.map((x, i) => `<i class="${x ? (i + 1 === curWk ? 'cur' : 'on') : ''}" style="height:${x ? 6 + (x.w / maxW) * 14 : 3}px"></i>`).join('')}</div>
        </button>`;
      }).join('')}
    </div>

    <div class="section-label">Bodyweight</div>
    <div class="card">
      <div class="stat-row">
        <div><div class="card-meta" style="margin-bottom:6px">7-day average</div><div class="stat-big mono">${fmt(avg7, 1)}<small>lb</small></div></div>
        <div class="stat-side">
          ${delta != null ? `<div class="${delta >= 0 === (T.weight >= (startW ?? 0)) ? 'delta-up' : 'delta-down'} mono">${delta >= 0 ? '+' : '−'}${fmt(Math.abs(delta), 1)} lb since start</div>` : ''}
          <div>${toGoal != null ? `${fmt(Math.abs(toGoal), 1)} lb ${toGoal > 0 ? 'to' : 'past'} ${fmt(T.weight)} goal` : `Goal ${fmt(T.weight)} lb`}</div>
        </div>
      </div>
      <div class="chart" id="wchart"></div>
    </div>

    <div class="section-label"><span>Consistency</span><span>Calories · protein · water · steps</span></div>
    <div class="card">
      <div class="grid-cal">${cal}</div>
      <div class="legend"><span><i style="background:var(--ok)"></i>All targets</span><span><i style="background:rgba(242,184,75,.55)"></i>Partial</span><span><i style="background:var(--surface-3)"></i>Missed</span></div>
    </div>
  </section>`;
}

function drawLiftChart() {
  const el = $('#lchart'); if (!el) return;
  const W = el.clientWidth || 320, H = el.clientHeight || 168, P = { t: 16, r: 14, b: 22, l: 38 };
  const st = buildLiftStats();
  const isAll = UI.lift === 'ALL';
  const isE1 = UI.liftMode === 'e1rm';
  let pts = [], reg = null, unit = 'lb';
  if (isAll) {
    pts = st.idx.pts.map(p => ({ wk: p.wk, v: p.v }));
    reg = st.idx.reg;
    unit = '%';
  } else {
    const l = st.lifts.find(x => x.name === UI.lift);
    if (l) {
      pts = l.pts.map(p => ({ wk: p.wk, v: isE1 ? p.e1rm : p.w }));
      reg = isE1 ? l.regE : l.regW;
    }
  }
  if (!pts.length) { el.innerHTML = `<div class="empty">Complete sets on this lift to see your strength trajectory.</div>`; return; }

  const weeks = PROFILE.weeks;
  const projEnd = reg ? (isAll ? reg.at(weeks) : Math.max(0, reg.at(weeks))) : null;
  const allVals = pts.map(p => p.v).concat(projEnd != null ? [projEnd, reg.at(pts[0].wk)] : []);
  const minV = Math.min(...allVals), maxV = Math.max(...allVals);
  const padV = Math.max(isAll ? 2 : 5, (maxV - minV) * 0.22);
  const lo = isAll ? Math.floor(minV - padV) : Math.max(0, Math.floor((minV - padV) / 5) * 5);
  const hi = Math.ceil((maxV + padV) / (isAll ? 2 : 5)) * (isAll ? 2 : 5) || (lo + 10);

  const x = wk => P.l + ((wk - 1) / Math.max(1, weeks - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / Math.max(1, hi - lo)) * (H - P.t - P.b);
  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  const last = pts[pts.length - 1];
  const linePath = pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.wk).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const areaPath = pts.length >= 2 ? `${linePath} L${x(last.wk).toFixed(1)},${(H - P.b).toFixed(1)} L${x(pts[0].wk).toFixed(1)},${(H - P.b).toFixed(1)} Z` : '';

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Strength trajectory">
    <defs><linearGradient id="lfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".16"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.06)"/><text x="${P.l - 7}" y="${y(t) + 3.5}" text-anchor="end" font-size="10" fill="#5F6B6B" font-family="Geist Mono, ui-monospace, monospace">${isAll && t > 0 ? '+' + t + '%' : isAll ? t + '%' : t}</text>`).join('')}
    ${Array.from({ length: weeks }, (_, w) => `<text x="${x(w + 1)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="#5F6B6B" font-family="Geist Mono, ui-monospace, monospace">W${w + 1}</text>`).join('')}
    ${areaPath ? `<path d="${areaPath}" fill="url(#lfill)"/>` : ''}
    ${reg ? `<line x1="${x(pts[0].wk).toFixed(1)}" y1="${y(reg.at(pts[0].wk)).toFixed(1)}" x2="${x(last.wk).toFixed(1)}" y2="${y(reg.at(last.wk)).toFixed(1)}" stroke="rgba(255,255,255,.22)" stroke-width="1.25" stroke-dasharray="2 3"/>` : ''}
    ${reg && last.wk < weeks ? `<line x1="${x(last.wk).toFixed(1)}" y1="${y(last.v).toFixed(1)}" x2="${x(weeks).toFixed(1)}" y2="${y(projEnd).toFixed(1)}" stroke="#2DD4BF" stroke-opacity=".75" stroke-width="1.75" stroke-dasharray="4 4"/>
      <circle cx="${x(weeks).toFixed(1)}" cy="${y(projEnd).toFixed(1)}" r="3.8" fill="#0C1011" stroke="#2DD4BF" stroke-width="1.8"/>
      <text x="${x(weeks) - 6}" y="${Math.max(12, y(projEnd) - 8)}" text-anchor="end" font-size="10" fill="#9AA7A6" font-family="Geist Mono, ui-monospace, monospace">${isAll ? (projEnd >= 0 ? '+' : '') + fmt(projEnd, 1) + '%' : fmt(projEnd, 0) + ' ' + unit}</text>` : ''}
    ${pts.length >= 2 ? `<path d="${linePath}" fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${pts.map((p, k) => `<circle cx="${x(p.wk).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${k === pts.length - 1 ? 4.2 : 2.8}" fill="#2DD4BF" stroke="#0C1011" stroke-width="${k === pts.length - 1 ? 2 : 1.2}"/>`).join('')}
  </svg>`;
}

function drawWeightChart() {
  const el = $('#wchart'); if (!el) return;
  const W = el.clientWidth || 320, H = el.clientHeight || 150, P = { t: 10, r: 6, b: 20, l: 34 };
  const total = PROFILE.weeks * 7;
  const pts = Object.keys(S.checkins).sort().map(d => ({ i: dayIndex(d), v: num(S.checkins[d].weight) })).filter(p => p.v != null && p.i >= 0 && p.i < total);
  if (!pts.length) { el.innerHTML = `<div class="empty">Log your morning weight to see the trend.</div>`; return; }
  const vals = pts.map(p => p.v).concat([T.weight]);
  const lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 0.5);
  const x = i => P.l + (i / (total - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const avg = pts.map(p => { const win = pts.filter(q => q.i <= p.i && q.i > p.i - 7); return { i: p.i, v: win.reduce((a, q) => a + q.v, 0) / win.length }; });
  const path = avg.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  const last = avg[avg.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight trend">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.06)"/><text x="${P.l - 8}" y="${y(t) + 3.5}" text-anchor="end" font-size="10" fill="#5F6B6B" font-family="Geist Mono, ui-monospace, monospace">${t}</text>`).join('')}
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(T.weight)}" y2="${y(T.weight)}" stroke="#9AA7A6" stroke-dasharray="3 4" stroke-width="1"/>
    <text x="${W - P.r}" y="${y(T.weight) - 6}" text-anchor="end" font-size="10" fill="#9AA7A6" font-family="Geist, ui-sans-serif, system-ui">Goal ${T.weight}</text>
    ${Array.from({ length: PROFILE.weeks }, (_, w) => `<text x="${x(w * 7 + 3)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="#5F6B6B" font-family="Geist Mono, ui-monospace, monospace">W${w + 1}</text>`).join('')}
    ${pts.map(p => `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2" fill="#2F3A3A"/>`).join('')}
    <path d="${path}" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last.i)}" cy="${y(last.v)}" r="4" fill="#2DD4BF" stroke="#0C1011" stroke-width="2"/>
  </svg>`;
}

/* ---------- actions ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function enqueue(ev, ref) {
  S.queue = S.queue.filter(q => q.ref !== ref);
  S.queue.push(Object.assign({ id: uid(), ts: new Date().toISOString(), ref }, ev));
}

function toggleSet(name, j) {
  const p = PROGRAM.find(x => x.name === name && x.day === UI.day) || PROGRAM.find(x => x.name === name); if (!p) return;
  const sess = ensureSession(UI.week, UI.day);
  const e = sess.ex[name]; const s = e.sets[j];
  if (!s.done) {
    const prev = e.sets.slice(0, j).reverse().find(x => x.done);
    const last = lastPerf(name, UI.week, UI.day);
    if (s.w === '') s.w = prev ? prev.w : (last && last.w != null ? last.w : (p.bw ? 0 : ''));
    if (s.r === '' && p.reps) s.r = prev && !p.reps ? prev.r : p.reps;
    if (s.w === '') { toast('Enter a weight first'); focusInput(name, j, 'w'); return; }
    if (s.r === '') { toast('Enter your reps'); focusInput(name, j, 'r'); return; }
    s.done = true;
    navigator.vibrate && navigator.vibrate(12);
    startTimer(p.rest, name);
    if (e.sets.every(x => x.done)) {
      const next = PROGRAM.filter(x => x.day === UI.day).find(x => !sess.ex[x.name].sets.every(y => y.done));
      UI.open = next ? next.name : null;
    }
  } else {
    s.done = false;
  }
  sess.dirty = true; save(); render();
  const openEl = document.querySelector('.ex.is-open');
  if (openEl && UI.open !== name) openEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function focusInput(name, j, field) {
  const el = [...document.querySelectorAll('[data-field]')].find(i => i.dataset.name === name && +i.dataset.set === j && i.dataset.field === field);
  el && el.focus();
}

function finishSession() {
  const sess = ensureSession(UI.week, UI.day);
  const list = PROGRAM.filter(p => p.day === UI.day);
  const n = list.reduce((a, p) => a + sess.ex[p.name].sets.filter(s => s.done).length, 0);
  if (!n) { toast('Log at least one set first'); return; }
  sess.finishedAt = sess.finishedAt || Date.now(); sess.dirty = true;
  enqueue({ type: 'session', week: UI.week, day: UI.day, exercises: list.map(p => ({ name: p.name, note: sess.ex[p.name].note || '', sets: sess.ex[p.name].sets.map(s => ({ w: num(s.w), r: num(s.r), rpe: num(s.rpe), done: !!s.done })) })) }, `${UI.week}:${UI.day}`);
  stopTimer(); save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  toast(S.settings.url ? 'Session saved — syncing' : 'Session saved on this phone');
  flush();
}

function setCheckin(key, val) {
  const c = S.checkins[UI.date] || (S.checkins[UI.date] = {});
  c[key] = val; c.dirty = true; save();
}
function updateMetric(key) {
  const f = FIELDS.find(x => x.key === key); if (!f) return;
  const c = S.checkins[UI.date] || {}; const v = num(c[key]);
  const h = hintFor(f, v); const hint = $('#hint-' + key);
  if (hint) { hint.textContent = h.text; hint.dataset.tone = h.tone; }
  const bar = $('#bar-' + key); if (bar) { const b = barFor(f, v); bar.style.width = b.pct + '%'; bar.dataset.tone = b.tone; }
  const hs = hits(c); const vn = $('#verdict-n');
  if (vn) { vn.textContent = `${hs.filter(Boolean).length} of 4`; document.querySelectorAll('#verdict .pips i').forEach((el, i) => el.classList.toggle('on', hs[i])); }
}
function stepField(key, dir) {
  const f = FIELDS.find(x => x.key === key); const c = S.checkins[UI.date] || {};
  let v = num(c[key]);
  if (v == null) {
    if (key === 'weight') { const prev = Object.keys(S.checkins).sort().filter(d => d < UI.date && num(S.checkins[d].weight) != null).pop(); v = prev ? num(S.checkins[prev].weight) : T.weight; }
    else v = f.goal ? f.goal() : 0;
  } else v = v + dir * f.step;
  v = Math.max(0, Math.round(v / f.step) * f.step);
  v = +v.toFixed(f.dec);
  setCheckin(key, v);
  const inp = $('#ck-' + key); if (inp) inp.value = v;
  updateMetric(key);
}
function saveCheckin() {
  const c = S.checkins[UI.date] || {};
  if (!hasData(c) && !num(c.shoulder) && !c.notes) { toast('Add at least one number first'); return; }
  c.saved = true; c.dirty = true; S.checkins[UI.date] = c;
  const ev = { type: 'checkin', date: UI.date };
  FIELDS.forEach(f => { ev[f.key] = num(c[f.key]); });
  ev.shoulder = num(c.shoulder); ev.readiness = num(c.readiness); ev.notes = c.notes || '';
  enqueue(ev, UI.date);
  save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  toast(S.settings.url ? 'Check-in saved — syncing' : 'Check-in saved on this phone');
  flush();
}

/* ---------- rest timer ---------- */
function startTimer(sec, name) {
  UI.timer = { end: Date.now() + sec * 1000, total: sec, name, doneAt: null };
  $('#timer').hidden = false; tick();
  clearInterval(startTimer._i); startTimer._i = setInterval(tick, 250);
}
function stopTimer() { clearInterval(startTimer._i); UI.timer = null; $('#timer').hidden = true; }
function tick() {
  const t = UI.timer; if (!t) return;
  const left = (t.end - Date.now()) / 1000;
  const timeEl = $('#timer-time');
  $('#timer-label').textContent = left > 0 ? `Rest · ${t.name}` : 'Rest complete';
  timeEl.textContent = left > 0 ? clock(left) : 'Go';
  timeEl.classList.toggle('done', left <= 0);
  $('#timer-bar').style.width = clamp((1 - left / t.total) * 100, 0, 100) + '%';
  if (left <= 0 && !t.doneAt) { t.doneAt = Date.now(); navigator.vibrate && navigator.vibrate([90, 50, 90]); }
  if (t.doneAt && Date.now() - t.doneAt > 4000) stopTimer();
}

/* ---------- sync ---------- */
let syncing = false;
function endpoint(params) {
  const u = new URL(S.settings.url);
  if (S.settings.token) u.searchParams.set('token', S.settings.token);
  Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  return u.toString();
}
async function flush() {
  if (!S.settings.url || syncing) { renderChip(); return; }
  syncing = true; renderChip();
  const batch = S.queue.slice();
  try {
    let j;
    if (batch.length) {
      const res = await fetch(S.settings.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.settings.token, events: batch }) });
      j = await res.json();
      if (!j.ok) throw new Error(j.error || 'Sync failed');
      const ids = new Set(batch.map(b => b.id));
      S.queue = S.queue.filter(q => !ids.has(q.id));
      batch.forEach(b => { const item = b.type === 'session' ? S.sessions[b.ref] : S.checkins[b.ref]; if (item && !S.queue.some(q => q.ref === b.ref)) item.dirty = false; });
    } else {
      const res = await fetch(endpoint());
      j = await res.json();
      if (!j.ok) throw new Error(j.error || 'Could not load your program');
    }
    if (j.data) applyRemote(j.data);
    S.lastSync = Date.now(); S.syncError = null;
  } catch (err) {
    S.syncError = String((err && err.message) || err);
  }
  syncing = false; save();
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#view') && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  typing ? renderChip() : render();
}

function labelFrom(target) {
  const part = String(target || '').split(/x|×/i)[1];
  return part ? part.trim().replace(/\s*\/\s*/g, '/').replace(/\s+per\s+/i, '/') : '';
}
function applyRemote(d) {
  if (d.profile) {
    const p = d.profile;
    const hasSh = /shoulder|labrum|cuff|ac joint/i.test(p.injuries || '');
    PROFILE = Object.assign({}, PROFILE, {
      name: p.name || PROFILE.name,
      phase: p.program ? (String(p.program).split(/[—–-]/).pop().trim() || PROFILE.phase) : PROFILE.phase,
      startDate: p.startDate || PROFILE.startDate,
      weeks: p.weeks || PROFILE.weeks,
      jointLabel: hasSh ? 'Shoulder comfort' : 'Joint comfort',
    });
    S.profile = PROFILE;
    if (p.name && (!S.settings.name || S.settings.name === ACTIVE_PRESET.profile.name)) S.settings.name = p.name;
  }
  if (d.targets) { Object.keys(T).forEach(k => { if (d.targets[k] != null) T[k] = d.targets[k]; }); S.targets = T; }
  const tr = d.training || [];
  const w1 = tr.filter(r => r.week === 1 && r.exercise);
  if (w1.length) {
    const allKnown = [...SCOTT_PROGRAM, ...EMILY_PROGRAM, ...CHARLES_PROGRAM];
    PROGRAM = w1.map(r => {
      const old = allKnown.find(b => b.name === r.exercise && b.day === r.day) || allKnown.find(b => b.name === r.exercise) || {};
      return { day: r.day, name: r.exercise, sets: r.sets || old.sets || 3, reps: r.reps || null, label: labelFrom(r.target) || old.label || String(r.reps || ''), rest: old.rest || (/squat|deadlift|thrust/i.test(r.exercise) ? 150 : /press|row|pull/i.test(r.exercise) ? 90 : 60), bw: old.bw || /push-?up|pull-?up|chin-?up|dip|knee raise|plank/i.test(r.exercise), cue: r.cue || old.cue || '' };
    });
    S.program = PROGRAM;
    if (!days().includes(UI.day)) UI.day = defaultDay(UI.week);
  }
  const groups = {};
  tr.forEach(r => { if (r.week && r.day) (groups[`${r.week}:${r.day}`] = groups[`${r.week}:${r.day}`] || []).push(r); });
  Object.entries(groups).forEach(([k, rows]) => {
    const local = S.sessions[k];
    if (local && (local.dirty || S.queue.some(q => q.ref === k))) return;
    if (!rows.some(r => r.weight != null || r.done)) return;
    const ex = {};
    rows.forEach(r => {
      const prevLocal = local && local.ex[r.exercise];
      if (prevLocal && prevLocal.sets.some(s => s.done)) { ex[r.exercise] = prevLocal; return; }
      const n = (PROGRAM.find(p => p.name === r.exercise && p.day === r.day) || PROGRAM.find(p => p.name === r.exercise) || {}).sets || r.sets || 3;
      const has = r.weight != null;
      ex[r.exercise] = { note: r.note || '', sets: Array.from({ length: n }, () => ({ w: has ? r.weight : '', r: r.actualReps ?? r.reps ?? '', rpe: r.rpe ?? '', done: !!r.done && has })) };
    });
    S.sessions[k] = { ex: Object.assign({}, local ? local.ex : {}, ex), finishedAt: rows.every(r => r.done) ? ((local && local.finishedAt) || Date.now()) : ((local && local.finishedAt) || null), dirty: false };
  });
  (d.daily || []).forEach(r => {
    if (!r.date) return;
    const l = S.checkins[r.date];
    if (l && (l.dirty || S.queue.some(q => q.ref === r.date))) return;
    if (!['weight','calories','protein','water','steps','shoulder'].some(k => r[k] != null)) return;
    S.checkins[r.date] = { weight: r.weight, calories: r.calories, protein: r.protein, carbs: r.carbs, fats: r.fats, water: r.water, steps: r.steps, sleep: r.sleep, shoulder: r.shoulder, readiness: r.readiness, notes: r.notes || '', saved: true, dirty: false };
  });
}

/* ---------- settings ---------- */
function openSettings() {
  $('#set-name').value = S.settings.name || '';
  $('#set-url').value = S.settings.url || '';
  $('#set-token').value = S.settings.token || '';
  const st = $('#sync-status');
  st.dataset.tone = S.syncError ? 'bad' : S.lastSync ? 'ok' : '';
  st.textContent = S.syncError ? `Last attempt failed: ${S.syncError}` : S.lastSync ? `Last synced ${relTime(S.lastSync)}${S.queue.length ? ` · ${S.queue.length} waiting` : ''}` : S.queue.length ? `${S.queue.length} item${S.queue.length > 1 ? 's' : ''} saved on this phone` : '';
  const switchLinks = [['scott', 'Scott'], ['emily', 'Emily'], ['charles', 'Charles']]
    .filter(([k]) => PRESETS[k] !== ACTIVE_PRESET)
    .map(([k, lbl]) => { const u = new URL(location.href); u.searchParams.set('client', k); u.hash = ''; return `<a href="${esc(u.toString())}" style="color:var(--accent);font-weight:500;text-decoration:none">${lbl} →</a>`; })
    .join('<span style="color:var(--text-3)">·</span>');
  const isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  const pwaNote = isStandalone ? '' : `<div class="demo-note"><strong style="color:var(--text)">Install as iPhone app:</strong> In Safari, tap <strong>Share ↑</strong> → <strong>Add to Home Screen</strong> for full-screen mode &amp; custom CLF icon.</div>`;
  $('#demo-note').innerHTML = `${pwaNote}${S.demo ? `<div class="demo-note">You're looking at sample data. It's cleared as soon as you connect a sync URL.</div>` : ''}<div class="demo-note" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>Profile: <strong>${esc(PROFILE.name)}</strong></span><span style="display:inline-flex;gap:8px;align-items:center">${switchLinks}</span></div>`;
  $('#settings').showModal();
}
async function testConnection() {
  const url = $('#set-url').value.trim(); const st = $('#sync-status');
  if (!url) { st.dataset.tone = 'bad'; st.textContent = 'Paste the sync URL from your coach first.'; return; }
  st.dataset.tone = ''; st.textContent = 'Checking…';
  try {
    const u = new URL(url); const tok = $('#set-token').value.trim(); if (tok) u.searchParams.set('token', tok);
    const j = await (await fetch(u)).json();
    if (!j.ok) throw new Error(j.error || 'Unexpected response');
    st.dataset.tone = 'ok'; st.textContent = `Connected to ${j.data && j.data.profile && j.data.profile.name ? j.data.profile.name + "'s sheet" : 'your sheet'}.`;
  } catch (err) { st.dataset.tone = 'bad'; st.textContent = `Couldn't connect — ${err.message || err}`; }
}
function saveSettings() {
  const url = $('#set-url').value.trim();
  if (url && url !== S.settings.url && S.demo) clearDemo();
  S.settings = { name: $('#set-name').value.trim() || PROFILE.name, url, token: $('#set-token').value.trim() };
  S.syncError = null; save(); $('#settings').close(); render(); toast('Settings saved');
  if (url) flush();
}
function exportCSV() {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const sets = [['Week','Day','Exercise','Set','Weight (lb)','Reps','RPE','Completed','Note']];
  Object.entries(S.sessions).sort().forEach(([k, s]) => { const [w, d] = k.split(':'); Object.entries(s.ex).forEach(([name, e]) => e.sets.forEach((x, i) => { if (x.done || x.w !== '') sets.push([w, d, name, i + 1, x.w, x.r, x.rpe, x.done ? 'Yes' : 'No', i === 0 ? e.note : '']); })); });
  const daily = [['Date','Weight (lb)','Calories','Protein (g)','Carbs (g)','Fat (g)','Water (oz)','Steps','Sleep (h)','Joint / Shoulder','Readiness','Notes']];
  Object.keys(S.checkins).sort().forEach(d => { const c = S.checkins[d]; if (hasData(c) || c.notes) daily.push([d, c.weight, c.calories, c.protein, c.carbs, c.fats, c.water, c.steps, c.sleep, c.shoulder, c.readiness, c.notes]); });
  const dl = (name, rows) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
  const slug = (S.settings.name || 'client').toLowerCase().replace(/\W+/g, '-');
  dl(`${slug}-sets.csv`, sets); setTimeout(() => dl(`${slug}-checkins.csv`, daily), 300);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  const a = t.dataset.action;
  if (a === 'tab') { UI.tab = t.dataset.tab; render(); window.scrollTo({ top: 0 }); }
  else if (a === 'day') { UI.day = t.dataset.day; UI.open = null; render(); }
  else if (a === 'week') { UI.week = clamp(UI.week + +t.dataset.dir, 1, PROFILE.weeks); UI.day = defaultDay(UI.week); UI.open = null; render(); }
  else if (a === 'toggle') { UI.open = UI.open === t.dataset.name ? null : t.dataset.name; render(); }
  else if (a === 'check') toggleSet(t.dataset.name, +t.dataset.set);
  else if (a === 'finish') finishSession();
  else if (a === 'date') { UI.date = addDays(UI.date, +t.dataset.dir); render(); }
  else if (a === 'step') stepField(t.dataset.key, +t.dataset.dir);
  else if (a === 'scale') { setCheckin(t.dataset.key, +t.dataset.val); render(); }
  else if (a === 'save-checkin') saveCheckin();
  else if (a === 'pick-lift') { UI.lift = t.dataset.name; render(); }
  else if (a === 'lift-mode') { UI.liftMode = t.dataset.mode; render(); }
  else if (a === 'settings') openSettings();
  else if (a === 'save-settings') saveSettings();
  else if (a === 'test') testConnection();
  else if (a === 'export') exportCSV();
  else if (a === 'reset') { if (confirm('Remove all logs and settings from this phone? Anything already synced stays in your coach\'s sheet.')) { localStorage.removeItem(KEY); location.reload(); } }
  else if (a === 'timer-add' && UI.timer) { UI.timer.end += +t.dataset.sec * 1000; UI.timer.total = Math.max(1, UI.timer.total + +t.dataset.sec); UI.timer.doneAt = null; tick(); }
  else if (a === 'timer-skip') stopTimer();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.field && el.dataset.name) {
    const sess = ensureSession(UI.week, UI.day);
    const s = sess.ex[el.dataset.name].sets[+el.dataset.set];
    s[el.dataset.field] = el.value.trim(); sess.dirty = true; save();
  } else if (el.dataset.note) {
    const sess = ensureSession(UI.week, UI.day);
    sess.ex[el.dataset.note].note = el.value; sess.dirty = true; save();
  } else if (el.dataset.ck) {
    const k = el.dataset.ck;
    setCheckin(k, k === 'notes' ? el.value : el.value.trim());
    updateMetric(k);
  }
});
window.addEventListener('resize', () => { if (UI.tab === 'progress') { drawWeightChart(); drawLiftChart(); } });
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { renderChip(); flush(); } });
setInterval(renderChip, 30000);

render();
flush();
})();
</script>
